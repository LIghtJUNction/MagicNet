<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Defense-in-depth CSP. The WebView's JS bridge is a root shell, so a single
      injected remote script would be catastrophic. This UI loads no remote code
      and makes no network calls (all I/O is delegated to the root CLI), so we can
      lock scripts/connections to same-origin. 'unsafe-inline' is required for the
      theme-flash script above and Vue/Tailwind inline styles; data: covers the
      SVG favicon and Vite-inlined assets.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>MagicNet</title>
    <link id="magicnet-favicon" rel="icon" type="image/png" />
    <script>
      /* Avoid flash before Vue mounts */
      try {
        var t = localStorage.getItem("magicnet.webui.theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
