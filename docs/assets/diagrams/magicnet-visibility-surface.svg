<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MagicNet visibility and operational surface comparison</title>
  <desc id="desc">Comparison of app proxy, Android VPN, TUN root mode, and MagicNet eBPF path across user visible VPN, per-app proxy setup, iptables dependency, and netd coexistence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:43px;font-weight:850;fill:#f8fafc}
      .sub{font-size:18px;fill:#94a3b8}
      .head{font-size:16px;font-weight:800;fill:#cbd5e1}
      .label{font-size:18px;font-weight:750;fill:#e5e7eb}
      .cell{font-size:17px;font-weight:750;fill:#f8fafc}
      .muted{font-size:14px;fill:#94a3b8}
      .ok{fill:#10b981}.warn{fill:#f59e0b}.bad{fill:#ef4444}.info{fill:#38bdf8}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="48" y="42" width="1184" height="636" rx="26" fill="#0f172a" stroke="#233146"/>
  <text x="88" y="103" class="title">Visibility Surface</text>
  <text x="88" y="140" class="sub">Lower app-visible setup, fewer kernel routing assumptions, explicit netd coexistence checks.</text>

  <g transform="translate(88 198)">
    <rect x="0" y="0" width="1104" height="382" rx="20" fill="#0b1323" stroke="#243449"/>
    <text x="32" y="48" class="head">Path</text>
    <text x="250" y="48" class="head">VPN indicator</text>
    <text x="472" y="48" class="head">Per-app setup</text>
    <text x="692" y="48" class="head">iptables/TProxy</text>
    <text x="914" y="48" class="head">netd BPF</text>

    <line x1="0" y1="74" x2="1104" y2="74" stroke="#263244"/>
    <line x1="0" y1="151" x2="1104" y2="151" stroke="#1f2937"/>
    <line x1="0" y1="228" x2="1104" y2="228" stroke="#1f2937"/>
    <line x1="0" y1="305" x2="1104" y2="305" stroke="#1f2937"/>

    <text x="32" y="123" class="label">App proxy</text>
    <circle cx="296" cy="116" r="13" class="ok"/><text x="322" y="123" class="cell">none</text>
    <circle cx="518" cy="116" r="13" class="bad"/><text x="544" y="123" class="cell">manual</text>
    <circle cx="738" cy="116" r="13" class="ok"/><text x="764" y="123" class="cell">none</text>
    <circle cx="960" cy="116" r="13" class="warn"/><text x="986" y="123" class="cell">bypass</text>

    <text x="32" y="200" class="label">Android VPN</text>
    <circle cx="296" cy="193" r="13" class="bad"/><text x="322" y="200" class="cell">visible</text>
    <circle cx="518" cy="193" r="13" class="ok"/><text x="544" y="200" class="cell">none</text>
    <circle cx="738" cy="193" r="13" class="ok"/><text x="764" y="200" class="cell">none</text>
    <circle cx="960" cy="193" r="13" class="warn"/><text x="986" y="200" class="cell">system VPN</text>

    <text x="32" y="277" class="label">MagicNet TUN</text>
    <circle cx="296" cy="270" r="13" class="ok"/><text x="322" y="277" class="cell">none</text>
    <circle cx="518" cy="270" r="13" class="ok"/><text x="544" y="277" class="cell">none</text>
    <circle cx="738" cy="270" r="13" class="warn"/><text x="764" y="277" class="cell">route rules</text>
    <circle cx="960" cy="270" r="13" class="warn"/><text x="986" y="277" class="cell">coexists</text>

    <text x="32" y="354" class="label">MagicNet eBPF</text>
    <circle cx="296" cy="347" r="13" class="ok"/><text x="322" y="354" class="cell">none</text>
    <circle cx="518" cy="347" r="13" class="ok"/><text x="544" y="354" class="cell">none</text>
    <circle cx="738" cy="347" r="13" class="ok"/><text x="764" y="354" class="cell">avoids</text>
    <circle cx="960" cy="347" r="13" class="info"/><text x="986" y="354" class="cell">queried</text>
  </g>

  <g transform="translate(88 616)">
    <text x="0" y="0" class="muted">Meaning: this measures operational surface, not bypass guarantees. MagicNet keeps eBPF promotion explicit and falls back to TUN when probes fail.</text>
  </g>
</svg>
