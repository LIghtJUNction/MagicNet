<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MagicNet eBPF and TUN performance comparison</title>
  <desc id="desc">PHK110 Android 16, Baidu HTTPS IPv4, five-run average. TUN total 207.2ms. eBPF TCP bridge total 220.8ms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tun" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ebpf" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:44px;font-weight:800;fill:#f8fafc}
      .sub{font-size:18px;fill:#94a3b8}
      .label{font-size:21px;font-weight:700;fill:#e5e7eb}
      .small{font-size:15px;fill:#94a3b8}
      .num{font-size:42px;font-weight:850;fill:#fff}
      .axis{stroke:#334155;stroke-width:1}
      .grid{stroke:#1f2937;stroke-width:1}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="48" y="42" width="1184" height="636" rx="26" fill="#0f172a" stroke="#233146"/>
  <text x="88" y="104" class="title">Performance: TUN vs eBPF TCP Bridge</text>
  <text x="88" y="140" class="sub">PHK110 · Android 16 · sing-box · HTTPS IPv4 · 5-run average</text>

  <g transform="translate(88 205)">
    <text x="0" y="0" class="label">Total request time</text>
    <line x1="220" y1="30" x2="220" y2="265" class="grid"/>
    <line x1="420" y1="30" x2="420" y2="265" class="grid"/>
    <line x1="620" y1="30" x2="620" y2="265" class="grid"/>
    <line x1="820" y1="30" x2="820" y2="265" class="grid"/>
    <text x="208" y="292" class="small">50</text>
    <text x="404" y="292" class="small">100</text>
    <text x="604" y="292" class="small">150</text>
    <text x="804" y="292" class="small">200 ms</text>

    <text x="0" y="83" class="label">TUN</text>
    <rect x="140" y="52" width="829" height="44" rx="22" fill="url(#tun)"/>
    <text x="990" y="84" class="num">207.2</text>

    <text x="0" y="170" class="label">eBPF</text>
    <rect x="140" y="139" width="883" height="44" rx="22" fill="url(#ebpf)"/>
    <text x="1044" y="171" class="num">220.8</text>

    <text x="0" y="245" class="small">Delta: +13.6 ms / +6.6%. Public network latency dominates; eBPF is optimized for earlier interception and lower routing dependency.</text>
  </g>

  <g transform="translate(88 565)">
    <rect x="0" y="0" width="340" height="72" rx="18" fill="#111c2f" stroke="#243449"/>
    <text x="24" y="30" class="small">TCP connect</text>
    <text x="24" y="58" class="label">5.2 ms vs 5.6 ms</text>
    <rect x="382" y="0" width="340" height="72" rx="18" fill="#111c2f" stroke="#243449"/>
    <text x="406" y="30" class="small">First byte</text>
    <text x="406" y="58" class="label">206.9 ms vs 220.3 ms</text>
    <rect x="764" y="0" width="340" height="72" rx="18" fill="#111c2f" stroke="#243449"/>
    <text x="788" y="30" class="small">Primary win</text>
    <text x="788" y="58" class="label">No TProxy dependency</text>
  </g>
</svg>
