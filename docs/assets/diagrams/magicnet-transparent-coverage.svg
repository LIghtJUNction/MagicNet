<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MagicNet transparent interception coverage</title>
  <desc id="desc">Coverage matrix for app setup, TCP, DNS TCP 53, DNS UDP 53, UDP fallback, IPv6, DNS leak guard, and fallback across app proxy, Android VPN, MagicNet TUN, and MagicNet eBPF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:43px;font-weight:850;fill:#f8fafc}
      .sub{font-size:18px;fill:#94a3b8}
      .axis{font-size:15px;font-weight:800;fill:#cbd5e1}
      .label{font-size:18px;font-weight:750;fill:#e5e7eb}
      .note{font-size:14px;fill:#94a3b8}
      .score{font-size:18px;font-weight:850;fill:#fff}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="48" y="42" width="1184" height="636" rx="26" fill="#0f172a" stroke="#233146"/>
  <text x="88" y="103" class="title">Transparent Coverage</text>
  <text x="88" y="140" class="sub">0 = manual / missing · 1 = partial · 2 = transparent default</text>

  <g transform="translate(88 198)">
    <text x="0" y="0" class="axis">App setup</text>
    <text x="140" y="0" class="axis">TCP</text>
    <text x="270" y="0" class="axis">DNS TCP</text>
    <text x="420" y="0" class="axis">DNS UDP</text>
    <text x="570" y="0" class="axis">UDP fallback</text>
    <text x="720" y="0" class="axis">IPv6</text>
    <text x="840" y="0" class="axis">Leak guard</text>
    <text x="1010" y="0" class="axis">Fallback</text>

    <g transform="translate(0 50)">
      <text x="0" y="18" class="label">App proxy</text>
      <g fill="#ef4444"><circle cx="36" cy="62" r="24"/><circle cx="176" cy="62" r="24"/><circle cx="306" cy="62" r="24"/><circle cx="456" cy="62" r="24"/><circle cx="606" cy="62" r="24"/><circle cx="756" cy="62" r="24"/><circle cx="896" cy="62" r="24"/><circle cx="1066" cy="62" r="24"/></g>
      <g class="score"><text x="30" y="69">0</text><text x="170" y="69">0</text><text x="300" y="69">0</text><text x="450" y="69">0</text><text x="600" y="69">0</text><text x="750" y="69">0</text><text x="890" y="69">0</text><text x="1060" y="69">0</text></g>
    </g>

    <g transform="translate(0 150)">
      <text x="0" y="18" class="label">Android VPN</text>
      <g fill="#10b981"><circle cx="36" cy="62" r="24"/><circle cx="176" cy="62" r="24"/><circle cx="306" cy="62" r="24"/><circle cx="456" cy="62" r="24"/><circle cx="606" cy="62" r="24"/><circle cx="756" cy="62" r="24"/><circle cx="896" cy="62" r="24"/></g>
      <circle cx="1066" cy="62" r="24" fill="#f59e0b"/>
      <g class="score"><text x="30" y="69">2</text><text x="170" y="69">2</text><text x="300" y="69">2</text><text x="450" y="69">2</text><text x="600" y="69">2</text><text x="750" y="69">2</text><text x="890" y="69">2</text><text x="1060" y="69">1</text></g>
    </g>

    <g transform="translate(0 250)">
      <text x="0" y="18" class="label">MagicNet TUN</text>
      <g fill="#10b981"><circle cx="36" cy="62" r="24"/><circle cx="176" cy="62" r="24"/><circle cx="306" cy="62" r="24"/><circle cx="456" cy="62" r="24"/><circle cx="606" cy="62" r="24"/><circle cx="756" cy="62" r="24"/><circle cx="896" cy="62" r="24"/><circle cx="1066" cy="62" r="24"/></g>
      <g class="score"><text x="30" y="69">2</text><text x="170" y="69">2</text><text x="300" y="69">2</text><text x="450" y="69">2</text><text x="600" y="69">2</text><text x="750" y="69">2</text><text x="890" y="69">2</text><text x="1060" y="69">2</text></g>
    </g>

    <g transform="translate(0 350)">
      <text x="0" y="18" class="label">MagicNet eBPF</text>
      <g fill="#10b981"><circle cx="36" cy="62" r="24"/><circle cx="176" cy="62" r="24"/><circle cx="306" cy="62" r="24"/><circle cx="456" cy="62" r="24"/><circle cx="756" cy="62" r="24"/><circle cx="896" cy="62" r="24"/><circle cx="1066" cy="62" r="24"/></g>
      <circle cx="606" cy="62" r="24" fill="#f59e0b"/>
      <g class="score"><text x="30" y="69">2</text><text x="170" y="69">2</text><text x="300" y="69">2</text><text x="450" y="69">2</text><text x="600" y="69">1</text><text x="750" y="69">2</text><text x="890" y="69">2</text><text x="1060" y="69">2</text></g>
    </g>
  </g>

  <text x="88" y="642" class="note">eBPF mode is TCP-first: UDP-sensitive traffic stays covered by the TUN fallback path for compatibility.</text>
</svg>
