[workspace]
members = ["crates/kamfw", "crates/magicnet-core", "crates/magicnet-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
