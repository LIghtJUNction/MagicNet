# MagicNet managed TUN network policy.
# ipv4_only is the compatibility fallback for networks or nodes without IPv6.
MAGICNET_IPV6_MODE=prefer_ipv4
MAGICNET_TUN_MTU=1400
MAGICNET_UDP_TIMEOUT=5m
# DNS capture inbound and iptables redirect share this port. Change both
# together when another local resolver already binds 127.0.0.1:1053.
MAGICNET_DNS_CAPTURE_PORT=1053
# TUN addresses used by sing-box auto_redirect. Change them when another
# VpnService already owns 172.19.0.1/30.
MAGICNET_TUN_INET=172.19.0.1/30
MAGICNET_TUN_INET6=fdfe:dcba:9876::1/126
