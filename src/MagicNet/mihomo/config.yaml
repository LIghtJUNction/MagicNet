proxy-providers:
  myclash:
    type: http
    path: ./myclash.yaml
    url: 订阅链接
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 3600
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 9797
tproxy-port: 9898
external-controller: 127.0.0.1:9090
external-ui: ./ui
external-ui-name: lightjunction
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
ipv6: false
allow-lan: true
tcp-concurrent: true
unified-delay: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
keep-alive-interval: 1800
mode: rule
log-level: error
global-client-fingerprint: random
geodata-loader: standard
find-process-mode: strict
bind-address: '*'
hosts:
  time.facebook.com: 17.253.84.125
  time.android.com: 17.253.84.125
  '*.mihomo.dev': 127.0.0.1
  .dev: 127.0.0.1
  alpha.mihomo.dev: ::1
  test.com:
  - 1.1.1.1
  - 2.2.2.2
  home.lan: lan
dns:
  cache-algorithm: arc
  enable: true
  listen: 0.0.0.0:1053
  use-hosts: true
  ipv6: true
  ipv6-timeout: 300
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*'
  - +.lan
  - +.local
  - +.leigod.com
  - +.vivox.com
  - +.stun.+
  - .n.n.srv.nintendo.net
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  - lens.l.google.com
  - '*.mcdn.bilivideo.cn'
  - localhost.ptlogin2.qq.com
  - WORKGROUP
  nameserver:
  - quic://dns.adguard.com:784#🌏 快速选择代理
  - https://1.1.1.1/dns-query#🌏 快速选择代理
  - https://1.0.0.1/dns-query#🌏 快速选择代理
  - tls://223.5.5.5:853##🌏 快速选择代理
  - https://doh.pub/dns-query##🌏 快速选择代理
  - https://dns.alidns.com/dns-query##🌏 快速选择代理&h3=true
  - https://mozilla.cloudflare-dns.com/dns-query##🌏 快速选择代理&h3=true
  - dhcp://en0#🌏 快速选择代理
  default-nameserver:
  - tls://1.12.12.12:853
  - tls://223.5.5.5:853
  - https://223.5.5.5/dns-query
  - tcp://119.29.29.29
  - tcp://223.6.6.6
  - system
  nameserver-policy:
    geosite:cn,private:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://doh.360.cn/dns-query
    - tls://223.5.5.5
    - tls://dot.pub
    rule-set:direct,private,apple,icloud:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://doh.360.cn/dns-query
    - tls://223.5.5.5
    - tls://dot.pub
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://doh.360.cn/dns-query
  - tls://223.5.5.5
  - tls://dot.pub
  fallback:
  - quic://a.passcloud.xyz:784#🌏 快速选择代理
  - tls://8.8.4.4:853#🌏 快速选择代理
  - tcp://1.1.1.1#🌏 快速选择代理
  - https://1.1.1.1/dns-query#🌏 快速选择代理&h3=true
  - https://1.0.0.1/dns-query#🌏 快速选择代理
  - tls://1dot1dot1dot1.cloudflare-dns.com#🌏 快速选择代理
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - cn
    - games-cn
    - apple-cn
    - microsoft-cn
    ipcidr:
    - 240.0.0.0/4
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    - +.googleapis.+
tun:
  enable: true
  device: utun
  mtu: 9000
  stack: system
  dns-hijack:
  - udp://any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  endpoint-independent-nat: false
  inet4-route-exclude-address:
  - 192.168.0.0/16
  inet6-route-exclude-address:
  - fc00::/7
  inet4-route-address:
  - 0.0.0.0/1
  - 128.0.0.0/1
  inet6-route-address:
  - ::/1
  - 8000::/1
  include_android_user:
  - 0
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: false
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  force-domain:
  - google.com
  - +.v2ex.com
  skip-domain:
  - Mijia Cloud
  - +.apple.com
  sniffing:
  - tls
  - http
  port-whitelist:
  - '80'
  - '443'
profile:
  store-selected: true
  store-fake-ip: true
ntp:
  enable: true
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30
geox-url:
  geoip: https://ghp.ci/https://github.com/DustinWin/ruleset_geodata/releases/download/clash/geoip-all.dat
  geosite: https://ghp.ci/https://github.com/DustinWin/ruleset_geodata/releases/download/clash/geosite-all.dat
