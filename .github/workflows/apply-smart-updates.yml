name: Materialize verified smart updater changes
on:
  push:
    branches: [feat/smart-installer-component-updates]
    paths: [.github/workflows/apply-smart-updates.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply content-verified development patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/smart-installer-component-updates
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          chunks = sorted(Path('.github/smart-patch').glob('[0-9][0-9]'))
          assert len(chunks) == 5
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd6c21805271f06c5031bd06da1e2d1bb84c2f83a314127a3fc9ba69b65f1a4e8'
          Path(os.environ['RUNNER_TEMP'], 'smart-updates.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/smart-updates.patch"
          git apply --index "$RUNNER_TEMP/smart-updates.patch"
          rustfmt --edition 2021 crates/magicnet-cli/src/updates.rs
          git add -- crates/magicnet-cli/src/updates.rs
          git rm -r -- .github/smart-patch .github/workflows/apply-smart-updates.yml
          git diff --cached --check
      - name: Store the prepared commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode()
          def api(endpoint, value):
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/' + endpoint, '--input', '-'], input=json.dumps(value), text=True, check=True, capture_output=True)
              return json.loads(result.stdout)
          elements = []
          for name in git('diff', '--cached', '--name-only', '-z').split('\0'):
              if not name:
                  continue
              indexed = git('ls-files', '--stage', '--', name).strip()
              if not indexed:
                  elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  mode = indexed.split()[0]
                  assert mode in ('100644', '100755'), name
                  elements.append({'path': name, 'mode': mode, 'type': 'blob', 'content': git('show', ':' + name)})
          tree = api('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').strip(), 'tree': elements})
          commit = api('commits', {'message': 'feat: shared smart installer, scheduled component updates and WebUI controls\n\nUse one verified component engine, resumable content-addressed downloads, conditional release metadata and pending-reboot staging. Bundle Installer 1.1.0 with the module release. Preserve user configuration and gate publication on all quality checks.', 'tree': tree['sha'], 'parents': [os.environ['GITHUB_SHA']]})
          print('PREPARED_COMMIT=' + commit['sha'])
          print('PREPARED_TREE=' + tree['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Prepared commit `' + commit['sha'] + '`; no branch moved by this workflow.\n')
          PY
