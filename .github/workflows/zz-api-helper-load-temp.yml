name: Temporary API helper load fix

on:
  push:
    branches:
      - refactor/dynamic-singbox-controller

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dynamic-singbox-controller
          fetch-depth: 0
      - name: Make isolated subscription loads use API helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("src/MagicNet/lib/magicnet/singbox_subscribe/config.sh")
          text = config.read_text()
          prefix = '''# Isolated subscription tests and recovery paths may load this file without\n# the normal module entrypoint. Reuse the canonical endpoint helpers whenever\n# they have not already been loaded.\nif ! command -v magicnet_singbox_api_endpoint >/dev/null 2>&1 &&\n    command -v magicnet_lib_dir >/dev/null 2>&1; then\n    # shellcheck disable=SC1090\n    . "$(magicnet_lib_dir)/api.sh"\nfi\n\n'''
          if text.startswith(prefix):
              pass
          elif "magicnet_singbox_api_endpoint >/dev/null" in text[:600]:
              raise SystemExit("unexpected existing API helper bootstrap")
          else:
              config.write_text(prefix + text)

          test = Path("scripts/test-subscription-fetch-policy.sh")
          text = test.read_text()
          old_cli = '''cat >"$MODDIR/cli" <<'SH'\n#!/bin/sh\nprintf 'resolver %s\\n' "$*" >>"$MAGICNET_FETCH_TEST_LOG"\n[ "$1" = sub ] && [ "$2" = resolve-host ] || exit 2\n'''
          new_cli = '''cat >"$MODDIR/cli" <<'SH'\n#!/bin/sh\nprintf 'resolver %s\\n' "$*" >>"$MAGICNET_FETCH_TEST_LOG"\nif [ "${1:-}" = api ] && [ "${2:-}" = endpoint ]; then\n  printf '%s\\n' 'http://127.0.0.1:19090'\n  exit 0\nfi\n[ "${1:-}" = sub ] && [ "${2:-}" = resolve-host ] || exit 2\n'''
          if old_cli not in text:
              raise SystemExit("CLI fixture block not found")
          text = text.replace(old_cli, new_cli, 1)
          if "http://127.0.0.1:9090/version" not in text:
              raise SystemExit("legacy readiness fixture URL not found")
          text = text.replace(
              "http://127.0.0.1:9090/version",
              "http://127.0.0.1:19090/version",
          )
          test.write_text(text)
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/zz-api-helper-load-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/MagicNet/lib/magicnet/singbox_subscribe/config.sh scripts/test-subscription-fetch-policy.sh .github/workflows/zz-api-helper-load-temp.yml
          git commit -m "fix(subscription): load endpoint helpers in isolated lifecycle paths"
          git push origin HEAD:refactor/dynamic-singbox-controller
