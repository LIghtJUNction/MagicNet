name: Finalize v1.5.5 Release Notes
on:
  push:
    branches: [audit/v1.5.5-delivery-20260916]
permissions:
  contents: write
  actions: read
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record verification without modifying release assets or tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          repo = 'repos/LIghtJUNction/MagicNet'
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', repo + path], text=True, timeout=30))
          for run_id in (35114714789, 35116983025):
              run = get(f'/actions/runs/{run_id}')
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
          release = get('/releases/tags/v1.5.5')
          assert release['id'] == 390057284
          assert release['target_commitish'] == '792e817ea6a41d9cb0a8a7531b6fda2838a79863'
          assert release['draft'] is False and release['prerelease'] is False
          marker = '<!-- magicnet-v1.5.5-delivery-verification -->'
          body = release.get('body') or ''
          if marker not in body:
              body += '''

          <!-- magicnet-v1.5.5-delivery-verification -->
          ## 发布验收（2026-09-16）

          - 正式签名发布工作流成功，发布前完整质量检查已执行：https://github.com/LIghtJUNction/MagicNet/actions/runs/35114714789
          - 发布后通过无认证公开下载核验全部 34 个附件的大小、GitHub SHA256 和 SHA256SUMS；安装器与 core 完全一致，完整包与所有组件文件一致：https://github.com/LIghtJUNction/MagicNet/actions/runs/35116983025
          - 版本 v1.5.5，versionCode 1789322930996，源码 792e817ea6a41d9cb0a8a7531b6fda2838a79863。
          - MagicNetRules 固定为 rules-20260916-c802d68ca104e3ce；包内 53 个 SRS 已核验格式头、大小、哈希和组件一致性。
          - 安装器 3,391,754 字节；离线完整包 63,859,818 字节。下载慢或需要离线安装时可使用 MagicNet-full.zip。

          ## 已知问题与未通过的验收

          本版本包含网络测试误报修复、状态同步和下载恢复等改进，但不声称上一版本的所有真机网络错误已经修复。

          独立 Android/KernelSU 验收 35113603153 在创建 AVD 阶段失败，尚无该运行的 Android 应用联网结果。Google Play/GMS 登录与下载、受影响真机配置恢复、Wi-Fi/移动网络切换、RSS/节点延迟和新 TUN 栈迁移不能视为已通过。#253、#254、#261、#281 仍独立跟踪；没有为发布而虚假关闭。
          '''
              with tempfile.TemporaryDirectory() as td:
                  payload = Path(td) / 'notes.json'
                  payload.write_text(json.dumps({'body': body}))
                  subprocess.run(['gh', 'api', '--method', 'PATCH', repo + '/releases/390057284',
                                  '--input', str(payload), '--jq', '.html_url'], check=True, timeout=30)
          verified = get('/releases/390057284')
          assert marker in verified['body'] and verified['draft'] is False
          assert [(a['id'], a['digest']) for a in verified['assets']] == [(a['id'], a['digest']) for a in release['assets']]
          print('Release verification and known-device limitations recorded; assets and tag unchanged')
          PY
