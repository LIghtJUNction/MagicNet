name: Audit config pin synchronization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  synchronize-reviewed-pin:
    if: >-
      github.repository == 'LIghtJUNction/MagicNet' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/magicsingbox-routing-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Initialize the reviewed configuration revision
        run: git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
      - name: Synchronize pins and register the bundled regression
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import subprocess

          old = 'a12e472c8152e9a40af48cfa1e2d4c4242f33d50'
          new = 'ef82670ef9dc687eb1360fcde88405b0b4cd335a'
          config_dir = Path('src/MagicNet/.config/sing-box')
          actual = subprocess.check_output(['git', '-C', str(config_dir), 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == new, f'Unexpected submodule revision: {actual}'
          assert hashlib.sha256((config_dir / 'config.json').read_bytes()).hexdigest() == '35d54f908ccc9cc615fabf06b1037bbfc1f6d1d9712c86ba6c9b5252cc98ae03'
          for name in (
              'src/MagicNet/.config/magicnet/singbox-config-repo.conf',
              'crates/magicnet-cli/src/config_editor.rs',
              'src/MagicNet/customize.sh',
              'webui/src/components/pages/ConfigPage.vue',
          ):
              path = Path(name)
              text = path.read_text()
              assert old in text, f'Missing reviewed old pin: {name}'
              path.write_text(text.replace(old, new))
          host = Path('scripts/test-host.sh')
          text = host.read_text()
          anchor = 'check bash scripts/test-config-template-pin.sh\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'check python3 src/MagicNet/.config/sing-box/tests/test_config_routing.py\n')
          host.write_text(text)
      - name: Verify pins and routing before committing
        run: |
          set -euo pipefail
          bash scripts/test-config-template-pin.sh
          python3 src/MagicNet/.config/sing-box/tests/test_config_routing.py
          git diff --check
      - name: Commit only the repair and remove this one-use workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/audit-config-pin-once.yml
          git add -- \
            src/MagicNet/.config/magicnet/singbox-config-repo.conf \
            crates/magicnet-cli/src/config_editor.rs \
            src/MagicNet/customize.sh \
            webui/src/components/pages/ConfigPage.vue \
            scripts/test-host.sh \
            .github/workflows/audit-config-pin-once.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(config): synchronize template pins and gate bundled routing tests'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/magicsingbox-routing-test
          printf 'Verified repair commit: '
          git rev-parse HEAD
