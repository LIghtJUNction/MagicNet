name: Repository audit
on:
  push:
    branches: [fix/repository-runtime-audit-20260916]
permissions:
  contents: write
concurrency:
  group: repository-runtime-audit
  cancel-in-progress: true
jobs:
  audit:
    if: github.ref == 'refs/heads/fix/repository-runtime-audit-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate staged patch
        run: |
          mkdir -p /tmp/magicnet-audit
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, json
          data = gzip.decompress(base64.b64decode(pathlib.Path('.github/runtime-audit.patch.gz.b64').read_text(), validate=False))
          assert hashlib.sha256(data).hexdigest() == '502bf5b6d01a221594d4397a53e183ad3405a97f23e38137bff8b590767c15ca', 'patch checksum mismatch'
          patch = pathlib.Path('/tmp/magicnet-audit/fixes.patch')
          patch.write_bytes(data)
          allowed = '''crates/magicnet-cli/src/diagnostics.rs
          crates/magicnet-cli/src/mcp.rs
          crates/magicnet-cli/src/mcp_server.rs
          crates/magicnet-cli/src/mcp_server/logs.rs
          crates/magicnet-cli/src/mcp_server/rpc.rs
          crates/magicnet-cli/src/wifi.rs
          crates/magicnet-cli/tests/internal/audit_diagnostics.rs
          crates/magicnet-cli/tests/internal/audit_mcp.rs
          scripts/test-config-lock-budget.sh
          scripts/test-host.sh
          src/MagicNet/lib/magicnet/common.sh
          webui/src/components/pages/RuntimeLogsPanel.vue
          webui/src/components/pages/TrafficStatsPanel.vue
          webui/src/composables/visibilityInterval.ts
          webui/visibility-interval.test.mjs'''.splitlines()
          actual = [line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()]
          assert sorted(actual) == sorted(allowed), 'unexpected patch path'
          pathlib.Path('/tmp/magicnet-audit/paths.json').write_text(json.dumps(actual))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          PY
      - name: Prove regressions on old implementation
        run: |
          git apply --include=crates/magicnet-cli/tests/internal/audit_diagnostics.rs --include=crates/magicnet-cli/tests/internal/audit_mcp.rs --include=scripts/test-config-lock-budget.sh /tmp/magicnet-audit/fixes.patch
          printf '\n#[cfg(all(test, target_os = "linux"))]\n#[path = "../tests/internal/audit_diagnostics.rs"]\nmod audit_regressions;\n' >> crates/magicnet-cli/src/diagnostics.rs
          printf '\n#[cfg(all(test, target_os = "linux"))]\n#[path = "../../tests/internal/audit_mcp.rs"]\nmod audit_regressions;\n' >> crates/magicnet-cli/src/mcp_server/rpc.rs
          set +e
          cargo test --workspace audit_regressions -- --test-threads=1 > /tmp/magicnet-audit/red-rust.log 2>&1
          rust_rc=$?
          timeout 15 bash scripts/test-config-lock-budget.sh > /tmp/magicnet-audit/red-shell.log 2>&1
          shell_rc=$?
          set -e
          cat /tmp/magicnet-audit/red-rust.log
          cat /tmp/magicnet-audit/red-shell.log
          test "$rust_rc" -ne 0
          grep -q 'test result: FAILED' /tmp/magicnet-audit/red-rust.log
          test "$shell_rc" -ne 0
          grep -q 'escaped validation' /tmp/magicnet-audit/red-shell.log
          git restore crates/magicnet-cli/src/diagnostics.rs crates/magicnet-cli/src/mcp_server/rpc.rs
          rm crates/magicnet-cli/tests/internal/audit_diagnostics.rs crates/magicnet-cli/tests/internal/audit_mcp.rs scripts/test-config-lock-budget.sh
      - name: Apply and format fixes
        run: |
          git apply /tmp/magicnet-audit/fixes.patch
          cargo fmt --all
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/magicnet-audit/paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git diff --cached --check
      - name: Rust tests and static analysis
        run: |
          cargo test --workspace --all-targets --all-features --locked 2>&1 | tee /tmp/magicnet-audit/green-rust.log
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::dbg_macro -D clippy::todo -D clippy::unimplemented 2>&1 | tee /tmp/magicnet-audit/clippy.log
          cargo fmt --all -- --check
          cargo check --locked -p magicnet-cli --target aarch64-linux-android 2>&1 | tee /tmp/magicnet-audit/android-check.log
      - name: WebUI tests typecheck and build
        working-directory: webui
        run: |
          npm ci --no-audit
          npm run check 2>&1 | tee /tmp/magicnet-audit/webui-check.log
      - name: Shell and source checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq ripgrep python3-yaml
          bash scripts/quality-gate.sh shell 2>&1 | tee /tmp/magicnet-audit/shell.log
      - name: Installer components
        run: |
          GO111MODULE=off go test -race ./installer/components 2>&1 | tee /tmp/magicnet-audit/go.log
          GO111MODULE=off go vet ./installer/components
      - name: Publish tested source to repair branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/repository-runtime-audit-20260916
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/magicnet-audit/paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: unify bounded execution and pause inactive polling', '--only', '--', *paths], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/repository-runtime-audit-20260916'], check=True)
          PY
          git rev-parse HEAD | tee /tmp/magicnet-audit/tested-commit.txt
      - name: Export evidence
        if: always()
        run: git diff HEAD -- crates scripts webui src/MagicNet/lib/magicnet > /tmp/magicnet-audit/worktree.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-audit-validation
          path: /tmp/magicnet-audit
          retention-days: 7
