name: Play Network Audit
on:
  push:
    branches: [fix/play-routing-feedback-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export tracked source and pinned configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-audit"
          git archive HEAD | gzip > "$RUNNER_TEMP/play-audit/source.tar.gz"
          git ls-tree HEAD > "$RUNNER_TEMP/play-audit/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/play-audit/source-sha.txt"
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
          git -C src/MagicNet/.config/sing-box archive --prefix=src/MagicNet/.config/sing-box/ HEAD | gzip > "$RUNNER_TEMP/play-audit/config.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: play-audit-source
          path: ${{ runner.temp }}/play-audit
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: play-audit-go-1.26.7-495fb0c8
      - name: Build exact host core and collect source evidence
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- sing-box
          scripts/build-sing-box.sh linux amd64 "$RUNNER_TEMP/play-audit/sing-box"
          git -C sing-box archive --prefix=sing-box/ HEAD | gzip > "$RUNNER_TEMP/play-audit/core-source.tar.gz"
          "$RUNNER_TEMP/play-audit/sing-box" version > "$RUNNER_TEMP/play-audit/core-version.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: play-audit-core
          path: |
            ${{ runner.temp }}/play-audit/sing-box
            ${{ runner.temp }}/play-audit/core-source.tar.gz
            ${{ runner.temp }}/play-audit/core-version.txt
          retention-days: 1
          if-no-files-found: error
