name: Validate Final Owned Network State
on:
  push:
    branches: [audit/owned-integration-20260916]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7eba2b38e71a6c4da663c88a062e0c23e33c64bf
          persist-credentials: false
          fetch-depth: 1
      - name: Apply exact reviewed settings-read correction and documentation cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''
          raw = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '51e4ff927b27d5178f4ffa51707666bc67b3c53af7da991de61053457cc2d4b3'
          changes = json.loads(raw)
          assert set(changes) == {'src/MagicNet/lib/magicnet/routes.sh', 'scripts/test-route-ownership.py', 'docs/network-rule-ownership.md'}
          def blob(b): return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          outputs = {}
          for name, change in changes.items():
              path = Path(name)
              assert not path.is_symlink()
              old = path.read_bytes()
              assert blob(old) == change['before'], name
              lines = old.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['ops']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              output = ''.join(lines).encode()
              assert blob(output) == change['after'], name
              outputs[path] = output
          for path, output in outputs.items(): path.write_bytes(output)
          PY
          git diff --check
          bash -n src/MagicNet/lib/magicnet/routes.sh
      - name: Execute real helper failure and uninstall regressions
        run: |
          set -euo pipefail
          python3 scripts/test-route-ownership.py
          MAGICNET_TEST_SHELL=bash python3 scripts/test-route-ownership.py
          MAGICNET_TEST_SHELL=busybox python3 scripts/test-route-ownership.py
          python3 scripts/test-uninstall.py
          bash scripts/test-hotspot-routing.sh
      - name: Commit only on the unchanged feature head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=fix/owned-network-state-20260916
          test "$GITHUB_REPOSITORY" = LIghtJUNction/MagicNet
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)" = 7eba2b38e71a6c4da663c88a062e0c23e33c64bf
          git add -- src/MagicNet/lib/magicnet/routes.sh scripts/test-route-ownership.py docs/network-rule-ownership.md
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git config user.name LIghtJUNction
          git config user.email lightjunction.me@gmail.com
          git commit -m 'fix(network): preserve failed Android settings reads and recovery journals'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
