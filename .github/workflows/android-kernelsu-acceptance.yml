name: Android KernelSU Acceptance

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      public_benchmark:
        description: Also run the non-deterministic public proxy benchmark after offline acceptance
        required: false
        type: boolean
        default: false
      proxy_region:
        description: Public free-node shard used only by the optional benchmark
        required: true
        type: choice
        options: [global, US, JP]
        default: global
      rounds:
        description: Connectivity/latency rounds per public service target
        required: true
        type: choice
        options: ["1", "3", "5"]
        default: "3"
      run_speed:
        description: Run 8 MiB domestic/global throughput probes in the optional benchmark
        required: true
        type: boolean
        default: false
      fresh_avd:
        description: Ignore the cached pristine Android virtual device for this run
        required: true
        type: boolean
        default: false
      memory_mb:
        description: Requested AVD RAM; actual guest MemTotal is recorded separately
        required: true
        type: choice
        options: ["2048", "4096"]
        default: "2048"

permissions:
  contents: read

concurrency:
  group: android-kernelsu-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_SERIAL: emulator-5554
  AVD_NAME: MagicNet_API_35
  AVD_MEMORY: ${{ inputs.memory_mb || '2048' }}
  SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
  KSU_RUNTIME: ${{ runner.temp }}/kernelsu-runtime
  KSU_RELEASE: v3.2.0
  KSUD_SHA256: db96b07ef42f6b9a84b5914d19c2f01608b1e10816fc28c0e84f07417d9bc062
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  harness:
    name: Simulation harness contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install workflow test dependency
        run: |
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
      # No cached passes: validate failure propagation before any expensive SDK work.
      - name: Test simulation safety and workflow wiring
        run: |
          python3 scripts/test-android-device-simulation.py
          python3 scripts/test-android-simulation-fixes.py
          python3 scripts/test-android-simulation-workflow.py
          python3 scripts/test-android-acceptance-contract.py
          python3 scripts/test-android-avd-storage.py
          python3 scripts/test-android-adb.py
          python3 scripts/test-android-tun-proof.py
          python3 scripts/test-android-network-benchmark.py

  android-kernelsu:
    name: Android 15 / KernelSU / x86_64
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/cmdline-tools" || "$sdk" == *$'\n'* || "$sdk" == *$'\r'* ]]; then
            echo '::error::Android SDK command-line tools directory is missing or invalid' >&2
            exit 2
          fi
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' -executable | sort -V | tail -n 1)"
          fi
          tools="${manager%/sdkmanager}"
          if [[ ! -x "$manager" || ! -x "$tools/avdmanager" ]]; then
            echo '::error::Matching sdkmanager and avdmanager executables are required' >&2
            exit 2
          fi
          timeout 600 "$manager" --sdk_root="$sdk" "platform-tools" "emulator"
          printf '%s\n' "$tools" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"

      - name: Validate acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/android-kernelsu-acceptance.sh
          python3 scripts/test-android-probe.py
          python3 scripts/test-kernelsu-installer-lifecycle.py

      - name: Setup Go
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Setup kam and Rust
        uses: MemDeco-WG/setup-kam@1d6ad8a9f58446a4519fda12a52f0c71fb667d8b # v3
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          cache-targets: kam
          install-commitizen: "false"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Fingerprint toolchains
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          ndk="${ndk:-/opt/android-ndk}"
          printf 'rust=%s\n' "$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'ndk=%s\n' "$(sha256sum "$ndk/source.properties" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'singbox=%s\n' "$(git -C sing-box rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Go and Rust build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-ksu-build-v2-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ steps.toolchain.outputs.singbox }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'sing-box/go.mod', 'sing-box/go.sum', 'scripts/build-sing-box.sh') }}
          restore-keys: |
            android-ksu-build-v2-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/magicnet/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ steps.toolchain.outputs.rust }}

      - name: Install Android Rust targets and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android x86_64-linux-android
          if [ "${{ steps.cargo-ndk.outputs.cache-hit }}" != "true" ]; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --root "$HOME/.cache/magicnet/cargo-ndk"
          fi
          echo "$HOME/.cache/magicnet/cargo-ndk/bin" >> "$GITHUB_PATH"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file jq ripgrep unzip zip python3-yaml shellcheck

      # Consolidated from init.yml; retain its unique KAM checks and regressions.
      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          kam validate
          kam check
          python3 scripts/test-release-workflow.py
          bash scripts/test-subscription-usage.sh
          bash scripts/test-artifact-signature.sh

      - name: Build host core for package routing checks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/magicnet-host"
          mkdir -p "$install_dir"
          scripts/build-sing-box.sh linux amd64 "$install_dir/sing-box"
          "$install_dir/sing-box" version
          python3 scripts/test-android-tun-proof.py --check-core "$install_dir/sing-box"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Validate offline config against the exact core
        run: |
          python3 scripts/test-android-device-simulation.py --check-core "$RUNNER_TEMP/magicnet-host/sing-box"
          python3 scripts/test-android-simulation-fixes.py --check-core "$RUNNER_TEMP/magicnet-host/sing-box"

      - name: Build current MagicNet module
        env:
          MAGICNET_SIGN_ENABLED: "0"
          KAM_CHANGELOG_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          rm -rf dist
          kam build
          scripts/package-smoke.sh dist/MagicNet.zip
          scripts/package-install-smoke.sh dist/MagicNet.zip

      - name: Build x86_64 AVD runtime payloads
        shell: bash
        run: |
          set -euo pipefail
          cargo ndk -t x86_64 build --release --locked -p magicnet-cli
          mkdir -p "$RUNNER_TEMP/magicnet-x86"
          scripts/build-sing-box.sh android amd64 "$RUNNER_TEMP/magicnet-x86/sing-box"
          install -m 0755 target/x86_64-linux-android/release/magicnet-cli "$RUNNER_TEMP/magicnet-x86/magicnet-cli"
          file "$RUNNER_TEMP/magicnet-x86/"* | tee "$RUNNER_TEMP/x86-payloads.txt"

      - name: Prepare x86_64 fixture utilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magicnet-x86-tools"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64 \
            -o "$RUNNER_TEMP/magicnet-x86-tools/jq"
          printf '%s  %s\n' b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f \
            "$RUNNER_TEMP/magicnet-x86-tools/jq" | sha256sum --check --strict
          GOBIN="$RUNNER_TEMP/magicnet-x86-tools" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go install github.com/mikefarah/yq/v4@v4.53.3
          chmod 0755 "$RUNNER_TEMP/magicnet-x86-tools/"*
          for tool in jq yq; do
            file "$RUNNER_TEMP/magicnet-x86-tools/$tool" | grep -q 'x86-64'
            if readelf -l "$RUNNER_TEMP/magicnet-x86-tools/$tool" | grep -q INTERP; then
              echo "::error::$tool must not depend on a host-only ELF interpreter"
              exit 1
            fi
          done

      - name: Build application-UID network probe
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-android-network-probe.sh --prepare-sdk "$RUNNER_TEMP/magicnet-network-probe.apk"

      - name: Download and verify official KernelSU userspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$KSU_RUNTIME"
          mkdir -p "$KSU_RUNTIME"
          curl --fail --location --retry 4 --retry-all-errors --max-time 180 \
            "https://github.com/tiann/KernelSU/releases/download/$KSU_RELEASE/ksud-x86_64-linux-android" \
            -o "$KSU_RUNTIME/ksud-x86_64-linux-android"
          printf '%s  %s\n' "$KSUD_SHA256" "$KSU_RUNTIME/ksud-x86_64-linux-android" | sha256sum --check --strict
          file "$KSU_RUNTIME/ksud-x86_64-linux-android" | grep -q 'x86-64'
          chmod 0755 "$KSU_RUNTIME/ksud-x86_64-linux-android"
          "$KSU_RUNTIME/ksud-x86_64-linux-android" --version

      - name: Pin Android AVD storage
        shell: bash
        run: |
          set -euo pipefail
          avd_home="$HOME/.android/avd"
          mkdir -p "$avd_home"
          printf 'ANDROID_AVD_HOME=%s\n' "$avd_home" >> "$GITHUB_ENV"

      - name: Restore pristine Android AVD
        if: inputs.fresh_avd != true
        id: avd-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.android/avd/MagicNet_API_35.avd
            ~/.android/avd/MagicNet_API_35.ini
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-avd-v4-api35-google-apis-x86_64-stock-late-load

      - name: Create pristine Android 15 AVD
        if: inputs.fresh_avd == true || steps.avd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          timeout 900 sdkmanager "$SYSTEM_IMAGE"
          rm -rf "$HOME/.android/avd/${AVD_NAME}.avd" "$HOME/.android/avd/${AVD_NAME}.ini"
          avd_dir="$HOME/.android/avd/${AVD_NAME}.avd"
          timeout 300 avdmanager create avd --force --name "$AVD_NAME" --package "$SYSTEM_IMAGE" --path "$avd_dir" <<<no
          test -s "$avd_dir/config.ini"
          test -s "$ANDROID_AVD_HOME/${AVD_NAME}.ini"
          grep -Fqx "path=$avd_dir" "$ANDROID_AVD_HOME/${AVD_NAME}.ini"
          cat >>"$HOME/.android/avd/${AVD_NAME}.avd/config.ini" <<'EOF'
          hw.cpu.ncore=4
          hw.ramSize=4096
          disk.dataPartition.size=6G
          hw.keyboard=yes
          showDeviceFrame=no
          EOF

      - name: Save pristine Android AVD
        if: inputs.fresh_avd != true && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.android/avd/MagicNet_API_35.avd
            ~/.android/avd/MagicNet_API_35.ini
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-avd-v3-api35-google-apis-x86_64

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          else
            echo '::error::/dev/kvm is unavailable on this runner'
            exit 1
          fi

      - name: Boot pristine Android 15 AVD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-kernelsu
          # Keep the stock AVD kernel and its stock vendor/ramdisk modules paired.
          # KernelSU is loaded later through the official v3.2.0 LKM path.
          nohup emulator "@$AVD_NAME" \
            -port 5554 \
            -accel on \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -memory "$AVD_MEMORY" \
            -show-kernel \
            >artifacts/android-kernelsu/emulator.log 2>&1 &
          echo $! >artifacts/android-kernelsu/emulator.pid

      - name: Exercise offline Android KernelSU lifecycle
        timeout-minutes: 25
        env:
          MAGICNET_DISPOSABLE_AVD: "1"
          MAGICNET_KSUD_HOST: ${{ env.KSU_RUNTIME }}/ksud-x86_64-linux-android
          MAGICNET_X86_CLI: ${{ runner.temp }}/magicnet-x86/magicnet-cli
          MAGICNET_X86_SINGBOX: ${{ runner.temp }}/magicnet-x86/sing-box
          MAGICNET_X86_TOOLS: ${{ runner.temp }}/magicnet-x86-tools
          MAGICNET_NETWORK_PROBE_APK: ${{ runner.temp }}/magicnet-network-probe.apk
        run: python3 scripts/android-device-simulation.py

      # This is an observation, not a substitute for the deterministic phase above.
      # It installs its own module after the simulation has verified uninstall.
      - name: Install and benchmark MagicNet in KernelSU AVD
        if: github.event_name == 'workflow_dispatch' && inputs.public_benchmark == true
        timeout-minutes: 20
        env:
          MAGICNET_KSUD_HOST: ${{ env.KSU_RUNTIME }}/ksud-x86_64-linux-android
          MAGICNET_X86_CLI: ${{ runner.temp }}/magicnet-x86/magicnet-cli
          MAGICNET_X86_SINGBOX: ${{ runner.temp }}/magicnet-x86/sing-box
          MAGICNET_X86_TOOLS: ${{ runner.temp }}/magicnet-x86-tools
          MAGICNET_NETWORK_PROBE_APK: ${{ runner.temp }}/magicnet-network-probe.apk
          MAGICNET_ANDROID_REPORT_DIR: ${{ github.workspace }}/artifacts/android-public-benchmark
          MAGICNET_PROXY_REGION: ${{ inputs.proxy_region }}
          MAGICNET_BENCHMARK_ROUNDS: ${{ inputs.rounds }}
          MAGICNET_RUN_SPEED: ${{ inputs.run_speed == true && '1' || '0' }}
        shell: bash
        run: scripts/android-kernelsu-acceptance.sh

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          timeout --kill-after=2s 10s adb emu kill >/dev/null 2>&1 || true
          if [ -f artifacts/android-kernelsu/emulator.pid ]; then
            kill "$(cat artifacts/android-kernelsu/emulator.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload Android acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-kernelsu-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/android-kernelsu/**
            artifacts/android-public-benchmark/**
            ${{ runner.temp }}/x86-payloads.txt
          if-no-files-found: warn
          retention-days: 14

  simulation-gate:
    name: Android Simulation Gate
    if: ${{ always() }}
    needs: [harness, android-kernelsu]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require completed simulation
        env:
          HARNESS_RESULT: ${{ needs.harness.result }}
          ANDROID_RESULT: ${{ needs.android-kernelsu.result }}
        run: |
          test "$HARNESS_RESULT" = success
          test "$ANDROID_RESULT" = success
