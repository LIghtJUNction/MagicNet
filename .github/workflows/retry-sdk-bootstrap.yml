name: Validate SDK path fix
on:
  push:
    branches: [release/v1.5.5-20260916]
    paths: [.github/workflows/retry-sdk-bootstrap.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Regenerate and test SDK bootstrap including cache-independent tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          spec = yaml.safe_load(Path('.github/workflows/verify-avd-sdk-path.yml').read_text())
          steps = spec['jobs']['verify']['steps']
          source = steps[1]['run']
          old = "bootstrap = lines[0] + ''.join(line[8:] if line.startswith('        ') else line for line in lines[1:])"
          assert source.count(old) == 1
          source = source.replace(old, "bootstrap = ''.join(lines)")
          subprocess.run(['bash', '-euo', 'pipefail', '-c', source], check=True)
          p = Path('.github/workflows/android-kernelsu-acceptance.yml')
          source = p.read_text()
          old = '          printf \'%s\\n\' "$tools" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"'
          assert source.count(old) == 1
          source = source.replace(old, '          timeout 600 "$manager" --sdk_root="$sdk" "platform-tools" "emulator"\n' + old)
          source = source.replace('          sdkmanager "platform-tools" "emulator" "$SYSTEM_IMAGE"', '          timeout 900 sdkmanager "$SYSTEM_IMAGE"')
          p.write_text(source)
          p = Path('scripts/test-android-acceptance-contract.py')
          source = p.read_text()
          anchor = '\n\nif __name__ == "__main__":'
          test = '''
              def test_failed_sdk_install_does_not_publish_paths(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      sdk = root / "sdk"
                      tools = sdk / "cmdline-tools/latest/bin"
                      tools.mkdir(parents=True)
                      for tool in ("sdkmanager", "avdmanager"):
                          file = tools / tool
                          file.write_text("#!/bin/sh\\nexit 19\\n")
                          file.chmod(0o755)
                      pathfile = root / "github-path"
                      env = dict(os.environ, ANDROID_SDK_ROOT=str(sdk), GITHUB_PATH=str(pathfile))
                      result = subprocess.run(["bash", "-euo", "pipefail", "-c", self.step("Locate Android SDK tools")["run"]],
                                              env=env, text=True, capture_output=True, timeout=10)
                      self.assertEqual(result.returncode, 19, result.stdout + result.stderr)
                      self.assertFalse(pathfile.exists())
          '''
          import textwrap
          test = ''.join('    ' + line if line.strip() else line for line in textwrap.dedent(test).splitlines(True))
          assert source.count(anchor) == 1
          p.write_text(source.replace(anchor, '\n' + test + anchor))
          subprocess.run(['bash', '-euo', 'pipefail', '-c', steps[2]['run']], check=True)
          PY
      - name: Confirm SDK tools across steps and save tested Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          spec = yaml.safe_load(Path('.github/workflows/verify-avd-sdk-path.yml').read_text())
          for step in spec['jobs']['verify']['steps'][3:5]:
              subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: android-sdk-path-validation
          path: ${{ runner.temp }}/sdk-path-validation/
          retention-days: 7
          if-no-files-found: error
