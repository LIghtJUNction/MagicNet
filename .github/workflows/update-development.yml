name: Smart update development fixture
on:
  push:
    branches: [feat/smart-installer-scheduled-component-updates]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/smart-update-source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smart-update-source
          path: ${{ runner.temp }}/smart-update-source.tar
          retention-days: 1
