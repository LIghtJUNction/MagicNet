name: Smart update integration candidate
on:
  push:
    branches: [feat/smart-installer-scheduled-component-updates]
    paths: [.github/workflows/update-development.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - name: Apply exact locally tested patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          text = ''.join(pathlib.Path(f'.github/smart-update.part{i}').read_text() for i in range(1,5))
          decoder = lzma.LZMADecompressor(memlimit=128<<20)
          patch = decoder.decompress(base64.b64decode(text, validate=True), max_length=1<<20)
          assert decoder.eof and len(patch) == 89676
          assert hashlib.sha256(patch).hexdigest() == '43b185952f36a1749812411b0066722551c412d51d1952096815bedfb0d5b682'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          PY
          cargo fmt --all
          git add crates/magicnet-cli/src/commands.rs
          git rm .github/smart-update.part1 .github/smart-update.part2 .github/smart-update.part3 .github/smart-update.part4 .github/workflows/update-development.yml
          git diff --cached --check
          GO111MODULE=off go test -race -count=1 ./installer/components
          GO111MODULE=off go vet ./installer/components
          GO111MODULE=off CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w -buildid=' -o "$RUNNER_TEMP/smart-helper" ./installer/components
          python3 scripts/package-smart-installer.py --helper "$RUNNER_TEMP/smart-helper" --output "$RUNNER_TEMP/magicnet_installer.zip"
          python3 scripts/test-downloader-installer.py "$RUNNER_TEMP/magicnet_installer.zip"
      - name: Materialize candidate without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          def post(kind, body):
              req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'+kind, data=json.dumps(body).encode(), headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          entries = []
          paths = git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0')
          for path in paths:
              stage = git('ls-files','--stage','--',path).decode()
              if not stage:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              mode, local_sha, _ = stage.split(None, 2)
              data = git('show', ':'+path)
              blob = post('blobs', {'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert blob['sha'] == local_sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          tree = post('trees', {'base_tree':git('rev-parse','HEAD^{tree}').decode().strip(),'tree':entries})
          assert tree['sha'] == git('write-tree').decode().strip()
          record = {'parent':git('rev-parse','HEAD').decode().strip(),'tree':tree['sha'],'paths':paths}
          target = pathlib.Path(os.environ['RUNNER_TEMP'])
          (target/'candidate.json').write_text(json.dumps(record, indent=2))
          (target/'candidate-source.tar').write_bytes(git('archive','--format=tar',tree['sha']))
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smart-update-candidate
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-source.tar
            ${{ runner.temp }}/magicnet_installer.zip
          retention-days: 2
