name: Temporary controller endpoint refactor

on:
  push:
    branches:
      - refactor/dynamic-singbox-controller

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dynamic-singbox-controller
          fetch-depth: 0
      - name: Remove runtime 9090 assumptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/MagicNet/lib/magicnet/singbox_subscribe/config.sh")
          text = path.read_text()

          replacements = [
              (
                  r'''    ss -lntp 2>/dev/null | grep -E '127\.0\.0\.1:9090[[:space:]]' | grep -q "pid=${_listener_pid},"''',
                  '''    _listener_port="$(magicnet_singbox_api_port)" || return 1
              ss -lntp 2>/dev/null |
                  grep -E ":${_listener_port}[[:space:]]" |
                  grep -Fq "pid=${_listener_pid},"
              _listener_rc=$?
              unset _listener_pid _listener_port
              return "$_listener_rc"''',
                  1,
              ),
              (
                  'curl -fsS --max-time 1 http://127.0.0.1:9090/version',
                  'curl -fsS --max-time 1 "$(magicnet_singbox_api_endpoint)/version"',
                  2,
              ),
              (
                  r'''    ss -lnt 2>/dev/null | grep -q '127\.0\.0\.1:9090[[:space:]]' && return 1''',
                  '    magicnet_singbox_api_listener_exists && return 1',
                  1,
              ),
              (
                  r'''    if ss -lnt 2>/dev/null | grep -q '127\.0\.0\.1:9090[[:space:]]'; then''',
                  '    if magicnet_singbox_api_listener_exists; then',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"expected {expected} matches, got {count}: {old[:100]!r}"
                  )
              text = text.replace(old, new)

          if "9090" in text:
              raise SystemExit("config.sh still contains a hard-coded 9090")

          path.write_text(text)
          PY
      - name: Commit refactor and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/zz-controller-refactor-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/MagicNet/lib/magicnet/singbox_subscribe/config.sh .github/workflows/zz-controller-refactor-temp.yml
          git commit -m "refactor(subscription): resolve controller endpoint dynamically"
          git push origin HEAD:refactor/dynamic-singbox-controller
