name: Offline Review Bootstrap
on:
  push:
    branches: [fix/subscription-lifecycle-ui-v1.5.15]
    paths: [.github/workflows/offline-review-bootstrap.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'LIghtJUNction/MagicNet' && github.ref == 'refs/heads/fix/subscription-lifecycle-ui-v1.5.15'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact offline-reviewed patch before applying
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          root = Path('.github/review-patch')
          pieces = []
          for name, expected in [('part1', '6c0fb0ed2eafd917751614a127b06b79f3dafe86'), ('part2', '5d74b45eaccdb983088ad5f507c033dbf42a03cf'), ('part3', 'e5c5b7ebd1937751a6fdb126f99f5b4fee7699ad'), ('part4a', '40ab25b2489f9b39f73fb11636f6a2416090cbee'), ('part4b', 'e7e8225293f519649c09adda5d1c2e9b4da2bb5a'), ('part4c', '29880533ff46a778f04e51e713705bc7eed8fd59')]:
              value = (root / name).read_bytes()
              if name == 'part2':
                  value = value.replace(b'mZInTuQrQr28/', b'mZInTuQr28/')
              digest = hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
              assert digest == expected, f'transport checksum mismatch: {name}'
              pieces.append(value)
          patch = gzip.decompress(base64.b64decode(b''.join(pieces), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e1b23e95d4e27d2acb80794e36023f89bad9bd5b359e8bc8ae0868b12753308e', 'patch checksum mismatch'
          Path('/tmp/review.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
      - name: Format Rust and commit only reviewed source changes
        shell: bash
        run: |
          cargo fmt --all
          rm -rf .github/review-patch
          rm .github/workflows/offline-review-bootstrap.yml
          git add -u
          git add docs/releases/v1.5.15.md scripts/test-clash-subscriptions.py webui/src/components/ui/SectionDisclosure.vue webui/e2e/page-review.spec.mjs webui/e2e/subscription-sources.spec.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reliable Clash sources, idempotent stop, and focused WebUI layouts' -m 'Prepare v1.5.15. Include real pinned-converter, shared-priority route, source transaction and six-viewport UI regressions. Remove all temporary offline review transport files.'
          git push origin HEAD:fix/subscription-lifecycle-ui-v1.5.15
      - name: Test Rust control plane
        shell: bash
        run: |
          git submodule update --init src/MagicNet/.config/sing-box
          cargo test --workspace --locked 2>&1 | tee /tmp/magicnet-rust-tests.log
      - name: Export final reviewed sources and test evidence
        if: always()
        shell: bash
        run: |
          git archive HEAD | gzip > /tmp/magicnet-reviewed-source.tar.gz
          git rev-parse HEAD > /tmp/magicnet-reviewed-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magicnet-reviewed-source
          path: |
            /tmp/magicnet-reviewed-source.tar.gz
            /tmp/magicnet-reviewed-head.txt
            /tmp/magicnet-rust-tests.log
          retention-days: 3
