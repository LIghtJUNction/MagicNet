name: Offline Review Bootstrap
on:
  push:
    branches: [fix/subscription-lifecycle-ui-v1.5.15]
    paths: [.github/workflows/offline-review-bootstrap.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned headless renderer
        run: |
          npm ci --prefix webui
          cd webui
          npx playwright install --only-shell chromium
          tar -czf /tmp/magicnet-review-browser.tar.gz -C "$HOME/.cache/ms-playwright" .
      - uses: actions/upload-artifact@v4
        with:
          name: magicnet-review-browser
          path: /tmp/magicnet-review-browser.tar.gz
          retention-days: 1
