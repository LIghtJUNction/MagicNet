name: Build and release MagicNet

run-name: MagicNet ${{ inputs.mode || 'verify' }} · ${{ inputs.version || inputs.bump || 'patch preview' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: build = artifacts; verify = all release gates; publish = gates + GitHub Release
        type: choice
        options: [build, verify, publish]
        default: build
        required: true
      bump:
        description: Increment the newer source/published version; use none for a custom version
        type: choice
        options: [none, patch, minor, major]
        default: none
        required: true
      version:
        description: Optional exact version, e.g. 1.9.0 or v1.9.0 (requires bump=none)
        type: string
        default: ''
      version_code:
        description: Optional Android versionCode; empty selects or increments it automatically
        type: string
        default: ''
      source_ref:
        description: Build/verify can select a ref; publish requires the reviewed source gitlink
        type: string
        default: ''
      prerelease:
        description: Publish as a prerelease without changing the stable updater
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/**
      - scripts/**
      - .gitmodules
      - generated/magicnet-android

permissions:
  contents: read

concurrency:
  group: magicnet-release-${{ github.event_name == 'pull_request' && github.ref || github.repository }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  plan_read:
    name: Plan build or verification
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      recipe_sha: ${{ steps.plan.outputs.recipe_sha }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/release-plan
        id: plan
        with:
          mode: ${{ inputs.mode || 'verify' }}
          bump: ${{ inputs.bump || 'patch' }}
          version: ${{ inputs.version }}
          version_code: ${{ inputs.version_code }}
          source_ref: ${{ inputs.source_ref }}
          prerelease: ${{ inputs.prerelease || false }}

  plan_publish:
    name: Plan publication
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      recipe_sha: ${{ steps.plan.outputs.recipe_sha }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2
      - uses: ./.github/actions/release-plan
        id: plan
        with:
          mode: publish
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}
          version_code: ${{ inputs.version_code }}
          source_ref: ${{ inputs.source_ref }}
          prerelease: ${{ inputs.prerelease || false }}

  plan:
    name: Select completed release plan
    needs: [plan_read, plan_publish]
    # Exactly one planner is intentionally skipped. Explicit status conditions
    # also keep that skipped ancestor from silently skipping downstream jobs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      source_sha: ${{ needs.plan_read.outputs.source_sha || needs.plan_publish.outputs.source_sha }}
      recipe_sha: ${{ needs.plan_read.outputs.recipe_sha || needs.plan_publish.outputs.recipe_sha }}
      version: ${{ needs.plan_read.outputs.version || needs.plan_publish.outputs.version }}
      version_code: ${{ needs.plan_read.outputs.version_code || needs.plan_publish.outputs.version_code }}
      artifact_id: ${{ needs.plan_read.outputs.artifact_id || needs.plan_publish.outputs.artifact_id }}
    steps:
      - name: Require one successful planner and one skipped planner
        env:
          READ_RESULT: ${{ needs.plan_read.result }}
          PUBLISH_RESULT: ${{ needs.plan_publish.result }}
        run: |
          case "$READ_RESULT/$PUBLISH_RESULT" in
            success/skipped|skipped/success) ;;
            *) echo '::error::Release planning failed or returned an ambiguous result'; exit 1 ;;
          esac

  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    permissions:
      contents: read
    uses: LIghtJUNction/magicnet-android/.github/workflows/exec.yml@9dba94254780fb0a1a84a003608d5919a97de4f2
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      recipe_sha: ${{ needs.plan.outputs.recipe_sha }}
      release_version: ${{ needs.plan.outputs.version }}
      release_version_code: ${{ needs.plan.outputs.version_code }}
      release_quality: ${{ github.event_name == 'pull_request' || inputs.mode == 'publish' || inputs.mode == 'verify' }}

  android:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'pull_request' || inputs.mode == 'publish' || inputs.mode == 'verify') }}
    permissions:
      contents: read
    uses: LIghtJUNction/magicnet-android/.github/workflows/android-kernelsu-acceptance.yml@9dba94254780fb0a1a84a003608d5919a97de4f2
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      release_version: ${{ needs.plan.outputs.version }}
      release_version_code: ${{ needs.plan.outputs.version_code }}

  verify:
    name: Verify release assets
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.recipe_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Initialize selected implementation
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          git submodule update --init --depth 1 -- generated/magicnet-android
          git -C generated/magicnet-android fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C generated/magicnet-android checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/plan
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify exact version, source and complete archive inventory
        run: python3 scripts/release.py verify --plan "$RUNNER_TEMP/plan/release-plan.json" --directory dist

  publish:
    needs: [plan, build, android, verify]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && needs.plan.result == 'success' && needs.build.result == 'success' && needs.android.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.recipe_sha }}
          persist-credentials: true
          fetch-depth: 2
      - run: git submodule update --init --depth 1 -- generated/magicnet-android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify final assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: python3 scripts/release-plan.py publish --directory dist --artifact-id "$ARTIFACT_ID"
      - name: Update the stable index after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py sync-index --directory dist
