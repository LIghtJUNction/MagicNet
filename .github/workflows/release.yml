name: Build and release MagicNet

run-name: MagicNet ${{ inputs.mode || 'verify' }} · ${{ inputs.version || inputs.bump || 'patch preview' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: build = artifacts; verify = all release gates; publish = gates + GitHub Release
        type: choice
        options: [build, verify, publish]
        default: build
        required: true
      bump:
        description: Increment the newer source/published version; use none for a custom version
        type: choice
        options: [none, patch, minor, major]
        default: none
        required: true
      version:
        description: Optional exact version, e.g. 1.9.0 or v1.9.0 (requires bump=none)
        type: string
        default: ''
      version_code:
        description: Optional Android versionCode; empty selects or increments it automatically
        type: string
        default: ''
      source_ref:
        description: Empty = pinned source; main, a branch, tag or SHA selects magicnet-android explicitly
        type: string
        default: ''
      prerelease:
        description: Publish as a prerelease without changing the stable updater
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/**
      - scripts/**
      - .gitmodules
      - generated/magicnet-android

permissions:
  contents: read

concurrency:
  group: magicnet-release-${{ github.event_name == 'pull_request' && github.ref || github.repository }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      recipe_sha: ${{ steps.plan.outputs.recipe_sha }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
          fetch-depth: 2
      - name: Initialize pinned implementation
        run: git submodule update --init --depth 1 -- generated/magicnet-android
      - uses: ./.github/actions/recipe-check
      - name: Select version and freeze the release snapshot
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'verify' }}
          BUMP: ${{ inputs.bump || 'patch' }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(prepare --mode "$RELEASE_MODE" --bump "$BUMP" --version "$VERSION"
                --version-code "$VERSION_CODE" --source-ref "$SOURCE_REF"
                --output "$RUNNER_TEMP/plan/release-plan.json")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          python3 scripts/release-plan.py "${args[@]}"
      - name: Save immutable release plan
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: magicnet-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan/release-plan.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: plan
    permissions:
      contents: read
    uses: LIghtJUNction/magicnet-android/.github/workflows/exec.yml@b6e51bab3d31a9168074695956ca3925f6acfcee
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      recipe_sha: ${{ needs.plan.outputs.recipe_sha }}
      release_version: ${{ needs.plan.outputs.version }}
      release_version_code: ${{ needs.plan.outputs.version_code }}
      release_quality: ${{ github.event_name == 'pull_request' || inputs.mode == 'publish' || inputs.mode == 'verify' }}

  android:
    needs: plan
    if: github.event_name == 'pull_request' || inputs.mode == 'publish' || inputs.mode == 'verify'
    permissions:
      contents: read
    uses: LIghtJUNction/magicnet-android/.github/workflows/android-kernelsu-acceptance.yml@b6e51bab3d31a9168074695956ca3925f6acfcee
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      release_version: ${{ needs.plan.outputs.version }}
      release_version_code: ${{ needs.plan.outputs.version_code }}

  verify:
    name: Verify release assets
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.recipe_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Initialize selected implementation
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          git submodule update --init --depth 1 -- generated/magicnet-android
          git -C generated/magicnet-android fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C generated/magicnet-android checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: ${{ runner.temp }}/plan
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify exact version, source and complete archive inventory
        run: python3 scripts/release.py verify --plan "$RUNNER_TEMP/plan/release-plan.json" --directory dist

  publish:
    needs: [plan, build, android, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.recipe_sha }}
          persist-credentials: true
          fetch-depth: 2
      - run: git submodule update --init --depth 1 -- generated/magicnet-android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify final assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: python3 scripts/release-plan.py publish --directory dist --artifact-id "$ARTIFACT_ID"
      - name: Update the stable index after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py sync-index --directory dist
