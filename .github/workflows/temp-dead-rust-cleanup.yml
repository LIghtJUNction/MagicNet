name: Temporary dead Rust cleanup

on:
  push:
    branches:
      - chore/remove-dead-rust-readers-20260916

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive

      - name: Remove dead compatibility leftovers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          utils = Path("crates/magicnet-cli/src/utils.rs")
          text = utils.read_text()

          clean_lines = '''/// Soft reader that follows symlinks. Prefer [`clean_module_lines`] for
          /// module-owned state so symlink swaps cannot redirect privileged reads.
          #[allow(dead_code)]
          pub(crate) fn clean_lines(path: PathBuf) -> Vec<String> {
              fs::read_to_string(path)
                  .map(|text| filter_clean_lines(&text))
                  .unwrap_or_default()
          }

          '''
          first_clean_line = '''/// Soft reader for non-module paths. Prefer [`clean_module_lines`] /
          /// [`first_clean_module_line`] for anything under the module root.
          #[allow(dead_code)]
          pub(crate) fn first_clean_line(path: PathBuf) -> String {
              clean_lines(path).into_iter().next().unwrap_or_default()
          }

          '''
          old_comment = '''/// writers. Missing or malformed ordinary list files retain `clean_lines`'
          /// empty-list semantics, while symlinks, nonregular files, and hard links are
          '''
          new_comment = '''/// writers. Missing or malformed ordinary list files retain empty-list
          /// semantics, while symlinks, nonregular files, and hard links are
          '''

          for label, block in (("clean_lines", clean_lines), ("first_clean_line", first_clean_line)):
              if text.count(block) != 1:
                  raise SystemExit(f"expected exactly one {label} block, found {text.count(block)}")
              text = text.replace(block, "")
          if text.count(old_comment) != 1:
              raise SystemExit("expected exactly one clean_lines documentation reference")
          text = text.replace(old_comment, new_comment)
          if re.search(r"\b(clean_lines|first_clean_line)\b|#\[allow\(dead_code\)\]", text):
              raise SystemExit("dead soft-reader compatibility code remains")
          utils.write_text(text)

          workflow = Path(".github/workflows/android-kernelsu-acceptance.yml")
          text = workflow.read_text()
          retired = "magicnet-mcp" + "-server"
          replacements = {
              f"cargo ndk -t x86_64 build --release -p magicnet-cli -p {retired}":
                  "cargo ndk -t x86_64 build --release -p magicnet-cli",
              f'''          install -m 0755 target/x86_64-linux-android/release/{retired} "$RUNNER_TEMP/magicnet-x86/{retired}"\n''':
                  "",
              f'''          MAGICNET_X86_MCP: ${{{{ runner.temp }}}}/magicnet-x86/{retired}\n''':
                  "",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one stale Android MCP fragment: {old!r}; found {text.count(old)}")
              text = text.replace(old, new)
          if retired in text or "MAGICNET_X86_MCP" in text:
              raise SystemExit("stale standalone MCP binary contract remains in Android acceptance")
          workflow.write_text(text)

          hygiene = Path("scripts/test-repository-hygiene.sh")
          text = hygiene.read_text()
          anchor = '''for retired in "${retired_files[@]}"; do
              if git ls-files --error-unmatch "$retired" >/dev/null 2>&1; then
                  fail "retired repository file is tracked: $retired"
              fi
          done

          '''
          guard = '''for retired in "${retired_files[@]}"; do
              if git ls-files --error-unmatch "$retired" >/dev/null 2>&1; then
                  fail "retired repository file is tracked: $retired"
              fi
          done

          retired_mcp_name="$(printf '%s%s' 'magicnet-mcp' '-server')"
          retired_mcp_refs="$(git grep -nF -- "$retired_mcp_name" || true)"
          [[ -z "$retired_mcp_refs" ]] || fail "retired standalone MCP binary/package references found:
          $retired_mcp_refs"

          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one repository hygiene insertion point, found {text.count(anchor)}")
          hygiene.write_text(text.replace(anchor, guard))
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p magicnet-cli
          cargo test -p magicnet-cli
          bash scripts/test-repository-hygiene.sh

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/magicnet-cli/src/utils.rs .github/workflows/android-kernelsu-acceptance.yml scripts/test-repository-hygiene.sh
          git diff --cached --check
          git commit -m 'chore: remove stale MCP and Rust compatibility leftovers'
          git push origin HEAD:${GITHUB_REF_NAME}
