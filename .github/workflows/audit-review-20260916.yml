name: Three-day audit (isolated)
on:
  push:
    branches: [audit/review-20260916]
permissions:
  contents: read
concurrency:
  group: audit-review-20260916
  cancel-in-progress: true
env:
  CI_TEST_FORCE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Assemble reviewed changes on a clean base
        run: |
          set -euo pipefail
          cp .audit/prepare.py /tmp/prepare-magicnet.py
          git checkout -b fix/audit-consolidation-20260916 ff3b5f07a53da92696eb8c33e833de9b1dca5434
          python3 /tmp/prepare-magicnet.py
          cargo fmt --all
      - name: Lock the QR encoder and independent test decoder
        working-directory: webui
        run: |
          npm install --save-exact qrcode-generator@2.0.4
          npm install --save-dev --save-exact jsqr@1.4.0
          npm run check
      - name: Publish candidate only (never main)
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .audit/prepare.py
          test ! -e .github/workflows/audit-review-20260916.yml
          git config user.name 'MagicNet audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates scripts src/MagicNet/lib webui
          git diff --cached --stat
          git commit -m 'fix: consolidate bounded runtime probes, dynamic API and Tailscale regressions' -m 'Integrate #286 resource handling and #285 state/lock bounds without parallel reapers. Integrate #263 dynamic controller discovery and repair its package smoke fixture. Replace unscannable handwritten QR encoding with an independently decoded library implementation. Unify Tailscale save/remove transactions and report actual cleanup/restart outcomes.'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/audit-consolidation-20260916
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/candidate
          git archive --format=tar.gz -o /tmp/candidate/source.tar.gz HEAD
          git diff ff3b5f07a53da92696eb8c33e833de9b1dca5434 HEAD > /tmp/candidate/consolidation.patch
          git ls-tree -r HEAD > /tmp/candidate/tree.txt
          tar -czf /tmp/candidate/qr-dependencies.tar.gz -C webui/node_modules qrcode-generator jsqr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-audit-candidate
          path: /tmp/candidate/
          retention-days: 7
          if-no-files-found: error
  rust:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - run: git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked --target aarch64-linux-android
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
        working-directory: webui
      - run: npx playwright install --with-deps chromium
        working-directory: webui
      - run: npm run test:ui
        working-directory: webui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: audit-browser-failures
          path: webui/test-results/
          retention-days: 7
