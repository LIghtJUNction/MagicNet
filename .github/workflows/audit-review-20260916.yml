name: Three-day audit (isolated)
on:
  push:
    branches: [audit/review-20260916]
permissions:
  contents: read
concurrency:
  group: audit-review-20260916
  cancel-in-progress: true
env:
  CI_TEST_FORCE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the tested rollback-baseline patch on its reviewed base
        shell: bash
        run: |
          set -euo pipefail
          cp .audit/subscription-baseline.patch /tmp/subscription-baseline.patch
          git checkout -b fix/subscription-baseline-20260916 d862c76b55f7a0569daaf5ba456cbfd2c53add45
          git apply /tmp/subscription-baseline.patch
          git add scripts src/MagicNet/lib
          git diff --cached --check
      - name: Prove the regression fails on the unpatched base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline-red d862c76b55f7a0569daaf5ba456cbfd2c53add45
          cp scripts/test-subscription-baseline-safety.sh /tmp/baseline-red/scripts/
          if bash /tmp/baseline-red/scripts/test-subscription-baseline-safety.sh > /tmp/baseline-red.log 2>&1; then
            echo 'Regression unexpectedly passed without the fix' >&2
            exit 1
          fi
          echo 'Unpatched baseline rejected by the behavioral regression as expected'
      - name: Check shell and transaction regressions
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck
          command -v jq
          bash scripts/lint-shell.sh
          bash scripts/test-config-empty-recovery.sh
          bash scripts/test-subscription-baseline-safety.sh
          bash scripts/test-subscription-transaction-atomicity.sh
          bash scripts/test-subscription-transaction-journal-safety.sh
          bash scripts/test-subscription-lifecycle.sh
      - name: Publish a clean follow-up branch, never main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .audit/subscription-baseline.patch
          test ! -e .github/workflows/audit-review-20260916.yml
          git config user.name 'MagicNet audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix: reject invalid subscription rollback baselines and uncommitted checkpoints'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/subscription-baseline-20260916
          mkdir -p /tmp/candidate
          git archive --format=tar.gz -o /tmp/candidate/source.tar.gz HEAD
          git diff d862c76b55f7a0569daaf5ba456cbfd2c53add45 HEAD > /tmp/candidate/subscription-baseline.patch
          git ls-tree -r HEAD > /tmp/candidate/tree.txt
          git rev-parse HEAD | tee /tmp/candidate/commit.txt
          cp /tmp/baseline-red.log /tmp/candidate/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: subscription-baseline-candidate
          path: /tmp/candidate/
          retention-days: 7
          if-no-files-found: error
