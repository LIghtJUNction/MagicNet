name: Three-day audit (isolated)
on:
  push:
    branches: [audit/review-20260916]
permissions:
  contents: read
concurrency:
  group: audit-review-20260916
  cancel-in-progress: true
env:
  CI_TEST_FORCE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect immutable source and history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          base=ff3b5f07a53da92696eb8c33e833de9b1dca5434
          git archive --format=tar.gz -o /tmp/audit/source.tar.gz "$base"
          git log --since-as-filter='2026-09-13T05:22:52Z' --format='%H %cI %s' "$base" > /tmp/audit/commits.txt
          git log --first-parent --since-as-filter='2026-09-13T05:22:52Z' --format='%H %cI %s' --stat "$base" > /tmp/audit/first-parent.txt
          git log --first-parent --since-as-filter='2026-09-13T05:22:52Z' -p "$base" > /tmp/audit/first-parent.patch
          git ls-tree -r "$base" > /tmp/audit/tree.txt
          printf 'ALL ANCESTRY COMMITS: '; wc -l < /tmp/audit/commits.txt
          printf '\nFIRST-PARENT INVENTORY\n'; cat /tmp/audit/first-parent.txt
          for pr in 259 263 285 286; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '{number,title,state,draft,head:{ref:.head.ref,sha:.head.sha},base:{ref:.base.ref,sha:.base.sha},mergeable,mergeable_state,changed_files,additions,deletions}' | tee "/tmp/audit/pr-$pr.json"
            git fetch origin "pull/$pr/head:refs/remotes/origin/audit-pr-$pr"
            git archive --format=tar.gz -o "/tmp/audit/pr-$pr.tar.gz" "refs/remotes/origin/audit-pr-$pr"
            git diff "$base...refs/remotes/origin/audit-pr-$pr" > "/tmp/audit/pr-$pr.patch"
            sha=$(git rev-parse "refs/remotes/origin/audit-pr-$pr")
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[]|{name,status,conclusion,details_url}]' | tee "/tmp/audit/pr-$pr-checks.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$base&per_page=100" --jq '[.workflow_runs[]|{id,name,status,conclusion,html_url}]' | tee /tmp/audit/main-checks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: three-day-audit-source
          path: /tmp/audit/
          retention-days: 7
          if-no-files-found: error
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked --target aarch64-linux-android
  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
        working-directory: webui
      - run: npm run check
        working-directory: webui
