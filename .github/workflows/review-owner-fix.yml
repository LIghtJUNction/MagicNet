name: Review owner identity correction
on:
  push:
    branches: [fix/subscription-lifecycle-ui-v1.5.15]
    paths: [.github/workflows/review-owner-fix.yml]
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'LIghtJUNction/MagicNet' && github.ref == 'refs/heads/fix/subscription-lifecycle-ui-v1.5.15'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Correct the caller identity without weakening the live-writer regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/magicnet-cli/src/subscriptions.rs')
          text = p.read_text()
          old = 'let stat = read_proc_text_bounded(Path::new("/proc/self/stat"), MAX_PROC_STAT_BYTES)'
          new = '''// The bounded reader forks: /proc/self would describe its worker,
                  // not the caller whose PID owns this source-edit lock.
                  let stat_path = PathBuf::from(format!("/proc/{}/stat", std::process::id()));
                  let stat = read_proc_text_bounded(&stat_path, MAX_PROC_STAT_BYTES)'''
          assert text.count(old) == 1, 'source changed; review required'
          p.write_text(text.replace(old, new))
          p = Path('webui/e2e/page-review.spec.mjs')
          text = p.read_text()
          old = '      await page.evaluate(() => document.fonts.ready);'
          new = '''      await page.evaluate(async () => {
                  await document.fonts.ready;
                  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
                  window.scrollTo({ top: 0, behavior: "instant" });
                  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                });'''
          assert text.count(old) == 1, 'visual review changed; review required'
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git add crates/magicnet-cli/src/subscriptions.rs webui/e2e/page-review.spec.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind subscription clear lock to caller rather than proc reader' -m 'Keep the failing live-writer regression unchanged. Settle scroll and focus before actual page screenshots.'
          git push origin HEAD:fix/subscription-lifecycle-ui-v1.5.15
      - name: Run the full Rust suite including the live-writer regression
        run: |
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
          cargo test --workspace --locked
