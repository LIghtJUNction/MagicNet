name: Play startup fixture audit
on:
  push:
    branches: [audit/play-startup-smoke-20260916]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Load only required pinned public submodules
        run: git submodule update --init src/MagicNet/lib/kamfw src/MagicNet/.config/sing-box
      - name: Install host test tools
        run: sudo apt-get update -qq && sudo apt-get install -y jq ripgrep shellcheck shfmt
      - name: Build exact host CLI
        run: cargo build --locked -p magicnet-cli
      - name: Export exact source and host executable for isolated reproduction
        run: |
          mkdir -p "$RUNNER_TEMP/play-startup-evidence/tools"
          git rev-parse HEAD > "$RUNNER_TEMP/play-startup-evidence/source-revision.txt"
          git submodule status > "$RUNNER_TEMP/play-startup-evidence/submodules.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/play-startup-source.tar"
          tar --append --file="$RUNNER_TEMP/play-startup-source.tar" --exclude=.git src/MagicNet/lib/kamfw src/MagicNet/.config/sing-box
          gzip "$RUNNER_TEMP/play-startup-source.tar"
          mv "$RUNNER_TEMP/play-startup-source.tar.gz" "$RUNNER_TEMP/play-startup-evidence/"
          cp target/debug/magicnet-cli "$RUNNER_TEMP/play-startup-evidence/tools/"
          for tool in rg shellcheck shfmt; do cp "$(command -v "$tool")" "$RUNNER_TEMP/play-startup-evidence/tools/"; done
          sha256sum target/debug/magicnet-cli > "$RUNNER_TEMP/play-startup-evidence/cli-sha256.txt"
      - name: Reproduce unchanged source fixture
        run: |
          set +e
          MAGICNET_FAKE_KEEP=1 bash -x scripts/fake-magisk-smoke.sh > "$RUNNER_TEMP/play-startup-evidence/smoke.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/play-startup-evidence/smoke-exit-status.txt"
          tail -n 100 "$RUNNER_TEMP/play-startup-evidence/smoke.log"
          exit "$result"
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-startup-reproduction
          path: ${{ runner.temp }}/play-startup-evidence
          retention-days: 2
          if-no-files-found: error
