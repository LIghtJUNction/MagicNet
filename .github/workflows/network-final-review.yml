name: Network Final Review Sources
on:
  push:
    branches: [audit/network-final-review-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export tracked files at reviewed revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/network-review"
          for pair in main:970bcd0ff74422573b7c67fcc6f7a7ed9ed80827 dns:c156b2124b0be0a95495725b0bc7610fc14916b5 owned:0beee578b8cb31ef3438c33b9a4a5ac511b15a77 mark:afe78dd672fa388ba8ed573ce7fd604553a4b7d1; do
            name=${pair%%:*}; sha=${pair#*:}
            git fetch --depth=1 origin "$sha"
            git archive --format=tar "$sha" | gzip > "$RUNNER_TEMP/network-review/$name.tar.gz"
            git ls-tree -r "$sha" > "$RUNNER_TEMP/network-review/$name-tree.txt"
            printf '%s %s\n' "$name" "$sha" >> "$RUNNER_TEMP/network-review/revisions.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-final-review-sources
          path: ${{ runner.temp }}/network-review
          if-no-files-found: error
          retention-days: 1
