name: One-time reviewed branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-reviewed-branches.yml]
permissions:
  contents: read
concurrency:
  group: magicnet-reviewed-branch-cleanup-20261030
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'LIghtJUNction/MagicNet'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: false
      - name: Recheck reviewed commits and delete unchanged merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune-reviewed-branches.py scripts/branch-cleanup-reviewed.json --execute
