name: Validate Kam Module

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kam-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@1d6ad8a9f58446a4519fda12a52f0c71fb667d8b # v3
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          cache-targets: cargo,kam
          install-commitizen: "false"
          warn-private-key: "false"

      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq python3-yaml

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          kam validate
          kam check
          python3 scripts/test-release-workflow.py
          bash scripts/test-subscription-usage.sh
