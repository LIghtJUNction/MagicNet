name: Validate Kam Module

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kam-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          enable-cache: 'true'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          warn-private-key: 'false'

      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq python3-yaml

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          kam validate
          kam check

          mapfile -t shell_files < <(
            {
              find hooks -type f -name '*.sh' 2>/dev/null || true
              find src -type f -name '*.sh' 2>/dev/null || true
              test ! -f kam.sh || printf '%s\n' kam.sh
            } | sort -u
          )

          if [ "${#shell_files[@]}" -gt 0 ]; then
            shellcheck -s bash -e SC1091,SC1090,SC2317,SC2329,SC2059 "${shell_files[@]}"
          fi
