name: Validate Kam Module

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kam-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@1d6ad8a9f58446a4519fda12a52f0c71fb667d8b # v3
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          cache-targets: cargo,kam
          install-commitizen: "false"
          warn-private-key: "false"

      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq python3-yaml

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          kam validate
          kam check
          python3 scripts/test-release-workflow.py
          bash scripts/test-subscription-usage.sh
          bash scripts/test-artifact-signature.sh

  deprecate_v1_4_releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark every v1.4.x release deprecated and broken
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t releases < <(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -c 'add[] | select(.tag_name | startswith("v1.4."))'
          )

          if (( ${#releases[@]} == 0 )); then
            echo "No v1.4.x releases found."
            exit 1
          fi

          for release in "${releases[@]}"; do
            id="$(jq -r '.id' <<<"$release")"
            tag="$(jq -r '.tag_name' <<<"$release")"
            old_name="$(jq -r '.name // .tag_name' <<<"$release")"
            old_body="$(jq -r '.body // ""' <<<"$release")"

            if [[ "$old_name" == "[DEPRECATED / BROKEN] "* ]]; then
              new_name="$old_name"
            else
              new_name="[DEPRECATED / BROKEN] $old_name"
            fi

            marker='此 1.4.x 版本已确认存在问题'
            if grep -Fq "$marker" <<<"$old_body"; then
              new_body="$old_body"
            else
              new_body="$(cat <<EOF
> [!CAUTION]
> **已弃用 / DEPRECATED**
>
> 此 1.4.x 版本已确认存在问题，**请勿下载、安装或继续使用**。发布资产仅保留用于追溯和调试。
>
> This v1.4.x release is deprecated and known to be problematic. **Do not install or use it.** Assets are retained for traceability/debugging.

---

$old_body
EOF
)"
            fi

            jq -n \
              --arg name "$new_name" \
              --arg body "$new_body" \
              '{name: $name, body: $body, prerelease: true, make_latest: "false"}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" --input - >/dev/null

            echo "Deprecated ${tag}"
          done
