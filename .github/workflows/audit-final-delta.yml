name: Final audit delta
on:
  push:
    branches: [audit/magicnet-72h-20260916]
    paths: [.github/workflows/audit-final-delta.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare only reviewed files
        env:
          AUDIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for f in google-native.patch refactor_webui.py machine-status.test.mjs; do
            git show "$AUDIT_SHA":.audit/$f > /tmp/$f
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b audit/final-delta-result-20260916 373a02a46309e1513018a577ce4f82432c8c2906
          git merge --no-edit e1bb6da9342945cb13db53a7bb9853fccd7ab0d9
          git apply /tmp/google-native.patch
          python3 /tmp/refactor_webui.py
          cp /tmp/machine-status.test.mjs webui/machine-status.test.mjs
          git add scripts/test-google-play-direct-fallback.sh scripts/test-host.sh src/MagicNet/lib/magicnet/jq/google-play-policy.jq src/MagicNet/lib/magicnet/singbox_subscribe/config.sh webui
          git diff --cached --check
          git submodule update --init --depth 1 src/MagicNet/.config/sing-box
          mkdir -p /tmp/final-results
      - name: Install host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep jq shellcheck shfmt
      - name: Native Google policy red-green regression
        run: |
          set -euo pipefail
          cp src/MagicNet/lib/magicnet/singbox_subscribe/config.sh /tmp/config-fixed.sh
          git show HEAD:src/MagicNet/lib/magicnet/singbox_subscribe/config.sh > src/MagicNet/lib/magicnet/singbox_subscribe/config.sh
          if bash scripts/test-google-play-direct-fallback.sh; then
            echo 'Expected the unpatched regression to fail' >&2
            exit 1
          fi
          cp /tmp/config-fixed.sh src/MagicNet/lib/magicnet/singbox_subscribe/config.sh
          bash scripts/test-google-play-direct-fallback.sh | tee /tmp/final-results/google.log
      - name: Full shell and WebUI validation
        env:
          CI_TEST_FORCE: '1'
        run: |
          set +e
          status=0
          for check in 'bash scripts/lint-shell.sh' 'bash scripts/test-host.sh' 'cd webui && npm ci && npm run check'; do
            file=/tmp/final-results/check-$(ls /tmp/final-results | wc -l).log
            bash -o pipefail -c "$check" > "$file" 2>&1
            rc=$?
            echo "RESULT=$rc COMMAND=$check" | tee -a /tmp/final-results/summary.txt
            if [ "$rc" -ne 0 ]; then tail -80 "$file"; status=1; fi
          done
          exit "$status"
      - name: Publish verified delta
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --cached --name-only -- .audit .github)"
          git commit -m 'fix(audit): restore native Play policy and strict shared machine status'
          git push origin HEAD:refs/heads/audit/final-delta-result-20260916
          git rev-parse HEAD | tee /tmp/final-results/sha.txt
          git archive --format=tar.gz HEAD > /tmp/final-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-audit-delta-results
          path: /tmp/final-results/
          retention-days: 7
