name: Preserve Pinned kamfw Source
on:
  push:
    branches: ['work/rewrite-transfer-20260926']
    paths: ['.github/workflows/rewrite-materialize.yml']
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'LIghtJUNction/MagicNet' && github.ref == 'refs/heads/work/rewrite-transfer-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read exact public framework revision without executing its code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MemDeco-WG/kamfw
          ref: 35b2284c08446f6e22447a63d7c3331619e2e854
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Copy verified Git objects into the owner's archive repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          def git(*args): return subprocess.check_output(['git',*args])
          revision='35b2284c08446f6e22447a63d7c3331619e2e854'
          expected_tree='e615227fb77f8ce1bb4cb90c83e794d4de7ee56d'
          assert git('rev-parse','HEAD').decode().strip()==revision
          assert git('rev-parse','HEAD^{tree}').decode().strip()==expected_tree
          base='https://api.github.com/repos/LIghtJUNction/MagicNet'
          def api(path,data):
              request=urllib.request.Request(base+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          tree=[]; total=0; seen=set()
          records=[item for item in git('ls-files','-s','-z').split(b'\0') if item]
          assert 0 < len(records) <= 512
          for record in records:
              metadata,raw_path=record.split(b'\t',1)
              mode,source_sha,stage=metadata.decode().split()
              path=raw_path.decode(); parts=pathlib.PurePosixPath(path)
              assert stage=='0' and mode in ('100644','100755','120000')
              assert not parts.is_absolute() and '..' not in parts.parts and '.git' not in parts.parts
              assert parts.name!='.env' and not (parts.name.startswith('.env.') and parts.name!='.env.example')
              data=git('cat-file','blob',source_sha)
              total+=len(data)
              assert len(data)<=2*1024*1024 and total<=16*1024*1024
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==source_sha
              if source_sha not in seen:
                  uploaded=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
                  assert uploaded==source_sha
                  seen.add(source_sha)
              tree.append({'path':path,'mode':mode,'type':'blob','sha':source_sha})
          copied=api('/git/trees',{'tree':tree})['sha']
          assert copied==expected_tree
          manifest={'schema':1,'source_repository':'MemDeco-WG/kamfw','source_commit':revision,'source_tree':copied,'files':len(records),'bytes':total,'scope':'byte-identical tracked source snapshot, including license; not upstream history or a runtime backup','upstream_modified':False}
          blob=api('/git/blobs',{'content':json.dumps(manifest,indent=2)+'\n','encoding':'utf-8'})['sha']
          root=api('/git/trees',{'tree':[{'path':'kamfw','mode':'040000','type':'tree','sha':copied},{'path':'archive.json','mode':'100644','type':'blob','sha':blob}]})['sha']
          commit=api('/git/commits',{'message':'archive: preserve pinned kamfw source and license\n\nSource: MemDeco-WG/kamfw@'+revision+'\nCopied source tree: '+copied+'\nNo upstream repository or production branch is modified.','tree':root,'parents':[]})['sha']
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'kamfw-archive'; output.mkdir()
          (output/'result.json').write_text(json.dumps({'schema':1,'commit':commit,'tree':root,'source':manifest,'refs_updated':False},indent=2)+'\n')
          print('Pinned source copied with identical Git tree; archive ref is not yet created.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kamfw-archive-provenance
          path: ${{ runner.temp }}/kamfw-archive/
          retention-days: 3
