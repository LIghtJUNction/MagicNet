name: Materialize Reviewed Rewrite Repair
on:
  push:
    branches: ['work/rewrite-transfer-20260926']
    paths: ['.github/workflows/rewrite-materialize.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'LIghtJUNction/MagicNet' && github.ref == 'refs/heads/work/rewrite-transfer-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply checksum-bound patch and publish unreferenced Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse','HEAD^').decode().strip() == 'cca36323fa98e0a9e83559de2729301a81febe5f'
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '79b572f37390ce4086a9f351a36058b1f5ca196474acb8928b41dd9e0acc4e77'
          artifact = pathlib.Path(os.environ['RUNNER_TEMP'])/'rewrite-objects'
          artifact.mkdir()
          patch_path = artifact/'reviewed.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--whitespace=error-all',str(patch_path)],check=True)
          helper = '.github/workflows/rewrite-materialize.yml'
          subprocess.run(['git','rm','--',helper],check=True)
          expected = {helper,'scripts/android-device-simulation.py','scripts/fake-magisk-smoke.sh','scripts/test-android-device-simulation.py'}
          changes = set(git('diff','--cached','--name-only','-z').decode().rstrip('\0').split('\0'))
          assert changes == expected
          # No test result is forged and no branch/ref is moved by this job.
          subprocess.run(['python3','scripts/test-android-device-simulation.py'],check=True)
          subprocess.run(['bash','-n','scripts/fake-magisk-smoke.sh'],check=True)
          base = 'https://api.github.com/repos/LIghtJUNction/MagicNet'
          def api(path, data=None):
              request = urllib.request.Request(base+path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          parent = git('rev-parse','HEAD').decode().strip()
          tree = []
          for path in sorted(changes):
              if path == helper:
                  tree.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              staged = git('show',':'+path)
              blob = api('/git/blobs',{'content':base64.b64encode(staged).decode(),'encoding':'base64'})
              expected_blob = hashlib.sha1(b'blob '+str(len(staged)).encode()+b'\0'+staged).hexdigest()
              assert blob['sha'] == expected_blob
              mode = git('ls-files','--stage','--',path).decode().split()[0]
              tree.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          tree_sha = api('/git/trees',{'base_tree':api('/git/commits/'+parent)['tree']['sha'],'tree':tree})['sha']
          assert tree_sha == git('write-tree').decode().strip()
          commit = api('/git/commits',{'message':'test: repair exact curl response and x86_64 CLI alias fixtures\n\nPreserve all existing assertions and reject nonidentical executable aliases. No production network validation is weakened.','tree':tree_sha,'parents':[parent]})['sha']
          (artifact/'result.json').write_text(json.dumps({'schema':1,'parent':parent,'commit':commit,'tree':tree_sha,'patch_sha256':hashlib.sha256(patch).hexdigest(),'paths':sorted(changes)},indent=2)+'\n')
          print('Created reviewed Git objects; repository refs are unchanged.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-rewrite-objects
          path: ${{ runner.temp }}/rewrite-objects/
          retention-days: 2
