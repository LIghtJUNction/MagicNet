name: PR 286 isolated review

on:
  push:
    branches: [audit/pr286-review-20260915]
    paths: [.github/workflows/pr286-review-audit.yml, scripts/pr286_review_patch.py]

permissions:
  contents: write

jobs:
  review:
    if: github.repository == 'LIghtJUNction/MagicNet' && github.ref == 'refs/heads/audit/pr286-review-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: eeebef566c9ea968d5bf2da42709c603ad1e80d1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check out immutable PR source, not the audit files
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/pr286_review_patch.py "$RUNNER_TEMP/pr286_review_patch.py"
          git fetch --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - name: Add behavioral regressions and compile the unchanged implementation
        run: |
          python3 "$RUNNER_TEMP/pr286_review_patch.py" regressions
          cargo test -p magicnet-cli --no-run
      - name: Prove both regressions fail on the original PR
        shell: bash
        run: |
          set -euo pipefail
          for case in command_retains_leader_until_pipe_cleanup lifecycle_deferred_children_use_one_reaper; do
            log="$RUNNER_TEMP/$case.baseline.log"
            if cargo test -p magicnet-cli "$case" -- --nocapture >"$log" 2>&1; then
              cat "$log"
              echo "Regression unexpectedly passed on the original implementation: $case" >&2
              exit 1
            fi
            cat "$log"
            grep -Fq 'test result: FAILED' "$log"
            echo "BASELINE_REPRODUCED=$case"
          done
      - name: Apply scoped repairs and format
        run: |
          python3 "$RUNNER_TEMP/pr286_review_patch.py" fix
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('crates/magicnet-cli/src/utils.rs')
          text, count = re.subn(
              r'if err\.raw_os_error\(\) != Some\(libc::ECHILD\) \{\s+if worker_status\.is_none\(\) \{\s+kill_and_reap\(worker_pid\);\s+\}\s+\}',
              'if err.raw_os_error() != Some(libc::ECHILD) && worker_status.is_none() {\n                        kill_and_reap(worker_pid);\n                    }',
              path.read_text(),
          )
          assert count == 1, count
          path.write_text(text)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Test the complete Rust workspace
        run: cargo test --workspace
      - name: Strict Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile-check Android-specific branches
        run: cargo check --workspace --target aarch64-linux-android
      - name: Publish only the tested code commit to a result branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'crates/magicnet-cli/src/utils.rs',
              'crates/magicnet-cli/src/process.rs',
              'crates/magicnet-cli/tests/internal/resource_limits.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          PY
          git diff --stat
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/magicnet-cli/src/utils.rs crates/magicnet-cli/src/process.rs crates/magicnet-cli/tests/internal/resource_limits.rs
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'fix(cli): preserve child identity and share lifecycle cleanup budgets' | git commit-tree "$tree" -p "$BASE")"
          result_branch="audit/pr286-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$commit:refs/heads/$result_branch"
          echo "RESULT_COMMIT=$commit"
          echo "RESULT_BRANCH=$result_branch"
          {
            echo "Validated commit: $commit"
            echo "Result branch: $result_branch"
            echo 'Both original-code regressions reproduced; complete workspace tests, clippy, fmt and Android compile-check passed.'
            echo 'The original PR branch has not been modified by this audit workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
