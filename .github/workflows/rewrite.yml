name: Rewrite Verification

on:
  workflow_dispatch:
  pull_request:
    paths: ['next/**', '.github/workflows/rewrite.yml']
  push:
    branches: ['main', 'rewrite/20260926']
    paths: ['next/**', '.github/workflows/rewrite.yml']

permissions:
  contents: read

concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Retain exact candidate source before validation
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/rewrite-source"
          git archive HEAD next > "$RUNNER_TEMP/rewrite-source/next.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/rewrite-source/revision.txt"
          cd "$RUNNER_TEMP/rewrite-source"
          sha256sum next.tar > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rewrite-source-${{ github.sha }}
          path: ${{ runner.temp }}/rewrite-source/
          retention-days: 7
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target aarch64-linux-android,x86_64-linux-android
          rustup override set 1.98.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next/webui/package-lock.json
      - name: Rust formatting, lint, unit tests and host binary
        run: |
          set -euo pipefail
          mkdir -p test-results
          cargo fmt --all --check 2>&1 | tee test-results/rustfmt.log
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee test-results/clippy.log
          cargo test --workspace --locked 2>&1 | tee test-results/rust-tests.log
          cargo build --workspace --locked 2>&1 | tee test-results/build.log
      - name: Type-check both Android ABIs
        run: |
          set -euo pipefail
          cargo check --workspace --locked --target aarch64-linux-android 2>&1 | tee test-results/android-arm64-check.log
          cargo check --workspace --locked --target x86_64-linux-android 2>&1 | tee test-results/android-x86_64-check.log
      - name: CLI process and migration-contract tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p '*_test.py' -v 2>&1 | tee test-results/python-tests.log
          python3 tools/verify_scope.py | tee test-results/cutover-scope.json
      - name: Frontend verification
        working-directory: next/webui
        run: |
          set -euo pipefail
          npm ci
          npm run check 2>&1 | tee ../test-results/frontend-check.log
          npx playwright install --with-deps chromium
          npm run test:ui 2>&1 | tee ../test-results/frontend-ui.log
      - name: Retain test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rewrite-evidence-${{ github.sha }}
          path: |
            next/test-results/
            next/webui/test-results/
            next/webui/dist/
          if-no-files-found: ignore
          retention-days: 7
