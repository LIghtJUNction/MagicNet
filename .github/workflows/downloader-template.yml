name: Publish Reusable Downloader Template
on:
  push:
    branches: [main]
    paths:
      - 'tmpl/downloader_template/**'
      - '.github/workflows/downloader-template.yml'
      - 'scripts/test-downloader-installer.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-module-downloader
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MemDeco-WG/Kam
          ref: a2c6ed90304ea82c540907963438094e3da5c75d
          path: kam-tool
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
      - name: Build and verify Kam
        run: |
          git -C kam-tool apply "$GITHUB_WORKSPACE/installer/kam-zip-validation.patch"
          cp -a kam-tool "$RUNNER_TEMP/kam-tool"
          cd "$RUNNER_TEMP/kam-tool"
          cargo test --locked rejects_invalid_local_header_before_publication
          cargo build --locked
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Package and publish reusable template
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("tmpl/downloader_template/kam.toml", "rb"))["prop"]["version"])')
          tag="downloader-template-v${version}"
          echo "DOWNLOADER_VERSION=$version" >> "$GITHUB_ENV"
          kam validate tmpl/downloader_template
          kam build tmpl/downloader_template --quiet
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" templates/downloader_template.tar.gz --target "$GITHUB_SHA" \
              --title "Module Downloader Template $version" --notes-file tmpl/downloader_template/README.md --latest=false
          fi
          mkdir -p "$RUNNER_TEMP/published-template"
          gh release download "$tag" --pattern downloader_template.tar.gz --dir "$RUNNER_TEMP/published-template"
          # Never silently use an older immutable template for a changed version.
          mkdir -p "$RUNNER_TEMP/local-template" "$RUNNER_TEMP/remote-template"
          tar -xzf templates/downloader_template.tar.gz -C "$RUNNER_TEMP/local-template"
          tar -xzf "$RUNNER_TEMP/published-template/downloader_template.tar.gz" -C "$RUNNER_TEMP/remote-template"
          diff -r "$RUNNER_TEMP/local-template" "$RUNNER_TEMP/remote-template"
      # The branded magicnet_installer.zip is built and signed by exec.yml,
      # alongside the module, and is published only after its quality gate.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: module-downloader-template
          path: templates/downloader_template.tar.gz
