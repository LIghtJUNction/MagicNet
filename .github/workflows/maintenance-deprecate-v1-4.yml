name: Deprecate v1.4 releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/maintenance-deprecate-v1-4.yml

permissions:
  contents: write

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Mark every published v1.4.x release deprecated
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t releases < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("v1.4.")) | @base64'
          )

          if (( ${#releases[@]} == 0 )); then
            echo "No v1.4.x releases found."
            exit 1
          fi

          for encoded in "${releases[@]}"; do
            release="$(printf '%s' "$encoded" | base64 --decode)"
            id="$(jq -r '.id' <<<"$release")"
            tag="$(jq -r '.tag_name' <<<"$release")"
            old_name="$(jq -r '.name // .tag_name' <<<"$release")"
            old_body="$(jq -r '.body // ""' <<<"$release")"

            if [[ "$old_name" == "[DEPRECATED / BROKEN] "* ]]; then
              new_name="$old_name"
            else
              new_name="[DEPRECATED / BROKEN] $old_name"
            fi

            marker='此 1.4.x 版本已确认存在问题'
            if grep -Fq "$marker" <<<"$old_body"; then
              new_body="$old_body"
            else
              printf -v warning '%s\n' \
                '> [!CAUTION]' \
                '> **已弃用 / DEPRECATED**' \
                '>' \
                '> 此 1.4.x 版本已确认存在问题，**请勿下载、安装或继续使用**。发布资产仅保留用于追溯和调试。' \
                '>' \
                '> This v1.4.x release is deprecated and known to be problematic. **Do not install or use it.** Assets are retained for traceability/debugging.' \
                '' \
                '---' \
                ''
              new_body="${warning}${old_body}"
            fi

            jq -n \
              --arg name "$new_name" \
              --arg body "$new_body" \
              '{name: $name, body: $body, prerelease: true, make_latest: "false"}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" --input - >/dev/null

            echo "Deprecated ${tag}"
          done
