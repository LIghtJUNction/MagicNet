name: Verify Android SDK bootstrap
on:
  push:
    branches: [release/v1.5.5-20260916]
    paths: [.github/workflows/verify-avd-sdk-path.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Add explicit SDK tools discovery and behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/android-kernelsu-acceptance.yml')
          source = p.read_text()
          anchor = '      - name: Validate acceptance harness\n'
          assert source.count(anchor) == 1
          bootstrap = '''      - name: Locate Android SDK tools
                  shell: bash
                  run: |
                    set -euo pipefail
                    sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
                    if [[ -z "$sdk" || ! -d "$sdk/cmdline-tools" || "$sdk" == *$'\\n'* || "$sdk" == *$'\\r'* ]]; then
                      echo '::error::Android SDK command-line tools directory is missing or invalid' >&2
                      exit 2
                    fi
                    manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
                    if [[ ! -x "$manager" ]]; then
                      manager="$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' -executable | sort -V | tail -n 1)"
                    fi
                    tools="${manager%/sdkmanager}"
                    if [[ ! -x "$manager" || ! -x "$tools/avdmanager" ]]; then
                      echo '::error::Matching sdkmanager and avdmanager executables are required' >&2
                      exit 2
                    fi
                    printf '%s\\n' "$tools" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"
          '''
          lines = bootstrap.splitlines(True)
          bootstrap = lines[0] + ''.join(line[8:] if line.startswith('        ') else line for line in lines[1:])
          p.write_text(source.replace(anchor, bootstrap + '\n' + anchor))
          p = Path('scripts/test-android-acceptance-contract.py')
          source = p.read_text()
          anchor = '\n\nif __name__ == "__main__":'
          assert source.count(anchor) == 1
          tests = '''
              def test_sdk_bootstrap_precedes_all_android_consumers(self):
                  names = [step.get("name") for step in self.steps]
                  for consumer in ("Build application-UID network probe", "Create pristine Android 15 AVD", "Boot Android with KernelSU kernel"):
                      self.assertLess(names.index("Locate Android SDK tools"), names.index(consumer))

              def test_sdk_bootstrap_exports_all_tools_without_global_path_assumptions(self):
                  for layout in ("latest", "versioned"):
                      with self.subTest(layout=layout), tempfile.TemporaryDirectory() as directory:
                          root = Path(directory)
                          sdk = root / "sdk with spaces"
                          versions = ["latest"] if layout == "latest" else ["9.0", "16.0"]
                          for version in versions:
                              toolbin = sdk / "cmdline-tools" / version / "bin"
                              toolbin.mkdir(parents=True)
                              for tool in ("sdkmanager", "avdmanager"):
                                  file = toolbin / tool
                                  file.write_text("#!/bin/sh\\nexit 0\\n")
                                  file.chmod(0o755)
                          pathfile = root / "github-path"
                          env = dict(os.environ, ANDROID_SDK_ROOT=str(sdk), ANDROID_HOME="/not/the/sdk", GITHUB_PATH=str(pathfile))
                          result = subprocess.run(["bash", "-euo", "pipefail", "-c", self.step("Locate Android SDK tools")["run"]],
                                                  env=env, text=True, capture_output=True, timeout=10)
                          self.assertEqual(result.returncode, 0, result.stdout + result.stderr)
                          self.assertEqual(pathfile.read_text().splitlines(), [str(sdk / "cmdline-tools" / versions[-1] / "bin"), str(sdk / "platform-tools"), str(sdk / "emulator")])

              def test_sdk_bootstrap_fails_without_publishing_partial_paths(self):
                  for failure in ("missing-directory", "missing-manager", "missing-avdmanager", "not-executable", "newline"):
                      with self.subTest(failure=failure), tempfile.TemporaryDirectory() as directory:
                          root = Path(directory)
                          sdk = root / ("sdk\\ninjected-path" if failure == "newline" else "sdk")
                          tools = sdk / "cmdline-tools/latest/bin"
                          if failure != "missing-directory":
                              tools.mkdir(parents=True)
                              for tool in ("sdkmanager", "avdmanager"):
                                  if (failure == "missing-manager" and tool == "sdkmanager") or (failure == "missing-avdmanager" and tool == "avdmanager"):
                                      continue
                                  file = tools / tool
                                  file.write_text("#!/bin/sh\\nexit 0\\n")
                                  file.chmod(0o644 if failure == "not-executable" else 0o755)
                          pathfile = root / "github-path"
                          env = dict(os.environ, ANDROID_SDK_ROOT=str(sdk), GITHUB_PATH=str(pathfile))
                          result = subprocess.run(["bash", "-euo", "pipefail", "-c", self.step("Locate Android SDK tools")["run"]],
                                                  env=env, text=True, capture_output=True, timeout=10)
                          self.assertEqual(result.returncode, 2, result.stdout + result.stderr)
                          self.assertFalse(pathfile.exists(), "invalid SDK must not publish paths")
          '''
          import textwrap
          tests = textwrap.dedent(tests)
          tests = ''.join('    ' + line if line.strip() else line for line in tests.splitlines(True))
          p.write_text(source.replace(anchor, '\n' + tests + anchor))
          PY
          git diff --check
      - name: Test the actual generated workflow step
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-path-validation"
          python3 scripts/test-android-acceptance-contract.py -v 2>&1 | tee "$RUNNER_TEMP/sdk-path-validation/tests.log"
          python3 scripts/lint-source.py
          python3 - <<'PY'
          import os, subprocess, yaml
          steps = yaml.safe_load(open('.github/workflows/android-kernelsu-acceptance.yml'))['jobs']['android-kernelsu']['steps']
          source = next(step['run'] for step in steps if step.get('name') == 'Locate Android SDK tools')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', source], check=True)
          PY
      - name: Verify exported SDK commands on a new workflow step
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          command -v avdmanager
          command -v emulator
          command -v adb
          timeout 30 sdkmanager --version
      - name: Store exact validated blobs, without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sdk-path-validation'
          elements = []
          for path in ('.github/workflows/android-kernelsu-acceptance.yml','scripts/test-android-acceptance-contract.py'):
              text = pathlib.Path(path).read_text()
              response = subprocess.run(['gh','api','--method','POST','repos/LIghtJUNction/MagicNet/git/blobs','--input','-'], input=json.dumps({'content':text,'encoding':'utf-8'}), text=True, capture_output=True, check=True)
              blob = json.loads(response.stdout)
              assert blob['sha'] == subprocess.check_output(['git','hash-object',path],text=True).strip()
              mode = subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[0]
              elements.append({'path':path,'sha':blob['sha'],'mode':mode,'type':'blob'})
              (out/pathlib.Path(path).name).write_text(text)
          (out/'blobs.json').write_text(json.dumps(elements,indent=2))
          print(json.dumps(elements,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: android-sdk-path-validation
          path: ${{ runner.temp }}/sdk-path-validation/
          retention-days: 7
          if-no-files-found: error
