name: Install Onboarding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/MagicNet/customize.sh'
      - 'src/MagicNet/lib/magicnet/install_onboarding.sh'
      - 'src/MagicNet/lib/magicnet/onboarding/**'
      - 'src/MagicNet/lib/kamfw'
      - 'src/MagicNet/lib/kamfw-web/**'
      - 'scripts/install-onboarding-test.py'
      - 'scripts/test-onboarding-browser.py'
      - 'scripts/onboarding-browser-fixture.py'
      - 'webui/scripts/test-install-setup.mjs'
      - 'webui/package*.json'
      - '.github/workflows/install-onboarding.yml'
  push:
    branches: [main]
    paths:
      - 'src/MagicNet/customize.sh'
      - 'src/MagicNet/lib/magicnet/install_onboarding.sh'
      - 'src/MagicNet/lib/magicnet/onboarding/**'
      - 'src/MagicNet/lib/kamfw'
      - 'src/MagicNet/lib/kamfw-web/**'
      - 'scripts/install-onboarding-test.py'
      - 'scripts/test-onboarding-browser.py'
      - 'scripts/onboarding-browser-fixture.py'
      - 'webui/scripts/test-install-setup.mjs'
      - 'webui/package*.json'
      - '.github/workflows/install-onboarding.yml'

permissions:
  contents: read

concurrency:
  group: install-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize pinned kamfw only
        run: git submodule update --init --depth 1 src/MagicNet/lib/kamfw
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y busybox-static shellcheck
      - name: Lint install-only shell and browser extension
        run: >-
          shellcheck -s sh -e SC1090,SC1091,SC2015,SC2016,SC2034,SC2059,SC2218,SC2329
          src/MagicNet/lib/magicnet/install_onboarding.sh
          src/MagicNet/lib/magicnet/onboarding/*.sh
          src/MagicNet/lib/kamfw-web/*.sh
      - name: Test real BusyBox HTTP, CGI and legacy kamfw launcher contracts
        timeout-minutes: 3
        run: python3 scripts/install-onboarding-test.py
      - name: Test default browser selection and a single installer entry
        run: python3 scripts/test-onboarding-browser.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize pinned kamfw only
        run: git submodule update --init --depth 1 src/MagicNet/lib/kamfw
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install browser dependencies
        working-directory: webui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y busybox-static fonts-noto-cjk
      - name: Test production page against real BusyBox HTTP and CGI
        working-directory: webui
        timeout-minutes: 5
        run: node scripts/test-install-setup.mjs
