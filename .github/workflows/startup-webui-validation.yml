name: Startup and WebUI validation
on:
  push:
    branches: [fix/startup-evidence-webui-20260917]
    paths:
      - .github/workflows/startup-webui-validation.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision exact lockfile and pinned shell dependencies
        run: |
          git submodule update --init src/MagicNet/lib/kamfw src/MagicNet/.config/sing-box
          npm ci --prefix webui
          tar --exclude=.git -czf /tmp/magicnet-test-deps.tar.gz webui/node_modules src/MagicNet/lib/kamfw src/MagicNet/.config/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: magicnet-test-dependencies
          path: /tmp/magicnet-test-deps.tar.gz
          retention-days: 1
