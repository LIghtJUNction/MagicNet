name: Rewrite Verification Kit

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/rewrite-devkit.yml']

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Fetch locked build dependencies
        run: |
          set -euo pipefail
          cargo fetch --locked
          npm ci --prefix webui
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox-static shellcheck
      - name: Package only public dependencies and executable toolchain
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/verification-kit"
          mkdir -p "$kit/rust" "$kit/cargo" "$kit/bin" "$RUNNER_TEMP/kit-artifacts"
          sysroot="$(rustc --print sysroot)"
          cp -a "$sysroot/bin" "$sysroot/lib" "$kit/rust/"
          cp -a "$HOME/.cargo/registry" "$kit/cargo/registry"
          cp /usr/bin/busybox /usr/bin/shellcheck "$kit/bin/"
          rustc --version > "$kit/versions.txt"
          cargo --version >> "$kit/versions.txt"
          node --version >> "$kit/versions.txt"
          # Do not copy HOME, .git, npm configuration, Cargo credentials,
          # environment files, actions context, or any private runner state.
          tar -czf "$RUNNER_TEMP/kit-artifacts/toolchain.tar.gz" -C "$kit" .
          tar -czf "$RUNNER_TEMP/kit-artifacts/webui-dependencies.tar.gz" -C webui node_modules
          cd "$RUNNER_TEMP/kit-artifacts"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rewrite-verification-kit
          path: ${{ runner.temp }}/kit-artifacts/
          if-no-files-found: error
          retention-days: 3
