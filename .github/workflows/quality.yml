name: Code Quality

on:
  workflow_dispatch:
    inputs:
      force_tests:
        description: Ignore previous test results and run every check
        required: false
        type: boolean
        default: false
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_TEST_FORCE: ${{ inputs.force_tests == true && '1' || '0' }}

jobs:
  ci:
    name: CI infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install workflow test dependency
        run: |
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi

      # Never let cached successes validate the cache or its quality gate.
      - name: Test CI failure propagation and cache invalidation
        run: |
          python3 scripts/test-ci-test-cache.py
          python3 scripts/test-ci-quality.py

      - name: Setup Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Validate quality workflow semantics
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # The shell job owns ShellCheck; this checks Actions expressions and wiring.
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes= .github/workflows/quality.yml

  rust:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # One routing unit test validates the bundled MagicSingBox source config.
      # Initialize only that pinned gitlink instead of downloading every build
      # submodule (especially the much larger sing-box source repository).
      - name: Initialize bundled routing config
        run: git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box

      - name: Restore per-check test results
        uses: ./.github/actions/test-cache
        with:
          mode: restore

      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Fingerprint Rust toolchain
        id: toolchain
        run: |
          rust_hash="$(rustc -vV | sha256sum | cut -d' ' -f1)"
          printf 'rust=%s\n' "$rust_hash" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-quality-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-${{ hashFiles('Cargo.toml', 'crates/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-quality-rust-v2-${{ steps.toolchain.outputs.rust }}-

      - name: Check Rust workspace
        run: bash scripts/quality-gate.sh rust

      - name: Save successful per-check results
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/test-cache
        with:
          mode: save

  shell:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Release-integrity host regressions deliberately walk recursive gitlinks.
      # Use the commit-pinned revisions, but do not remote-refresh moving branches.
      - name: Initialize shell test submodules
        run: git submodule update --init --recursive --depth 1

      # Quality validates the gitlinks recorded by the commit. The build/release
      # workflow owns remote-tracking submodule refreshes, so CI does not fetch
      # every upstream branch twice just to run fixture-based host tests.
      - name: Restore per-check test results
        uses: ./.github/actions/test-cache
        with:
          mode: restore

      - name: Install missing host check dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          command -v shellcheck >/dev/null 2>&1 || packages+=(shellcheck)
          command -v jq >/dev/null 2>&1 || packages+=(jq)
          command -v rg >/dev/null 2>&1 || packages+=(ripgrep)
          command -v curl >/dev/null 2>&1 || packages+=(curl)
          command -v openssl >/dev/null 2>&1 || packages+=(openssl)
          command -v zip >/dev/null 2>&1 || packages+=(zip)
          command -v unzip >/dev/null 2>&1 || packages+=(unzip)
          python3 -c 'import yaml' >/dev/null 2>&1 || packages+=(python3-yaml)
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi

      - name: Check shell code and host regressions
        timeout-minutes: 15
        run: bash scripts/quality-gate.sh shell

      - name: Save successful per-check results
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/test-cache
        with:
          mode: save

  components:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore per-check test results
        uses: ./.github/actions/test-cache
        with:
          mode: restore
      - name: Setup Go
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false
      - name: Cache component Go build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/go-build
          key: components-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('installer/components/**') }}
          restore-keys: |
            components-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Install missing package test dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          command -v unzip >/dev/null 2>&1 || packages+=(unzip)
          python3 -c 'import yaml' >/dev/null 2>&1 || packages+=(python3-yaml)
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Test component packaging and updates
        run: bash scripts/quality-gate.sh components
      - name: Save successful per-check results
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/test-cache
        with:
          mode: save

  webui:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore per-check test results
        uses: ./.github/actions/test-cache
        with:
          mode: restore

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Probe exact WebUI test results
        id: webui_cache
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/ci-test-cache.py --lookup-only \
              webui webui-check -- bash -c 'cd webui && npm run check'; then
            echo 'check_hit=true' >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 1 ] || exit "$rc"
            echo 'check_hit=false' >> "$GITHUB_OUTPUT"
          fi
          if python3 scripts/ci-test-cache.py --lookup-only \
              webui webui-browser -- bash -c 'cd webui && npm run test:ui'; then
            echo 'browser_hit=true' >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 1 ] || exit "$rc"
            echo 'browser_hit=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache npm package downloads
        if: ${{ steps.webui_cache.outputs.check_hit != 'true' || steps.webui_cache.outputs.browser_hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-quality-npm-v1-node24-${{ hashFiles('webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-npm-v1-node24-

      - name: Install locked WebUI dependencies
        if: ${{ steps.webui_cache.outputs.check_hit != 'true' || steps.webui_cache.outputs.browser_hit != 'true' }}
        working-directory: webui
        run: npm ci

      - name: Test, typecheck Vue components, and build
        run: bash scripts/quality-gate.sh webui-check

      - name: Cache Playwright browsers
        if: ${{ steps.webui_cache.outputs.browser_hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webui/package-lock.json') }}

      - name: Install browser test dependencies
        if: ${{ steps.webui_cache.outputs.browser_hit != 'true' }}
        working-directory: webui
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Verify mobile layouts and interactions
        timeout-minutes: 10
        run: bash scripts/quality-gate.sh webui-browser

      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: webui/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save successful per-check results
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/test-cache
        with:
          mode: save

  quality-gate:
    name: CI Quality Gate
    if: ${{ always() }}
    needs: [ci, rust, shell, components, webui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # No checkout, cache or network: upstream failure must still reach this gate.
      - name: Require every quality job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          needs = json.loads(os.environ["NEEDS_JSON"])
          if not isinstance(needs, dict) or not needs:
              raise SystemExit("Missing quality job results")
          failed = []
          lines = ["## CI quality gate", "", "| Job | Result |", "| --- | --- |"]
          for name, job in sorted(needs.items()):
              result = job.get("result") if isinstance(job, dict) else None
              lines.append(f"| {name} | {result} |")
              if result != "success":
                  failed.append(f"{name}={result}")
          summary = "\n".join(lines) + "\n"
          print(summary)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
                  stream.write(summary)
          if failed:
              raise SystemExit("Quality gate failed: " + ", ".join(failed))
          PY
