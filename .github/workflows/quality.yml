name: Code Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Refresh build submodules
        run: bash scripts/update-submodules.sh

      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Fingerprint Rust toolchain
        id: toolchain
        run: |
          rust_hash="$(rustc -vV | sha256sum | cut -d' ' -f1)"
          printf 'rust=%s\n' "$rust_hash" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-quality-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-${{ hashFiles('Cargo.toml', 'crates/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-quality-rust-v2-${{ steps.toolchain.outputs.rust }}-

      - name: Check, lint and test Rust workspace
        run: bash scripts/quality-check.sh rust

  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Refresh build submodules
        run: bash scripts/update-submodules.sh

      - name: Install host check dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq python3-yaml ripgrep

      - name: Lint shell and run host regressions
        timeout-minutes: 10
        run: bash scripts/quality-check.sh shell

  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Test, typecheck, build and verify browser interactions
        timeout-minutes: 20
        run: bash scripts/quality-check.sh webui

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Test component packaging and incremental installation
        run: bash scripts/quality-check.sh components
      - name: Cross-compile Android bootstrap
        working-directory: tools/components
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/magicnet-components" .
