name: Code Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-quality-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-rust-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Bash tooling
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find hooks/pre-build hooks/post-build hooks/lib -type f -name '*.sh' -print
            find scripts -maxdepth 1 -type f -name '*.sh' -print
            printf '%s\n' kam.sh
          )
          # These exclusions match known baseline patterns in the existing
          # fixture-heavy shell suite; all other findings remain blocking.
          shellcheck -s bash \
            -e SC1091,SC2015,SC2034,SC2059,SC2218,SC2317,SC2329 \
            "${files[@]}"

      - name: Lint device shell
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find src/MagicNet -maxdepth 1 -type f -name '*.sh' -print
            find src/MagicNet/system/bin -type f -print 2>/dev/null || true
            printf '%s\n' src/MagicNet/lib/magicnet.sh
          )
          shellcheck -s sh \
            -e SC1090,SC1091,SC2015,SC2034,SC2059,SC2218,SC2329 \
            "${files[@]}"
