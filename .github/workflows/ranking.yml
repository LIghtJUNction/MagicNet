name: Update Supporter Ranking

on:
  workflow_dispatch:
    inputs:
      name:
        description: Public supporter name shown in the ranking
        required: true
        type: string
      amount:
        description: Donation amount, number only
        required: true
        type: string
      currency:
        description: Currency code
        required: false
        type: choice
        default: CNY
        options:
          - CNY
          - USD
          - HKD
          - TWD
          - JPY
          - EUR
      message:
        description: Optional public note
        required: false
        type: string
      date:
        description: Donation date, YYYY-MM-DD. Empty means today.
        required: false
        type: string
      supporter-id:
        description: Optional stable id. Leave empty to auto-generate.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: magicnet-ranking-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update ranking data
        env:
          INPUT_NAME: ${{ inputs.name }}
          INPUT_AMOUNT: ${{ inputs.amount }}
          INPUT_CURRENCY: ${{ inputs.currency }}
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SUPPORTER_ID: ${{ inputs['supporter-id'] }}
        run: node .github/scripts/update-ranking.mjs

      - name: Validate ranking JSON
        run: jq empty src/MagicNet/webroot/ranking.json

      - name: Commit ranking update
        run: |
          set -euo pipefail
          if git diff --quiet -- src/MagicNet/webroot/ranking.json; then
            echo "No ranking changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MagicNet/webroot/ranking.json
          git commit -m "chore: update supporter ranking"
          git push
