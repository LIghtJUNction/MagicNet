name: Proc descriptor audit
on:
  push:
    branches: [audit/machine-protocol-20260916]
permissions:
  contents: write
concurrency:
  group: machine-protocol-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact regression on unchanged production code
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proc-evidence"
          cp .audit/proc_fd_inheritance.rs "$RUNNER_TEMP/proc-evidence/regression.rs"
          git checkout --detach 3d1bb234e945af7665c58a1392b6170f97ddac54
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
          cp "$RUNNER_TEMP/proc-evidence/regression.rs" crates/magicnet-cli/tests/internal/proc_fd_inheritance.rs
          printf '\n#[cfg(test)]\n#[path = "../tests/internal/proc_fd_inheritance.rs"]\nmod proc_fd_inheritance_tests;\n' >> crates/magicnet-cli/src/utils.rs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - name: Prove the old implementation fails for the observed ownership defect
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --bin magicnet-cli utils::proc_fd_inheritance_tests::blocked_proc_worker_releases_unrelated_descriptors -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/proc-evidence/before.log"
          result=${PIPESTATUS[0]}
          set -e
          [ "$result" -ne 0 ]
          grep -F 'proc worker retained an executable writer' "$RUNNER_TEMP/proc-evidence/before.log"
      - name: Share existing child descriptor cleanup with the proc reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/magicnet-cli/src/process.rs')
          u=Path('crates/magicnet-cli/src/utils.rs')
          s=p.read_text()
          a=s.index('#[cfg(any(target_os = "android", target_os = "linux"))]\nunsafe fn watchdog_close_inherited_fds')
          b=s.index('#[cfg(any(target_os = "android", target_os = "linux"))]\nunsafe fn watchdog_pidfd_open',a)
          helper=s[a:b].replace('unsafe fn watchdog_close_inherited_fds','pub(crate) unsafe fn close_inherited_fds_except')
          helper=helper.replace('let closed = close_range(0, low.saturating_sub(1) as libc::c_uint) == 0', 'let closed = (low == 0 || close_range(0, (low - 1) as libc::c_uint) == 0)')
          s=s[:a]+s[b:]
          assert s.count('watchdog_close_inherited_fds(control[0], worker_pid_pipe[0]);') == 1
          p.write_text(s.replace('watchdog_close_inherited_fds(control[0], worker_pid_pipe[0]);','crate::utils::close_inherited_fds_except(control[0], worker_pid_pipe[0]);'))
          s=u.read_text()
          needle='fn close_raw_fd(fd: RawFd) {'
          assert s.count(needle)==1
          s=s.replace(needle,'// Called only in fork children that will not exec. CLOEXEC alone cannot\n// release inherited pipe writers, executable write handles or file locks.\n'+helper+needle)
          needle='    if worker_pid == 0 {\n        close_raw_fd(pipe_fds[0]);'
          assert s.count(needle)==1
          s=s.replace(needle,'    if worker_pid == 0 {\n        // Keep only this worker\'s result pipe before opening a potentially\n        // blocking source. No unrelated parent descriptor belongs here.\n        unsafe { close_inherited_fds_except(pipe_fds[1], pipe_fds[1]) };')
          u.write_text(s)
          PY
          cargo fmt --all
          git add -- crates/magicnet-cli/src/process.rs crates/magicnet-cli/src/utils.rs crates/magicnet-cli/tests/internal/proc_fd_inheritance.rs
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/proc-evidence/final.patch"
      - name: Verify exact regression and existing executable probe repeatedly
        run: |
          set -euo pipefail
          cargo test --locked --bin magicnet-cli utils::proc_fd_inheritance_tests::blocked_proc_worker_releases_unrelated_descriptors -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/proc-evidence/after.log"
          for round in $(seq 1 10); do
            cargo test --locked --bin magicnet-cli diagnostics::mode_aware_tests::ebpf_dataplane_does_not_require_magicnet0 -- --exact
          done 2>&1 | tee "$RUNNER_TEMP/proc-evidence/probe-repeat.log"
      - name: Full Rust suite, Clippy and Android cross-check
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/proc-evidence/rust-test.log"
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/proc-evidence/clippy.log"
          cargo check --locked --workspace --all-targets --all-features --target aarch64-linux-android 2>&1 | tee "$RUNNER_TEMP/proc-evidence/android-check.log"
      - name: Prepare only tested product files without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          parent='3d1bb234e945af7665c58a1392b6170f97ddac54'
          expected={'crates/magicnet-cli/src/process.rs','crates/magicnet-cli/src/utils.rs','crates/magicnet-cli/tests/internal/proc_fd_inheritance.rs'}
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(files)==expected, files
          def api(endpoint, body=None):
              args=['gh','api',f'repos/LIghtJUNction/MagicNet/git/{endpoint}']
              if body is None: return json.loads(subprocess.check_output(args,text=True))
              return json.loads(subprocess.check_output(args+['--method','POST','--input','-'],input=json.dumps(body),text=True))
          base=api('commits/'+parent)
          tree=api('trees',{'base_tree':base['tree']['sha'],'tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in files]})
          commit=api('commits',{'message':'fix(runtime): release unrelated descriptors in forked proc workers','tree':tree['sha'],'parents':[parent]})
          result={'sha':commit['sha'],'tree':tree['sha'],'parent':parent,'files':files}
          pathlib.Path(os.environ['RUNNER_TEMP'],'proc-evidence/prepared-commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: proc-descriptor-evidence
          path: ${{ runner.temp }}/proc-evidence/
          if-no-files-found: error
          retention-days: 7
