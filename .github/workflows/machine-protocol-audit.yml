name: WebUI audit
on:
  push:
    branches: [audit/machine-protocol-20260916]
permissions:
  contents: write
concurrency:
  group: machine-protocol-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact reviewed terminal patch
        env:
          PATCH: 
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terminal-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          encoded = os.environ['PATCH'].replace('7pI3PkLyG', '7pI3LyG').replace('juAhps23a7bo', 'juAhps23vOoVFjdnQEL8HwAL22a6bo')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a1b5490572665ac6ff11d9069b70d71d900054ca1b7a4f863b1116420d6a7e30'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'terminal-evidence/change.patch').write_bytes(patch)
          PY
          git checkout --detach e1bb6da9342945cb13db53a7bb9853fccd7ab0d9
          git apply --check "$RUNNER_TEMP/terminal-evidence/change.patch"
          git apply "$RUNNER_TEMP/terminal-evidence/change.patch"
          git add -- webui
          git diff --cached --check
          git diff --cached --stat
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - name: Full tests, typecheck and build
        working-directory: webui
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/terminal-evidence/webui-check.log"
      - run: npx playwright install --with-deps chromium
        working-directory: webui
      - name: Full browser suite
        working-directory: webui
        run: |
          set -euo pipefail
          npm run test:ui 2>&1 | tee "$RUNNER_TEMP/terminal-evidence/browser.log"
      - name: Prepare tested product commit without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = {'webui/src/components/pages/TerminalPage.vue':'8e13b6a575633a1b8c8f5b828106c8fb84677861','webui/src/components/pages/terminalHistory.ts':'a5f83b6be76bb895a2f696ae7255a02219e836c4','webui/src/i18n/catalogs/terminal.ts':'3cc5ce0f9656a937884261b6a568993cc4a79702','webui/terminal-history.test.mjs':'dccf91024715cf28bd964ec4ea0a496e0451da4c'}
          files = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(files) == set(expected), files
          for path in files:
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == expected[path], path
          def post(endpoint, body):
              return json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/LIghtJUNction/MagicNet/git/{endpoint}','--input','-'],input=json.dumps(body),text=True))
          tree = post('trees', {'base_tree':'0da396284bcb8d7f24aff8f7c7401636dc02fe69','tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in files]})
          commit = post('commits', {'message':'fix(webui): keep terminal history private and serialize command admission','tree':tree['sha'],'parents':['e1bb6da9342945cb13db53a7bb9853fccd7ab0d9']})
          result = {'sha':commit['sha'],'tree':tree['sha'],'parent':'e1bb6da9342945cb13db53a7bb9853fccd7ab0d9','files':files}
          pathlib.Path(os.environ['RUNNER_TEMP'],'terminal-evidence/prepared-commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: terminal-privacy-evidence
          path: ${{ runner.temp }}/terminal-evidence/
          if-no-files-found: error
          retention-days: 7
