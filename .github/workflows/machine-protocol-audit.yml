name: Machine protocol audit
on:
  push:
    branches: [audit/machine-protocol-20260916]
permissions:
  contents: write
concurrency:
  group: machine-protocol-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed patch to immutable production baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/machine-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, re, subprocess
          source = subprocess.check_output(['git','show','fd9715f9dc7ef0ab08091241e8920014a085f3e2:.github/workflows/machine-protocol-audit.yml'],text=True)
          encoded = re.search(r'^          PATCH: (\S+)$', source, re.M).group(1)
          encoded = encoded.replace('TFYlnMB4', 'TFlnMB4').replace('w9c//eX3', 'w3c//eX3').replace('Zuz/+Nf/', 'Zuz/+9Nf/')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '20bd59edc40e0fabf93fcc6cd0df5c4d4dd80cf8ca3aaf0347f816a304dd0d14'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'machine-evidence/change.patch').write_bytes(patch)
          PY
          git checkout --detach ef0c6e454404c2776530a8e1c57b56e607b6d2f2
          git apply --check "$RUNNER_TEMP/machine-evidence/change.patch"
          git apply "$RUNNER_TEMP/machine-evidence/change.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('webui/issue-reporter-dialog.test.mjs')
          text = p.read_text()
          for command in ['sub status', 'transparent status']:
              old = 'runCli\\("' + command + '"'
              assert text.count(old) == 1
              text = text.replace(old, 'runCli\\("--json ' + command + '"')
          p.write_text(text)
          PY
          git add -- docs/machine-interface.md webui
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/machine-evidence/final.patch"
          echo "baa0859dddeacb56784d70869b4a3f75ef22446c809708240fdd804dcc164e5f  $RUNNER_TEMP/machine-evidence/final.patch" | sha256sum --check
          git diff --cached --stat
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - name: Uncached WebUI tests, typecheck and build
        working-directory: webui
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/machine-evidence/webui-check.log"
      - name: Install browser
        working-directory: webui
        run: npx playwright install --with-deps chromium
      - name: Full browser suite
        working-directory: webui
        run: |
          set -euo pipefail
          npm run test:ui 2>&1 | tee "$RUNNER_TEMP/machine-evidence/browser.log"
      - name: Prepare reviewed Git objects, without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = {'docs/machine-interface.md','webui/issue-reporter-dialog.test.mjs','webui/machine-refresh-concurrency.test.mjs','webui/machine-status.test.mjs','webui/src/components/pages/DnsToolsCard.vue','webui/src/components/pages/NetworkPolicyCard.vue','webui/src/composables/issueReporter.ts','webui/src/composables/machineStatus.ts','webui/src/composables/parsers.ts','webui/src/composables/useMagicNet.ts'}
          files = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert set(files) == expected, files
          def post(endpoint, body):
              return json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/LIghtJUNction/MagicNet/git/{endpoint}','--input','-'],input=json.dumps(body),text=True))
          tree = post('trees', {'base_tree':'a42c630f678b1a9cac487ff3985f9883f0f39c3c','tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in files]})
          commit = post('commits', {'message':'fix(webui): reject ambiguous machine status and consolidate DNS/network reads','tree':tree['sha'],'parents':['ef0c6e454404c2776530a8e1c57b56e607b6d2f2']})
          result = {'sha':commit['sha'],'tree':tree['sha'],'parent':'ef0c6e454404c2776530a8e1c57b56e607b6d2f2','files':files}
          pathlib.Path(os.environ['RUNNER_TEMP'],'machine-evidence/prepared-commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: machine-protocol-evidence
          path: ${{ runner.temp }}/machine-evidence/
          if-no-files-found: error
          retention-days: 7
