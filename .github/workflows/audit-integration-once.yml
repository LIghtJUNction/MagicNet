name: Audit PR integration

on:
  push:
    branches: [audit/pr-integration-20260916]
    paths: [.github/workflows/audit-integration-once.yml]

permissions:
  contents: read

jobs:
  diagnose-subscription:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0f79854d8d67e9bfa81bdcabe58c783680cdcd7d
          persist-credentials: false
      - name: Trace the isolated fixture failure
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['bash', '-x', 'scripts/test-subscription-fetch-policy.sh'],
                                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  timeout=90, check=False)
          print('exit_code=', result.returncode)
          print('\n'.join(result.stdout.splitlines()[-170:]))
      - name: Inventory machine-status WebUI callers
        shell: python
        run: |
          from pathlib import Path
          import re
          pattern = re.compile(r'machineInterfaceUnavailable|parse(?:Dns|Network|Wifi|Transparent|Sub)|(?:dns|network|wifi|transparent|sub) status')
          for path in Path('webui').rglob('*'):
              if path.is_file() and path.suffix in ('.ts', '.vue', '.mjs'):
                  hits = [(n, line) for n, line in enumerate(path.read_text().splitlines(), 1) if pattern.search(line)]
                  if hits:
                      print(path)
                      for n, line in hits[:12]:
                          print(f'  {n}: {line[:220]}')
