name: Audit PR integration

on:
  push:
    branches: [audit/pr-integration-20260916]
    paths: [.github/workflows/audit-integration-once.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show only the terminal failure context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['gh', 'run', 'view', '35022627728', '--repo', 'LIghtJUNction/MagicNet', '--log-failed'], capture_output=True, text=True, timeout=90)
          print('log_fetch_exit=', result.returncode)
          print('\n'.join(result.stdout.splitlines()[-110:]))
          print(result.stderr)
      - name: Compare overlapping runtime changes against current main
        shell: python
        run: |
          import subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          for number in (285, 286):
              run('git', 'fetch', '--no-tags', 'origin', f'refs/pull/{number}/head')
              head = run('git', 'rev-parse', 'FETCH_HEAD')
              print(f'PR {number} HEAD {head}', flush=True)
              print(run('git', 'diff', '--stat', f'origin/main...{head}'), flush=True)
