name: Prepare v1.5.5 patch
on:
  push:
    branches: [release/v1.5.5-20260916]
    paths: [.github/workflows/prepare-patch-release.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare synchronized patch metadata and uncached release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'd30bc9f50a19d0adbb24516331faf22dc59a16f3'
          for name in ('kam.toml', 'src/MagicNet/module.prop', 'update.json'):
              path = Path(name)
              source = path.read_text()
              assert source.count('v1.5.4') == 1 and source.count('1789322930995') == 1
              path.write_text(source.replace('v1.5.4', 'v1.5.5').replace('1789322930995', '1789322930996'))
          Path('.github/release-request').write_text('v1.5.5\n')
          path = Path('.github/workflows/exec.yml')
          source = path.read_text()
          assert source.count('        id: release_quality\n') == 1
          path.write_text(source.replace('        id: release_quality\n', '        id: release_quality\n        env:\n          CI_TEST_FORCE: "1"\n'))
          path = Path('scripts/test-release-gates.py')
          source = path.read_text()
          old = "        self.assertFalse(gate.get('continue-on-error', False))"
          assert source.count(old) == 1
          path.write_text(source.replace(old, old + "\n        self.assertEqual(gate.get('env', {}).get('CI_TEST_FORCE'), '1')"))
          path = Path('CHANGELOG.md')
          source = path.read_text()
          assert not source.startswith('# v1.5.5')
          path.write_text('''# v1.5.5 (2026-09-16)

          - Recover stalled installer component downloads and enforce the intended
            per-entry ZIP compression level without weakening integrity checks.
          - Bound runtime probes, suspend inactive WebUI polling, and distinguish
            observed process state from actual service readiness.
          - Complete bundled WebUI machine-status migration for service,
            subscription and Wi-Fi; reject stale owners and late refresh results.
          - Include MagicNetRules `rules-20260916-c802d68ca104e3ce`, locked to recipe
            `756b843a46e2c2c21f0d5f3013a5384b3b3ca2de` and verified manifest contents.
          - Force every shared release quality check to run on the release checkout;
            dependency/build caches remain available, but previous passing test
            records cannot substitute for this release's tests.

          Known limits: this patch does not claim physical-device Google Play/GMS,
          carrier handover, RSS/latency or the staged new TUN stack migration have
          been accepted. Issues #253, #254, #261 and #281 remain separately tracked.

          '''.replace('\n          ', '\n') + source)
          PY
          git diff --check
      - name: Run release and cache regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patch-validation"
          python3 scripts/test-release-workflow.py 2>&1 | tee "$RUNNER_TEMP/patch-validation/release-workflow.log"
          python3 scripts/test-release-cache.py 2>&1 | tee "$RUNNER_TEMP/patch-validation/release-cache.log"
          python3 scripts/test-release-gates.py 2>&1 | tee "$RUNNER_TEMP/patch-validation/release-gates.log"
          python3 scripts/test-ci-test-cache.py 2>&1 | tee "$RUNNER_TEMP/patch-validation/test-cache.log"
          python3 scripts/test-ci-quality.py 2>&1 | tee "$RUNNER_TEMP/patch-validation/ci-quality.log"
          python3 scripts/lint-source.py
      - name: Commit only release inputs to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = release/v1.5.5-20260916
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-patch-release.yml
          git add kam.toml src/MagicNet/module.prop update.json .github/release-request .github/workflows/exec.yml scripts/test-release-gates.py CHANGELOG.md
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/patch-validation/release.diff"
          git commit -m 'chore(release): prepare v1.5.5 with freshly executed release checks'
          gh auth setup-git
          git push origin HEAD:refs/heads/release/v1.5.5-20260916
          git rev-parse HEAD > "$RUNNER_TEMP/patch-validation/commit.txt"
          git ls-tree HEAD > "$RUNNER_TEMP/patch-validation/tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/patch-validation/source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: patch-release-preparation
          path: ${{ runner.temp }}/patch-validation/
          retention-days: 7
          if-no-files-found: error
