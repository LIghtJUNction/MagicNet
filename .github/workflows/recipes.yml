name: Recipe checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - recipes/**
      - scripts/**
      - .github/**
      - .gitmodules
      - generated/magicnet-android
      - update.json
      - README.md
      - README.en.md
      - README.ru.md
  pull_request:
    paths:
      - recipes/**
      - scripts/**
      - .github/**
      - .gitmodules
      - generated/magicnet-android
      - update.json
      - README.md
      - README.en.md
      - README.ru.md
  merge_group:
permissions:
  contents: read
concurrency:
  group: magicnet-recipes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/recipe-check
