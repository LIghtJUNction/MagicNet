name: Recipe checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - recipes/**
      - scripts/**
      - .github/**
      - .gitmodules
      - generated/magicnet-android
      - update.json
permissions:
  contents: read
concurrency:
  group: magicnet-recipes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/recipe-check
