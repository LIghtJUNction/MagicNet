name: Recipe checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - recipes/**
      - scripts/**
      - .github/**
      - .gitmodules
      - generated/magicnet-android
      - update.json
      - README.md
      - README.en.md
      - README.ru.md
  pull_request:
    paths:
      - recipes/**
      - scripts/**
      - .github/**
      - .gitmodules
      - generated/magicnet-android
      - update.json
      - README.md
      - README.en.md
      - README.ru.md
  merge_group:
permissions:
  contents: read
concurrency:
  group: magicnet-recipes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/recipe-check

  retire_legacy_workflows:
    name: Retire obsolete workflow registrations
    needs: check
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'LIghtJUNction/MagicNet' &&
          github.event.head_commit.message == 'chore(ci): retire obsolete workflow registrations' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Disable reviewed retired workflows and verify their state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.request

          repository = 'LIghtJUNction/MagicNet'
          retired = {356072628: '.github/workflows/browser-setup.yml',
           356075163: '.github/workflows/installer-setup.yml',
           357230407: '.github/workflows/dev-source-snapshot.yml',
           357247134: '.github/workflows/apply-smart-updates.yml',
           357251787: '.github/workflows/update-development.yml',
           357568573: '.github/workflows/dns-regression.yml',
           357711144: '.github/workflows/network-integration-check.yml',
           358072037: '.github/workflows/issue-recovery-validation.yml',
           358874401: '.github/workflows/zz-controller-refactor-temp.yml',
           358878301: '.github/workflows/zz-runtime-endpoint-cleanup-temp.yml',
           358886145: '.github/workflows/zz-api-helper-load-temp.yml',
           358890287: '.github/workflows/zz-debug-sub-fetch-temp.yml',
           359051772: '.github/workflows/temp-collapse-mcp-patch.yml',
           359054861: '.github/workflows/temp-dead-rust-cleanup.yml',
           359077898: '.github/workflows/audit-config-pin-once.yml',
           359079593: '.github/workflows/runtime-resource-bootstrap.yml',
           359081513: '.github/workflows/audit-integration-once.yml',
           359124164: '.github/workflows/pr286-review-audit.yml',
           359334499: '.github/workflows/audit-review-20260916.yml',
           359339881: '.github/workflows/audit-72h.yml',
           359341743: '.github/workflows/audit-pr-sources.yml',
           359345818: '.github/workflows/audit-integrate.yml',
           359350441: '.github/workflows/machine-protocol-audit.yml',
           359351177: '.github/workflows/audit-native-policy.yml',
           359354860: '.github/workflows/audit-final-delta.yml',
           359360675: '.github/workflows/audit-publish-native.yml',
           359419320: '.github/workflows/fd-cleanup-audit.yml',
           359433238: '.github/workflows/repository-audit.yml',
           359454731: '.github/workflows/runtime-audit-final.yml',
           359482171: '.github/workflows/runtime-audit.yml',
           359613286: '.github/workflows/patch-readiness-audit.yml',
           359670008: '.github/workflows/network-acceptance-audit.yml',
           359725292: '.github/workflows/prepare-patch-release.yml',
           359734809: '.github/workflows/network-acceptance-retry.yml',
           359745489: '.github/workflows/integrate-release.yml',
           359752102: '.github/workflows/verify-avd-sdk-path.yml',
           359753560: '.github/workflows/retry-sdk-bootstrap.yml',
           359756365: '.github/workflows/check-v155-release.yml',
           359769513: '.github/workflows/inspect-avd-result.yml',
           359780585: '.github/workflows/verify-release-delivery.yml',
           359807213: '.github/workflows/play-network-audit.yml',
           359819732: '.github/workflows/local-audit-tools.yml',
           359840913: '.github/workflows/import-reviewed-patch.yml',
           359840952: '.github/workflows/apply-reviewed-play-patch.yml',
           359842837: '.github/workflows/memory-profile.yml',
           359844391: '.github/workflows/play-patch-acceptance-once.yml',
           359859696: '.github/workflows/avd-stock-identity-once.yml',
           359868743: '.github/workflows/apply-owned-network.yml',
           359873513: '.github/workflows/owned-integration-source.yml',
           359889774: '.github/workflows/network-final-review.yml',
           359905029: '.github/workflows/merge-nat-probe.yml',
           359912140: '.github/workflows/network-boundaries.yml',
           359914011: '.github/workflows/capture-build-failure.yml',
           359915678: '.github/workflows/reproduce-package-lifecycle.yml',
           359931890: '.github/workflows/fixture-model-replay.yml',
           359960294: '.github/workflows/verify-stop-rollback.yml',
           359965119: '.github/workflows/play-startup-audit.yml',
           360201784: '.github/workflows/release-preflight-audit.yml',
           360202012: '.github/workflows/release-candidate-audit.yml',
           360266425: '.github/workflows/verify-v156-public-delivery.yml',
           360273913: '.github/workflows/webui-recovery-workspace.yml',
           360285726: '.github/workflows/startup-webui-source-audit.yml',
           360290333: '.github/workflows/component-parallel-audit.yml',
           360293943: '.github/workflows/playstore-avd-audit.yml',
           360294568: '.github/workflows/startup-webui-validation.yml',
           360296042: '.github/workflows/runtime-audit-workspace.yml',
           360298516: '.github/workflows/runtime-workbench.yml',
           360403333: '.github/workflows/pr314-parallel-components.yml',
           360406223: '.github/workflows/pr314-parallel-singleflight.yml',
           363975556: '.github/workflows/config-integration-repair.yml',
           363996304: '.github/workflows/finalize-v1.5.13.yml',
           364167822: '.github/workflows/offline-review-bootstrap.yml',
           364218283: '.github/workflows/review-owner-fix.yml',
           364262913: '.github/workflows/subscription-state-review.yml',
           364304963: '.github/workflows/repair-346-fixture.yml',
           364310411: '.github/workflows/review-integration-snapshot.yml',
           364326279: '.github/workflows/stage-android-integration.yml',
           364349679: '.github/workflows/tailscale-review.yml',
           364353914: '.github/workflows/proxylink-source-inspection.yml',
           364397559: '.github/workflows/tailscale-ci-diagnostics.yml',
           364424488: '.github/workflows/tailscale-ci-review.yml',
           367550306: '.github/workflows/source-snapshot.yml',
           367553494: '.github/workflows/rewrite-devkit.yml',
           367602986: '.github/workflows/rewrite.yml',
           367691922: '.github/workflows/rewrite-materialize.yml',
           369122332: '.github/workflows/maintenance-snapshot.yml',
           369128434: '.github/workflows/maintenance-kernel-build.yml',
           369140090: '.github/workflows/maintenance-stage.yml',
           369478618: '.github/workflows/apply-continuation.yml',
           371215448: '.github/workflows/apply-android-sed-fix.yml',
           376837265: '.github/workflows/pr368-preflight.yml',
           378109957: '.github/workflows/routing-maintenance-20261008.yml',
           417247162: '.github/workflows/issue436-evidence.yml'}
          if os.environ["GITHUB_REPOSITORY"] != repository:
              raise SystemExit("Unexpected repository")
          if os.environ["GITHUB_EVENT_NAME"] != "push" or os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Cleanup requires a main push")

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(path, method="GET"):
              req = urllib.request.Request(api + path, method=method, headers=headers,
                                           data=b"" if method == "PUT" else None)
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 204:
                      return json.load(response)

          sha = os.environ["GITHUB_SHA"]
          metadata = request("")
          if metadata["full_name"] != repository or metadata["default_branch"] != "main":
              raise SystemExit("Repository identity or default branch changed")
          if request("/git/ref/heads/main")["object"]["sha"] != sha:
              raise SystemExit("Main changed; review the cleanup again")
          commit = request("/git/commits/" + sha)
          tree = request("/git/trees/" + commit["tree"]["sha"] + "?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("Cannot validate an incomplete repository tree")
          paths = {entry["path"] for entry in tree["tree"]}

          # Validate the complete reviewed list before changing any workflow state.
          for workflow_id, path in retired.items():
              if path in paths:
                  raise SystemExit(f"Refusing to disable a current workflow: {path}")
              workflow = request(f"/actions/workflows/{workflow_id}")
              if workflow["id"] != workflow_id or workflow["path"] != path:
                  raise SystemExit(f"Workflow identity changed: {workflow_id}")
              if workflow["state"] not in {"active", "disabled_manually"}:
                  raise SystemExit(f"Unexpected workflow state: {workflow_id}")
          if request("/git/ref/heads/main")["object"]["sha"] != sha:
              raise SystemExit("Main changed during validation; no cleanup performed")

          rows = []
          for workflow_id, path in retired.items():
              request(f"/actions/workflows/{workflow_id}/disable", "PUT")
              workflow = request(f"/actions/workflows/{workflow_id}")
              if workflow["state"] != "disabled_manually":
                  raise SystemExit(f"Workflow was not disabled: {workflow_id}")
              print(f"Disabled {workflow_id}: {path}")
              rows.append(f"| {workflow_id} | `{path}` | disabled_manually |")
              time.sleep(1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Retired workflow registrations\n\n")
              summary.write("| ID | Path | State |\n| --- | --- | --- |\n")
              summary.write("\n".join(rows) + "\n\nHistorical runs and artifacts are retained.\n")
          PYTHON
