name: Stage build fixture repair
on:
  push:
    branches: [fix/346-build-curl-fixture]
    paths: [.github/workflows/repair-346-fixture.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Extract the outdated inline fixture without touching production code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          path = pathlib.Path('scripts/fake-magisk-smoke.sh')
          expected = 'bf19c917d5cf0b4e3975e6be3d89eec3a8f01d2a'
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == expected, 'smoke changed; re-review before applying'
          text = path.read_text()
          start = text.index("# shellcheck disable=SC2016\nwrite_mock curl '\n")
          end = text.index("# shellcheck disable=SC2016\nwrite_mock getent '", start)
          text = text[:start] + 'write_mock curl "$(cat "$ROOT/scripts/fixtures/fake-magisk-curl.sh")"\n' + text[end:]
          anchor = 'need env\n\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, 'need env\nneed timeout\n\npython3 "$ROOT/scripts/test-fake-magisk-curl.py" -v\n\n', 1)
          path.write_text(text)
          PY
          bash -n scripts/fake-magisk-smoke.sh scripts/fixtures/fake-magisk-curl.sh
          python3 scripts/test-fake-magisk-curl.py -v
          git diff --check
      - name: Commit only the reviewed harness change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- scripts/fake-magisk-smoke.sh
          git commit -m 'fix(ci): supply HTTP metadata to hardened subscription smoke'
          git push origin HEAD:fix/346-build-curl-fixture
          git archive --format=tar -o "$RUNNER_TEMP/magicnet-source.tar" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-fixture-reviewed-source
          path: ${{ runner.temp }}/magicnet-source.tar
          if-no-files-found: error
          retention-days: 3
