name: Tailscale lifecycle review
on:
  push:
    branches: [fix/tailscale-lifecycle-20260922]
    paths: [.github/workflows/tailscale-review.yml, .github/tailscale-review.py]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/tailscale-lifecycle-20260922
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Apply reviewed patch when present
        id: patch
        if: ${{ hashFiles('.github/tailscale-review.py') != '' }}
        run: |
          echo 'applied=true' >> "$GITHUB_OUTPUT"
          python3 .github/tailscale-review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- crates webui docs .github/tailscale-review.py .github/tailscale-patch
          git diff --cached --quiet || git commit -m 'fix(tailscale): reversible disable and explicit local logout'
          git push origin HEAD:fix/tailscale-lifecycle-20260922
      - name: Rust lifecycle regression tests
        if: ${{ !cancelled() && steps.patch.outputs.applied == 'true' }}
        run: cargo test --package magicnet-cli tailscale_control --locked -- --nocapture
      - name: WebUI tests, types, and production build
        if: ${{ !cancelled() && steps.patch.outputs.applied == 'true' }}
        working-directory: webui
        run: npm ci && npm run check
      - name: Browser lifecycle and visual regression
        if: ${{ !cancelled() && steps.patch.outputs.applied == 'true' }}
        working-directory: webui
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui -- e2e/tailscale.spec.mjs
      - name: Export tracked source
        if: ${{ !cancelled() }}
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/magicnet-source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: magicnet-tailscale-source
          path: ${{ runner.temp }}/magicnet-source.tar.gz
          retention-days: 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.patch.outputs.applied == 'true' }}
        with:
          name: tailscale-visual-evidence
          path: webui/test-results/
          retention-days: 3
          if-no-files-found: warn
