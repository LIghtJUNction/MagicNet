name: Verify Network Cleanup Boundaries
on:
  push:
    branches: [audit/network-boundaries-20260916]
    paths: [.github/workflows/network-boundaries.yml, .github/network-boundaries.patch]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply exactly the reviewed three-file patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin cdab774c2386e809cf2675ac6ebbde13d5a205dd
          git worktree add --detach "$RUNNER_TEMP/candidate" cdab774c2386e809cf2675ac6ebbde13d5a205dd
          cd "$RUNNER_TEMP/candidate"
          git apply --index "$GITHUB_WORKSPACE/.github/network-boundaries.patch"
          git diff --cached --check
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
      - name: Test route ownership, both-family reads and actual Linux rule deletion
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          command -v jq
          command -v ip
          command -v busybox
          bash scripts/test-kernel-route-lifecycle.sh
          bash scripts/test-hotspot-routing.sh
          bash scripts/test-app-routing-policy.sh
          sh scripts/test-startup-network-safety.sh
          bash scripts/test-dns-leak-guard-timeout.sh
          python3 scripts/test-xtables-registration.py
          python3 scripts/test-dns-output-order.py
          python3 scripts/test-dns-capture-fast-path.py
          python3 scripts/test-uninstall.py
          shellcheck -s ash -S warning src/MagicNet/lib/magicnet/network.sh src/MagicNet/lib/magicnet/lifecycle.sh
      - name: Test Rust workspace and canonical state publication
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          cargo fmt --all --check
          cargo test --workspace --locked
      - name: Store immutable verified source tree only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          allowed={'scripts/test-route-ownership.py','src/MagicNet/lib/magicnet/network.sh','src/MagicNet/lib/magicnet/lifecycle.sh'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          entries=[]
          hashes={}
          for name in sorted(allowed):
              mode=subprocess.check_output(['git','ls-files','--stage',name],text=True).split()[0]
              raw=Path(name).read_bytes()
              hashes[name]=hashlib.sha256(raw).hexdigest()
              entries.append(dict(path=name,mode=mode,type='blob',content=raw.decode()))
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          expected=subprocess.check_output(['git','write-tree'],text=True).strip()
          cp=subprocess.run(['gh','api','--method','POST','repos/LIghtJUNction/MagicNet/git/trees','--input','-'],
                            input=json.dumps(dict(base_tree=base,tree=entries)),text=True,capture_output=True,check=True,timeout=30)
          tree=json.loads(cp.stdout)['sha']
          assert tree==expected
          out=Path(os.environ['RUNNER_TEMP'])/'verified-boundaries'
          out.mkdir()
          (out/'result.json').write_text(json.dumps(dict(tree=tree,parent='cdab774c2386e809cf2675ac6ebbde13d5a205dd',
              hashes=hashes,result='PASS',not_tested=['physical_device','Play_GMS','Android_RSS']),indent=2)+'\n')
          (out/'patch.diff').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          print('Verified cleanup-boundary tree: '+tree)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-network-cleanup-boundaries
          path: ${{ runner.temp }}/verified-boundaries
          if-no-files-found: error
          retention-days: 2
