name: Validate v1.5.6 Network Source
on:
  push:
    branches: [audit/v1.5.6-reviewed-patch]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 89219d53f6224d03ebe510aeb72f3620d8f44dd7
          persist-credentials: false
          fetch-depth: 1
      - name: Apply only reviewed ordinary source files on merged PR 306
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          def blob(sha):
              data = json.loads(subprocess.check_output(['gh', 'api', 'repos/LIghtJUNction/MagicNet/git/blobs/' + sha], timeout=30))
              raw = base64.b64decode(data['content'])
              assert data['sha'] == sha and data['encoding'] == 'base64'
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              return raw
          parts = ['4c0f99d975f0aba62c3410bf2e232ed5e5a05e35','7bc42d200f634b5a135667e906cd6dbef85b14d8',
                   '9f8ddd323686aa4826a04e48f6b10cfedb972bab','73844d540b68259028adf4804a1f9e63dfe183a3',
                   '99920ce736c0aad564c5f2d4c5cb174f626d0129','98281bb26a442b9144ce6f220c56665225257801']
          compressed = base64.b64decode(b''.join(blob(sha) for sha in parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '648fe895cec9c67959e353266ae687e519b1aaffe88e6219006395ed3d5e1824'
          raw = lzma.decompress(compressed)
          assert len(raw) == 109735 and hashlib.sha256(raw).hexdigest() == 'bee63fbc6becee3f7eb1599bbed59d2a2db3a8e42ff001dfd6337052caccca7b'
          selected = '''crates/magicnet-cli/src/diagnostics.rs
          crates/magicnet-cli/src/main.rs
          crates/magicnet-cli/src/network_observation.rs
          crates/magicnet-cli/src/state.rs
          scripts/test-app-routing-policy.sh
          scripts/test-dns-output-order.py
          scripts/test-network-ownership.py
          scripts/test-startup-network-safety.sh
          src/MagicNet/lib/magicnet/network.sh
          src/MagicNet/lib/magicnet/routes.sh
          src/MagicNet/lib/magicnet/runtime_config.sh
          webui/runtime-log-insights.test.mjs
          webui/src/components/pages/runtimeLogInsights.ts'''
          selected = [p.strip() for p in selected.splitlines()]
          out = Path(os.environ['RUNNER_TEMP']) / 'reviewed-patch'
          out.mkdir()
          patch = out / 'source-input.patch'; patch.write_bytes(raw)
          includes = ['--include=' + path for path in selected]
          subprocess.run(['git','apply','--check','--index',*includes,str(patch)],check=True)
          subprocess.run(['git','apply','--index',*includes,str(patch)],check=True)
          # Preserve all merged feedback/Tailscale/AVD tests. Add only our new gate.
          host = Path('scripts/test-host.sh')
          text = host.read_text()
          anchor = 'check python3 scripts/test-dns-output-order.py\n'
          assert text.count(anchor) == 1
          host.write_text(text.replace(anchor, anchor + 'CI_TEST_FORCE=1 check python3 scripts/test-network-ownership.py\n'))
          selected.append(str(host))
          (out / 'allowed.json').write_text(json.dumps(selected))
          # Workflow files are outside this operation. Do not retry the earlier
          # denied workflow-file tree, elevate tokens, or alter any CI policy.
          assert not subprocess.check_output(['git','diff','HEAD','--','.github']).strip()
          PY
      - name: Test integrated Rust network observation
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
          cargo fmt --all
          cargo test --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test exact network mutation ownership and lifecycle
        run: |
          set -euo pipefail
          python3 scripts/test-network-ownership.py
          python3 scripts/test-dns-output-order.py
          bash scripts/test-app-routing-policy.sh
          bash scripts/test-hotspot-routing.sh
          bash scripts/test-startup-network-safety.sh
          bash scripts/test-kernel-route-lifecycle.sh
          bash scripts/test-dns-leak-guard-timeout.sh
          python3 scripts/test-feedback-snapshot.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Test integrated WebUI
        run: |
          set -euo pipefail
          cd webui
          npm ci
          npm run check
      - name: Export only validated ordinary source without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'reviewed-patch'
          allowed = set(json.loads((out / 'allowed.json').read_text()))
          changed = subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines()
          assert set(changed) == allowed and all(not p.startswith('.github/') for p in changed)
          subprocess.run(['git','add','--',*changed],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          elements = []
          for path in changed:
              mode = subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              assert mode in ('100644','100755')
              elements.append(dict(path=path,mode=mode,type='blob',content=Path(path).read_text()))
          payload = out / 'tree-input.json'
          payload.write_text(json.dumps(dict(base_tree='19ad5db606273eb2b669fb50eb01ed3bbb68406a',tree=elements)))
          expected = subprocess.check_output(['git','write-tree'],text=True).strip()
          (out / 'result.json').write_text(json.dumps(dict(tree_sha=expected,base_commit='89219d53f6224d03ebe510aeb72f3620d8f44dd7',paths=changed),indent=2))
          (out / 'formatted.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          result = json.loads(subprocess.check_output(['gh','api','--method','POST',
              'repos/LIghtJUNction/MagicNet/git/trees','--input',str(payload)],text=True,timeout=60))
          assert result['sha'] == expected
          print('Validated ordinary source tree:', expected)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-v1.5.6-network-source
          path: ${{ runner.temp }}/reviewed-patch
          if-no-files-found: error
          retention-days: 7
