name: Validate v1.5.6 State Observation
on:
  push:
    branches: [audit/v1.5.6-reviewed-patch]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 89219d53f6224d03ebe510aeb72f3620d8f44dd7
          persist-credentials: false
          fetch-depth: 1
      - name: Select validated nonoverlapping source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          selected = {
            'crates/magicnet-cli/src/diagnostics.rs':'497ba969250c2fabd62a9d146ca710862221f6f5',
            'crates/magicnet-cli/src/main.rs':'f5dd0ef2de204b1772a3071b0a240b2a91a37114',
            'crates/magicnet-cli/src/network_observation.rs':'eed57a0e22f563bcfb59f09a5a9cff57a700541e',
            'crates/magicnet-cli/src/state.rs':'c994c905e9feda692025d85868ad41983cf6c978',
            'src/MagicNet/lib/magicnet/runtime_config.sh':'5cd4f1e19eea21edd5a290fb63ef80d01eeba9d5'}
          for path, sha in selected.items():
              data=json.loads(subprocess.check_output(['gh','api','repos/LIghtJUNction/MagicNet/git/blobs/'+sha],timeout=30))
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              Path(path).write_bytes(raw)
          path=Path('crates/magicnet-cli/src/diagnostics.rs')
          text=path.read_text()
          old='''        } else {
                      check("ip6tables")
                  };'''
          new='''        } else {
                      ipv6_capture_policy(check("ip6tables"), config.pointer("/dns/strategy").and_then(Value::as_str))
                  };'''
          # Dedent the YAML/Python literal to the source's eight-space branch.
          old=old.replace('                      ', '            ').replace('                  ', '        ')
          new=new.replace('                      ', '            ').replace('                  ', '        ')
          assert text.count(old)==1
          text=text.replace(old,new)
          text+='''
          // This boolean means readiness for the configured policy, not that an
          // unsupported family was captured. Only an explicit optional-table
          // absence may be tolerated; permission/timeouts remain failures.
          fn ipv6_capture_policy(observed: (bool, &'static str), strategy: Option<&str>) -> (bool, &'static str) {
              match (strategy, observed) {
                  (Some("prefer_ipv4"), (false, "table-unsupported")) => (true, "unsupported-ipv4-first"),
                  _ => observed,
              }
          }
          #[cfg(test)]
          mod ipv6_capture_policy_tests {
              use super::ipv6_capture_policy;
              #[test]
              fn optional_absence_is_not_permission_failure_or_required_capture() {
                  assert_eq!(ipv6_capture_policy((false,"table-unsupported"),Some("prefer_ipv4")),(true,"unsupported-ipv4-first"));
                  for strategy in [None,Some("prefer_ipv6")] {
                      assert_eq!(ipv6_capture_policy((false,"table-unsupported"),strategy),(false,"table-unsupported"));
                  }
                  for failure in ["observation-failed","observation-incomplete","observation-unavailable","capture-rule-unrecognized"] {
                      assert_eq!(ipv6_capture_policy((false,failure),Some("prefer_ipv4")),(false,failure));
                  }
                  assert_eq!(ipv6_capture_policy((true,"redirected"),Some("prefer_ipv4")),(true,"redirected"));
              }
          }
          '''
          path.write_text(text)
          path=Path('crates/magicnet-cli/src/network_observation.rs')
          text=path.read_text()
          start=text.index('    let ready = routes.lines().any(')
          end=text.index('    if !ready {',start)
          text=text[:start]+'''    let prefixes = routes.lines().filter_map(|line| {
                  let words = line.split_whitespace().collect::<Vec<_>>();
                  if words.windows(2).any(|pair| pair == ["dev", "magicnet0"]) {
                      words.first().copied()
                  } else { None }
              }).collect::<Vec<_>>();
              let ready = prefixes.iter().any(|prefix| matches!(*prefix, "default" | "0.0.0.0/0"))
                  || (prefixes.contains(&"0.0.0.0/1") && prefixes.contains(&"128.0.0.0/1"));
          '''+text[end:]
          anchor='        assert!(hotspot_matches("8999|wlan1\\n", ip, route, forward));'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'''
                  assert!(!hotspot_matches("8999|wlan1\\n", ip, "198.18.0.1 dev magicnet0\\n", forward));
                  assert!(!hotspot_matches("8999|wlan1\\n", ip, "0.0.0.0/1 dev magicnet0\\n", forward));
                  assert!(hotspot_matches("8999|wlan1\\n", ip, "0.0.0.0/1 dev magicnet0\\n128.0.0.0/1 dev magicnet0\\n", forward));
          ''')
          path.write_text(text)
          out=Path(os.environ['RUNNER_TEMP'])/'reviewed-patch';out.mkdir()
          (out/'allowed.json').write_text(json.dumps(list(selected)))
          PY
      - name: Format and execute Rust observation regressions
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
          cargo fmt --all
          cargo test --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          bash scripts/test-tailscale-login.sh
      - name: Export validated ordinary source without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'reviewed-patch'
          allowed=set(json.loads((out/'allowed.json').read_text()))
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          changed=subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines()
          assert set(changed)==allowed and all(not p.startswith('.github/') for p in changed)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          elements=[]
          for path in changed:
              mode=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              elements.append(dict(path=path,mode=mode,type='blob',content=Path(path).read_text()))
          payload=out/'tree-input.json'
          payload.write_text(json.dumps(dict(base_tree='19ad5db606273eb2b669fb50eb01ed3bbb68406a',tree=elements)))
          expected=subprocess.check_output(['git','write-tree'],text=True).strip()
          (out/'result.json').write_text(json.dumps(dict(tree_sha=expected,base_commit='89219d53f6224d03ebe510aeb72f3620d8f44dd7',paths=changed),indent=2))
          (out/'formatted.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/LIghtJUNction/MagicNet/git/trees','--input',str(payload)],text=True,timeout=60))
          assert result['sha']==expected
          print('Validated state observation tree:',expected)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-v1.5.6-state-source
          path: ${{ runner.temp }}/reviewed-patch
          if-no-files-found: error
          retention-days: 7
