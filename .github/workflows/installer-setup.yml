name: Installer setup page
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: installer-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize framework
        run: git submodule update --init src/MagicNet/lib/kamfw
      - run: sudo apt-get update && sudo apt-get install -y busybox-static shellcheck
      - name: Lint the installed framework extension
        run: >-
          shellcheck -s sh -e SC1090,SC1091,SC2016,SC2034
          src/MagicNet/lib/kamfw-overlay/launcher.sh
          src/MagicNet/lib/kamfw-overlay/web_form.sh
          src/MagicNet/lib/kamfw-overlay/web_form/handler.sh
          src/MagicNet/lib/magicnet/install_setup.sh
      - run: python3 scripts/test-install-setup.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-install-setup.mjs
