name: Stage reviewed Android integration
on:
  push:
    branches: [fix/android-release-integration]
    paths: [.github/workflows/stage-android-integration.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Merge only the two reviewed PR snapshots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/fix/android-kernelsu-fixture-344)" = 7ab929388716108ab431846f6f7fa5568dace753
          test "$(git rev-parse origin/fix/android-simulation-payloads-upgrade)" = 86a33d6c49038ae2f0cffebe47c59597cda0b01d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff 7ab929388716108ab431846f6f7fa5568dace753 -m 'Merge PR #347 lifecycle fixes for integrated validation'
          set +e
          git merge --no-ff --no-commit 86a33d6c49038ae2f0cffebe47c59597cda0b01d
          rc=$?
          set -e
          test "$rc" = 1
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/android-kernelsu-acceptance.yml',
              'docs/android-simulation.md',
              'scripts/android-device-simulation.py',
              'scripts/test-android-simulation-fixes.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          subprocess.run(['git', 'checkout', '--ours', '--', *sorted(expected)], check=True)
          PY
          python3 .github/reconcile-android-integration.py
      - name: Verify byte-identical reviewed output and host regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/android-kernelsu-acceptance.yml': 'dbc19a0afec91f9bf0ea6157577532eeba154ec0',
              'docs/android-simulation-fixture-repair.md': '15d6b6a42516b271d968b87b34acd877d1ce98ae',
              'docs/android-simulation.md': '9748e8dc00c789828880f751abf85dee424f80cd',
              'scripts/android-device-simulation.py': 'f7b1e0a44c74d0422513ed839152f8ae7ca7dc1b',
              'scripts/prepare-android-fixture-tools.sh': 'ff15c8072612a5d68c7ebb2388681cb1f50b6f12',
              'scripts/test-android-device-simulation.py': 'aa79faef4cca296c4552ab5638f5ed6ce6c4386b',
              'scripts/test-android-simulation-fixes.py': 'b5fb75dd69da144a8076d78329d1bc1380d1db10',
              'scripts/test-android-simulation-workflow.py': '194742d69ad3553b724c49c46299817977bd58b6',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          PY
          python3 -m pip install --user PyYAML
          for test in test-android-simulation-fixes test-android-device-simulation test-android-simulation-workflow test-android-avd-storage test-android-acceptance-contract test-fake-magisk-curl; do
            python3 "scripts/$test.py" -v
          done
          bash -n scripts/prepare-android-fixture-tools.sh scripts/fixtures/fake-magisk-curl.sh scripts/fake-magisk-smoke.sh
          git diff --check
      - name: Commit reconciled histories and remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          git add -- .github/workflows/android-kernelsu-acceptance.yml docs/android-simulation-fixture-repair.md docs/android-simulation.md scripts/android-device-simulation.py scripts/android-simulation-upgrade.py scripts/prepare-android-fixture-tools.sh scripts/test-android-simulation-fixes.py scripts/test-android-simulation-workflow.py scripts/test-android-device-simulation.py
          git rm -- .github/reconcile-android-integration.py .github/workflows/review-integration-snapshot.yml .github/workflows/stage-android-integration.yml
          git diff --cached --check
          git commit -m 'Merge PR #345 preserving full payloads and staged migration checks; fix pristine KernelSU bootstrap'
          git push origin HEAD:fix/android-release-integration
          git archive --format=tar -o "$RUNNER_TEMP/integrated-source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/integrated-sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-android-integration-source
          path: |
            ${{ runner.temp }}/integrated-source.tar
            ${{ runner.temp }}/integrated-sha.txt
          if-no-files-found: error
          retention-days: 3
