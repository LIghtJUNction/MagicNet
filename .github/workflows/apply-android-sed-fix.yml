name: Apply Android sed compatibility fix

on:
  push:
    branches: ['fix/release-and-android-20260930']
    paths: ['.github/workflows/apply-android-sed-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/release-and-android-20260930
          fetch-depth: 0
          persist-credentials: true
      - name: Apply compatibility and acceptance changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {text.count(old)}")
              p.write_text(text.replace(old, new))

          envrc = "export KAMFW_DIR=${MODDIR}/lib/kamfw\n"
          replace(
              "src/MagicNet/.config/kamfw/.envrc",
              envrc,
              envrc + """# KernelSU executes module scripts in BusyBox ash standalone mode. The
# official x86_64 BusyBox bundled by KernelSU v3.2.0/v3.3.0 has a sed applet
# that crashes on valid UTF-8 regex input in the Android acceptance AVD.
# Explicit paths bypass standalone applets; shell functions outrank applets.
# Keep standalone semantics for every other command and use Android's sed.
if [ -x /system/bin/sed ]; then
    sed() { /system/bin/sed "$@"; }
fi
""",
          )

          old_runtime = """# Root managers run boot hooks in BusyBox ash standalone mode, where the ip
# applet wins over PATH and cannot handle all Android iproute2 operations.
# Shell functions take precedence over applets. Bind only ip, without disabling
# standalone mode for the other tools or changing host-side PATH/test doubles.
if [ -x /system/bin/ip ]; then
    ip() { /system/bin/ip "$@"; }
fi
"""
          new_runtime = """# Root managers run boot hooks in BusyBox ash standalone mode, where applets
# win over PATH. Android iproute2 is required for numeric route tables, and the
# pinned KernelSU x86_64 BusyBox sed crashes on valid UTF-8 regex input.
# Shell functions take precedence over applets, so bind only the affected tools
# without disabling standalone mode or changing host-side PATH/test doubles.
if [ -x /system/bin/ip ]; then
    ip() { /system/bin/ip "$@"; }
fi
if [ -x /system/bin/sed ]; then
    sed() { /system/bin/sed "$@"; }
fi
"""
          replace("src/MagicNet/lib/magicnet.sh", old_runtime, new_runtime)

          old_cases = r'''def busybox_regex_cases():
    sample = '{"inbounds": [], "outbounds": [{"type": "socks", "tag": "测试"}]}\n'
    cases = [(name, ['grep', '-Eq', pattern], sample, 0, '')
             for name, pattern in CONFIG_PATTERNS.items()]
    cases.extend([
        ('nodes_absent', ['grep', '-Eq', NODE_PATTERN], '{"type":"direct"}\n', 1, ''),
        ('sed_lines', ['sed', '/^[[:space:]]*$/d; /^[[:space:]]*#/d'],
         ' \n# comment\n  # comment\n测试\n', 0, '测试\n'),
        ('sed_capture', ['sed', '-n', r's/.*"tag":"\([^"]*\)".*/\1/p'],
         '{"tag":"测试"}\n', 0, '测试\n'),
    ])
    return cases
'''
          new_cases = r'''def busybox_regex_cases():
    sample = '{"inbounds": [], "outbounds": [{"type": "socks", "tag": "测试"}]}\n'
    cases = [(name, ['grep', '-Eq', pattern], sample, 0, '')
             for name, pattern in CONFIG_PATTERNS.items()]
    cases.append(('nodes_absent', ['grep', '-Eq', NODE_PATTERN],
                  '{"type":"direct"}\n', 1, ''))
    return cases


def system_sed_cases():
    return [
        ('sed_lines', ['/^[[:space:]]*$/d; /^[[:space:]]*#/d'],
         ' \n# comment\n  # comment\n测试\n', 0, '测试\n'),
        ('sed_capture', ['-n', r's/.*"tag":"\([^"]*\)".*/\1/p'],
         '{"tag":"测试"}\n', 0, '测试\n'),
    ]
'''
          replace("scripts/android-device-simulation.py", old_cases, new_cases)

          old_check = r'''        for name, args, sample, expected_exit, expected_output in busybox_regex_cases():
            command = ('printf %s ' + shlex.quote(sample) + ' | ' + BB + ' '
                       + ' '.join(shlex.quote(arg) for arg in args))
            result = run(command, runtime=True)
            evidence['checks'][name] = {
                'exit_code': bounded_exit_code(result.returncode),
                'expected_exit_code': expected_exit,
                'output_matches': result.stdout == expected_output,
            }
        valid = (evidence['sha256'] is not None and evidence['version'] is not None
                 and all(item['exit_code'] == item['expected_exit_code'] and item['output_matches']
                         for item in evidence['checks'].values()))
        if valid:
            evidence['status'] = 'passed'
        require(valid, 'BusyBox regex preflight failed; see busybox_checks evidence')
'''
          new_check = r'''        for name, args, sample, expected_exit, expected_output in busybox_regex_cases():
            command = ('printf %s ' + shlex.quote(sample) + ' | ' + BB + ' '
                       + ' '.join(shlex.quote(arg) for arg in args))
            result = run(command, runtime=True)
            evidence['checks'][name] = {
                'exit_code': bounded_exit_code(result.returncode),
                'expected_exit_code': expected_exit,
                'output_matches': result.stdout == expected_output,
                'provider': 'kernelsu_busybox',
            }
        evidence['sed_provider'] = '/system/bin/sed'
        for name, args, sample, expected_exit, expected_output in system_sed_cases():
            command = ('test -x /system/bin/sed && printf %s ' + shlex.quote(sample)
                       + ' | /system/bin/sed ' + ' '.join(shlex.quote(arg) for arg in args))
            result = run(command, runtime=True)
            evidence['checks'][name] = {
                'exit_code': bounded_exit_code(result.returncode),
                'expected_exit_code': expected_exit,
                'output_matches': result.stdout == expected_output,
                'provider': 'android_system_sed',
            }
        valid = (evidence['sha256'] is not None and evidence['version'] is not None
                 and all(item['exit_code'] == item['expected_exit_code'] and item['output_matches']
                         for item in evidence['checks'].values()))
        if valid:
            evidence['status'] = 'passed'
        require(valid, 'Module shell tool preflight failed; see busybox_checks evidence')
'''
          replace("scripts/android-device-simulation.py", old_check, new_check)

          replace(
              "scripts/test-android-device-simulation.py",
              """                subprocess.CompletedProcess([], 0, '', 'BusyBox v1.36.1.1 topjohnwu multi-call binary.\\n')] + [
                    cp(expected, rc) for _, _, _, rc, expected in SIM.busybox_regex_cases()]
""",
              """                subprocess.CompletedProcess([], 0, '', 'BusyBox v1.36.1.1 topjohnwu multi-call binary.\\n')] + [
                    cp(expected, rc) for _, _, _, rc, expected
                    in SIM.busybox_regex_cases() + SIM.system_sed_cases()]
""",
          )
          replace(
              "scripts/test-android-device-simulation.py",
              """            self.assertEqual(record['version'], '1.36.1.1')
            self.assertEqual(record['checks']['nodes_absent']['exit_code'], 1)
""",
              """            self.assertEqual(record['version'], '1.36.1.1')
            self.assertEqual(record['sed_provider'], '/system/bin/sed')
            self.assertEqual(record['checks']['nodes_absent']['exit_code'], 1)
            self.assertEqual(record['checks']['nodes']['provider'], 'kernelsu_busybox')
            self.assertEqual(record['checks']['sed_lines']['provider'], 'android_system_sed')
""",
          )
          replace(
              "scripts/test-android-device-simulation.py",
              """                 self.assertRaisesRegex(RuntimeError, 'BusyBox regex preflight failed'):
""",
              """                 self.assertRaisesRegex(RuntimeError, 'Module shell tool preflight failed'):
""",
          )
          old_host = """        for name, args, sample, rc, output in SIM.busybox_regex_cases():
            with self.subTest(case=name):
                result = subprocess.run(args, input=sample, text=True, capture_output=True, timeout=3)
                self.assertEqual(result.returncode, rc)
                self.assertEqual(result.stdout, output)
"""
          new_host = old_host + """        for name, args, sample, rc, output in SIM.system_sed_cases():
            with self.subTest(case=name):
                result = subprocess.run(['sed', *args], input=sample, text=True,
                                        capture_output=True, timeout=3)
                self.assertEqual(result.returncode, rc)
                self.assertEqual(result.stdout, output)
"""
          replace("scripts/test-android-device-simulation.py", old_host, new_host)

          sed_test = r'''#!/usr/bin/env python3
"""Verify Android sed dispatch without changing BusyBox standalone semantics."""
from pathlib import Path
import os
import shlex
import shutil
import subprocess
import tempfile
import unittest

ROOT = Path(__file__).resolve().parents[1]
SOURCE = ROOT / "src/MagicNet"
SHELLS = [[shutil.which("sh") or "/bin/sh"]]
if shutil.which("bash"):
    SHELLS.append([shutil.which("bash")])
if shutil.which("busybox"):
    SHELLS.append([shutil.which("busybox"), "ash"])


def write(path: Path, text: str, executable: bool = False) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(text, encoding="utf-8")
    if executable:
        path.chmod(0o755)


class SedDispatchTests(unittest.TestCase):
    def source_fixture(self, root: Path, source: Path, android_sed: bool) -> tuple[Path, Path]:
        module = root / "module with spaces"
        system_sed = module / "android tools/sed"
        text = source.read_text(encoding="utf-8")
        if source.name == "magicnet.sh":
            text = text.split("_magicnet_lib_dir=", 1)[0]
        text = text.replace("/system/bin/sed", shlex.quote(str(system_sed)))
        target = module / source.name
        write(target, text)
        if android_sed:
            host_sed = shutil.which("sed")
            self.assertIsNotNone(host_sed)
            write(system_sed, "#!/bin/sh\nprintf '%s\\n' \"$*\" >>\"$MODDIR/system-sed.log\"\n"
                 + "exec " + shlex.quote(host_sed) + " \"$@\"\n", True)
        return module, target

    def run_source(self, shell: list[str], source: Path, android_sed: bool = True):
        with tempfile.TemporaryDirectory() as tmp:
            module, target = self.source_fixture(Path(tmp), source, android_sed)
            script = r'''
sed() { printf 'wrong-sed\n' >>"$MODDIR/wrong-sed.log"; return 139; }
. "$SOURCE"
printf ' \n# comment\n  # comment\n测试\n' | sed '/^[[:space:]]*$/d; /^[[:space:]]*#/d'
rc=$?
[ "$ASH_STANDALONE" = 1 ] || exit 99
exit "$rc"
'''
            result = subprocess.run(
                [*shell, "-c", script],
                env={**os.environ, "MODDIR": str(module), "SOURCE": str(target),
                     "ASH_STANDALONE": "1"},
                text=True, capture_output=True, timeout=5, check=False,
            )
            return result, module

    def test_system_sed_overrides_broken_standalone_applet(self):
        for source in (SOURCE / ".config/kamfw/.envrc", SOURCE / "lib/magicnet.sh"):
            for shell in SHELLS:
                with self.subTest(source=source, shell=shell):
                    with tempfile.TemporaryDirectory() as tmp:
                        module, target = self.source_fixture(Path(tmp), source, True)
                        script = r'''
sed() { printf 'wrong-sed\n' >>"$MODDIR/wrong-sed.log"; return 139; }
. "$SOURCE"
printf ' \n# comment\n  # comment\n测试\n' | sed '/^[[:space:]]*$/d; /^[[:space:]]*#/d'
rc=$?
[ "$ASH_STANDALONE" = 1 ] || exit 99
exit "$rc"
'''
                        result = subprocess.run(
                            [*shell, "-c", script],
                            env={**os.environ, "MODDIR": str(module), "SOURCE": str(target),
                                 "ASH_STANDALONE": "1"},
                            text=True, capture_output=True, timeout=5, check=False,
                        )
                        self.assertEqual(result.returncode, 0, result.stderr)
                        self.assertEqual(result.stdout, "测试\n")
                        self.assertTrue((module / "system-sed.log").exists())
                        self.assertFalse((module / "wrong-sed.log").exists())

    def test_missing_android_sed_preserves_existing_non_android_double(self):
        for source in (SOURCE / ".config/kamfw/.envrc", SOURCE / "lib/magicnet.sh"):
            for shell in SHELLS:
                with self.subTest(source=source, shell=shell), tempfile.TemporaryDirectory() as tmp:
                    module, target = self.source_fixture(Path(tmp), source, False)
                    result = subprocess.run(
                        [*shell, "-c", 'sed() { printf host-sed; return 17; }; . "$SOURCE"; sed x'],
                        env={**os.environ, "MODDIR": str(module), "SOURCE": str(target),
                             "ASH_STANDALONE": "1"},
                        text=True, capture_output=True, timeout=5, check=False,
                    )
                    self.assertEqual(result.returncode, 17)
                    self.assertEqual(result.stdout, "host-sed")


if __name__ == "__main__":
    unittest.main(verbosity=2)
'''
          Path("scripts/test-android-sed-dispatch.py").write_text(sed_test)
          Path("scripts/test-android-sed-dispatch.py").chmod(0o755)

          old_doc = """the guest's observed `/proc/meminfo` separately. The driver requires an explicit
emulator serial, qemu identity, x86_64 ABI, API 35, SELinux Enforcing, a positive
KernelSU kernel version, and the real `u:r:su:s0` domain from pinned KernelSU v3.2.0. It uses KernelSU
BusyBox with `ASH_STANDALONE=1`. It never enables permissive mode.
"""
          new_doc = """the guest's observed `/proc/meminfo` separately. The driver requires an explicit
emulator serial, qemu identity, x86_64 ABI, API 35, SELinux Enforcing, a positive
KernelSU kernel version, and the real `u:r:su:s0` domain from pinned KernelSU v3.2.0. It keeps
KernelSU BusyBox `ASH_STANDALONE=1` semantics, verifies the BusyBox identity and
the grep regexes MagicNet relies on, and separately verifies Android's explicit
`/system/bin/sed` for the sed regexes. MagicNet binds `sed` to that explicit
system executable, just as it already binds `ip` to Android iproute2, because
the pinned KernelSU x86_64 BusyBox sed applet segfaults on valid UTF-8 input.
Explicit system paths bypass standalone applets; standalone mode remains enabled
for every other command. It never enables permissive mode.
"""
          replace("docs/android-simulation.md", old_doc, new_doc)
          PY
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-android-device-simulation.py
          python3 scripts/test-android-sed-dispatch.py
          python3 scripts/test-boot-ip-dispatch.py
          bash -n src/MagicNet/lib/magicnet.sh
          bash -n src/MagicNet/.config/kamfw/.envrc
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- src/MagicNet/.config/kamfw/.envrc src/MagicNet/lib/magicnet.sh             scripts/android-device-simulation.py scripts/test-android-device-simulation.py             scripts/test-android-sed-dispatch.py docs/android-simulation.md
          git rm -- .github/workflows/apply-android-sed-fix.yml
          git commit -m "fix(android): bypass crashing KernelSU BusyBox sed applet"
          git push origin HEAD:fix/release-and-android-20260930
