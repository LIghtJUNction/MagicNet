name: Verify Stateful Packaged Lifecycle Fixture
on:
  push:
    branches: [audit/lifecycle-fixture-model-20260916]
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install host fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep unzip zip file shellcheck iproute2
      - name: Apply exact reviewed fixture-only changes
        run: |
          python3 .github/fixture-candidate/apply.py
          python3 scripts/test-fake-magisk-kernel.py
          bash -n scripts/fake-magisk-smoke.sh
          shellcheck -S warning scripts/fake-magisk-smoke.sh
          git add scripts/fake-magisk-smoke.sh scripts/fake-magisk-kernel.py scripts/test-fake-magisk-kernel.py
          git diff --cached --check
      - name: Download exact previously built module and compile pinned host core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/core"
          gh run download 35135151722 --repo LIghtJUNction/MagicNet --name kam-module-artifact --dir dist
          test -s dist/MagicNet.zip
          scripts/build-sing-box.sh linux amd64 "$RUNNER_TEMP/core/sing-box"
          echo "$RUNNER_TEMP/core" >> "$GITHUB_PATH"
      - name: Execute the full package lifecycle without relaxing production checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/fixture-model
          MAGICNET_FAKE_KEEP=1 timeout --kill-after=5s 900s bash scripts/fake-magisk-smoke.sh "$PWD/dist/MagicNet.zip" >artifacts/fixture-model/replay.log 2>&1
          tail -n 40 artifacts/fixture-model/replay.log
      - name: Store verified fixture tree without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed={'scripts/fake-magisk-smoke.sh','scripts/fake-magisk-kernel.py','scripts/test-fake-magisk-kernel.py'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          entries=[]
          for path in sorted(allowed):
              mode=subprocess.check_output(['git','ls-files','--stage',path],text=True).split()[0]
              entries.append(dict(path=path,mode=mode,type='blob',content=Path(path).read_text()))
          cp=subprocess.run(['gh','api','--method','POST','repos/LIghtJUNction/MagicNet/git/trees','--input','-'],input=json.dumps({'base_tree':'a5ee905179e8c1c6d47a84f85541fa977c849885','tree':entries}),capture_output=True,text=True,check=True,timeout=30)
          tree=json.loads(cp.stdout)['sha']
          Path('artifacts/fixture-model/verified.json').write_text(json.dumps({'tree':tree,'parent':'68059da646d7b9227e4931364bc4f3abcc273799','result':'PASS','scope':'host_fixture_package_lifecycle'},indent=2)+'\n')
          print('Verified fixture-only candidate tree: '+tree)
          PY
      - name: Preserve only bounded private-fixture evidence
        if: always()
        run: |
          mkdir -p artifacts/fixture-model
          git diff -- scripts/fake-magisk-smoke.sh > artifacts/fixture-model/working.patch
          git diff --cached -- scripts > artifacts/fixture-model/fixture.patch
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('artifacts/fixture-model')
          for i,root in enumerate(Path('/tmp').glob('magicnet-fake-magisk.*')):
              if not root.is_dir() or root.is_symlink(): continue
              for name in ('mock-commands.log','mock-commands.log.kernel.json','runtime-path.log'):
                  p=root/name
                  if p.is_file() and not p.is_symlink() and p.stat().st_size<2*1024*1024:
                      shutil.copyfile(p,out/(str(i)+'-'+name))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stateful-lifecycle-fixture-evidence
          path: artifacts/fixture-model
          if-no-files-found: error
          retention-days: 2
