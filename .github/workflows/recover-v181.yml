name: Recover verified v1.8.1 draft

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: magicnet-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'LIghtJUNction/MagicNet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b762b8c54b99c7561914d3a02c3a635636ae6837
          persist-credentials: false
      - name: Initialize the tested implementation
        run: git submodule update --init --depth 1 -- generated/magicnet-android
      - name: Recheck completed gates and immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/LIghtJUNction/MagicNet/actions/runs/40866529603 > "$RUNNER_TEMP/run.json"
          gh api "repos/LIghtJUNction/MagicNet/actions/runs/40866529603/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api repos/LIghtJUNction/MagicNet/actions/artifacts/12895739203 > "$RUNNER_TEMP/artifact.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((root / "run.json").read_text())
          assert run["head_sha"] == "b762b8c54b99c7561914d3a02c3a635636ae6837"
          assert run["repository"]["full_name"].lower() == "lightjunction/magicnet"
          assert run["head_branch"] == "main" and run["event"] == "workflow_dispatch"
          assert run["path"].split("@")[0] == ".github/workflows/release.yml"
          assert run["status"] == "completed"
          jobs = {j["name"]: j for j in json.loads((root / "jobs.json").read_text())["jobs"]}
          required = {"plan", "build", "android / Simulation harness contracts",
                      "android / Android 15 / KernelSU / x86_64", "android / Android Simulation Gate"}
          assert all(jobs[name]["conclusion"] == "success" for name in required)
          assert any(s["name"] == "Release quality gate" and s["conclusion"] == "success"
                     for s in jobs["build"]["steps"])
          artifact = json.loads((root / "artifact.json").read_text())
          assert artifact["id"] == 12895739203 and artifact["expired"] is False
          assert artifact["name"] == "magicnet-v1.8.1-40866529603"
          assert artifact["workflow_run"]["id"] == 40866529603
          assert artifact["workflow_run"]["head_sha"] == run["head_sha"]
          assert artifact["digest"] == "sha256:f41661742019a3a7be0ccea62ea152a75302ea6364a41083b8e3c32b2279621c"
          assert artifact["size_in_bytes"] == 136196035
          print("Original build, quality, Android gates and artifact identity verified")
          PY
      - name: Check artifact download space
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 1024**3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: '12895739203'
          run-id: '40866529603'
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Verify existing draft bytes and publish by ID
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate repos/LIghtJUNction/MagicNet/releases \
            --jq '.[] | select(.tag_name == "v1.8.1" and .draft == true) | .id' \
            > "$RUNNER_TEMP/draft-ids.txt"
          mapfile -t draft_ids < "$RUNNER_TEMP/draft-ids.txt"
          test "${#draft_ids[@]}" -eq 1
          test "${draft_ids[0]}" = 427831362
          gh api repos/LIghtJUNction/MagicNet/releases/427831362 > "$RUNNER_TEMP/draft.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "draft.json").read_text())
          assert release["id"] == 427831362 and release["prerelease"] is False
          assert release["tag_name"] == "v1.8.1" and release["draft"] is True
          PY
          python3 scripts/release.py verify-uploaded --directory dist --response "$RUNNER_TEMP/draft.json"
          gh api --method PATCH repos/LIghtJUNction/MagicNet/releases/427831362 -F draft=false -f make_latest=true --silent
          gh api repos/LIghtJUNction/MagicNet/releases/427831362 > "$RUNNER_TEMP/published.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((root / "draft.json").read_text())
          after = json.loads((root / "published.json").read_text())
          assert after["draft"] is False and after["prerelease"] is False
          assert after["tag_name"] == "v1.8.1" and after["target_commitish"] == before["target_commitish"]
          fields = ("id", "name", "size", "state", "digest")
          identity = lambda release: sorted(tuple(a[k] for k in fields) for a in release["assets"])
          assert identity(after) == identity(before)
          print(after["html_url"])
          PY
