name: Patch readiness audit
on:
  push:
    branches: [fix/patch-readiness-20260916]
    paths: [.github/workflows/patch-readiness-audit.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore exact source that passed all validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35100314260 --repo LIghtJUNction/MagicNet --name patch-readiness-validation --dir "$RUNNER_TEMP/verified"
          printf '%s  %s\n' aa4bed5d940e581fa8c5bf2f38f2388e2b9e4bc3147f369944aac3ddf56ee7bf "$RUNNER_TEMP/verified/audit/formatted.patch" | sha256sum -c
          printf '%s  %s\n' debbc3bd3956b17797c0afc9b5eac061c75db9e86c2af386ed895534fc22573c "$RUNNER_TEMP/verified/audit/source-sha256.json" | sha256sum -c
          # The authorized user connector already committed the workflow change.
          # GITHUB_TOKEN publishes ordinary source only, within its contents scope.
          git apply --check --index --exclude=.github/workflows/rules-release.yml "$RUNNER_TEMP/verified/audit/formatted.patch"
          git apply --index --exclude=.github/workflows/rules-release.yml "$RUNNER_TEMP/verified/audit/formatted.patch"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          manifest=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'verified/audit/source-sha256.json').read_text())
          assert len(manifest)==31
          for name,expected in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          assert subprocess.check_output(['git','rev-parse',':rules'],text=True).strip()=='756b843a46e2c2c21f0d5f3013a5384b3b3ca2de'
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==(set(manifest)-{'.github/workflows/rules-release.yml'})|{'rules'}
          assert not any(name.startswith('.github/') for name in changed)
          PY
          git diff --cached --check
      - name: Commit and push verified source to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile subscription ownership and finish machine inspection with pinned rules'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/patch-readiness-20260916
          mkdir audit
          git rev-parse HEAD > audit/commit.txt
          git ls-tree HEAD rules > audit/rules-gitlink.txt
          cp "$RUNNER_TEMP/verified/audit/source-sha256.json" audit/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patch-readiness-source-publication
          path: audit/
          retention-days: 7
          if-no-files-found: error
