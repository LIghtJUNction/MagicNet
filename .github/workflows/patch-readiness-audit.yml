name: Patch readiness audit
on:
  push:
    branches: [fix/patch-readiness-20260916]
    paths: [.github/workflows/patch-readiness-audit.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply exact integrity-checked public source patch
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for sha in 3b99c76282f8d5af45ce13fc03f54d129827db69 050033c889656685d14d179c3ad5c7bfd585a76c cf03702383c6287f264573d5d8cb33465406c95c 1a31c0c7e45568f1b34223d930a3252ee77a9a81; do
            gh api "repos/LIghtJUNction/MagicNet/git/blobs/$sha" --jq .content | base64 -d >> "$RUNNER_TEMP/readiness.patch.gz"
          done
          gzip -dc "$RUNNER_TEMP/readiness.patch.gz" > "$RUNNER_TEMP/readiness.patch"
          printf '%s  %s\n' b934aa1c09e153defe813e80a7c355a05350d36ede309aa8983e6be754e100f0 "$RUNNER_TEMP/readiness.patch" | sha256sum -c
          git apply --check "$RUNNER_TEMP/readiness.patch"
          git apply "$RUNNER_TEMP/readiness.patch"
          python3 - <<'PY'
          import os, subprocess
          patch=os.path.join(os.environ['RUNNER_TEMP'], 'readiness.patch')
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',patch],text=True).splitlines()]
          assert len(paths)==23 and all(p.startswith(('crates/','webui/','docs/')) for p in paths)
          subprocess.run(['git','add','-N','--',*paths],check=True)
          PY
          git diff --check
          git submodule update --init --depth 1 -- src/MagicNet/.config/sing-box
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - name: Cache compiler dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: readiness-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**') }}
          restore-keys: readiness-rust-${{ runner.os }}-
      - name: Format and validate Rust without test-result cache
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary > audit/formatted.patch
          cargo test --workspace --all-targets --all-features --locked 2>&1 | tee audit/rust-tests.log
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::dbg_macro -D clippy::todo -D clippy::unimplemented 2>&1 | tee audit/clippy.log
          cargo fmt --all -- --check
          cargo check --locked -p magicnet-cli --target aarch64-linux-android 2>&1 | tee audit/android-check.log
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Test production WebUI and all browser scenarios
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          npm ci
          npm run check 2>&1 | tee ../audit/webui-check.log
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm run test:ui 2>&1 | tee ../audit/browser.log
      - name: Publish verified sources to this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import os,subprocess,pathlib,hashlib,json
          patch=os.path.join(os.environ['RUNNER_TEMP'], 'readiness.patch')
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',patch],text=True).splitlines()]
          subprocess.run(['git','add','--',*paths],check=True)
          pathlib.Path('audit/source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
          git diff --cached --check
          git commit -m 'fix: finish private machine inspection and reconcile subscription ownership'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/patch-readiness-20260916
          git rev-parse HEAD > audit/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: patch-readiness-validation
          path: |
            audit/
            webui/test-results/
          retention-days: 7
          if-no-files-found: error
