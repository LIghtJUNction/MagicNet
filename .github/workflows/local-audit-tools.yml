name: Local audit tools
on:
  push:
    branches: [audit/play-tools-20260916]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare offline tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-audit"
          cd webui
          npm ci
          tar -czf "$RUNNER_TEMP/local-audit/node_modules.tar.gz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/local-audit/node"
          rustup component add rustfmt
          fmt="$(rustup which rustfmt)"
          cp "$fmt" "$RUNNER_TEMP/local-audit/rustfmt"
          ldd "$fmt" > "$RUNNER_TEMP/local-audit/rustfmt-libs.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-play-audit-tools
          path: ${{ runner.temp }}/local-audit
          retention-days: 1
          if-no-files-found: error
