name: PR314 parallel components single-flight
on:
  push:
    branches: [fix/github-mirror-throughput-20260917]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[parallel-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - name: Apply reviewed parallel patch plus single-flight selection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr314-parallel-components.yml').read_text()
          start = source.index('      - name: Apply bounded component concurrency\n')
          header = '        run: |\n'
          body_start = source.index(header, start) + len(header)
          body_end = source.index('      - name: Validate race safety and packaging regressions\n', body_start)
          block = source[body_start:body_end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/apply-parallel.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-parallel.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('installer/components/main.go')
          s = p.read_text()

          def replace(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match, got {s.count(old)}: {old[:100]!r}')
              s = s.replace(old, new)

          replace('var logWriterMu sync.Mutex\nvar routeHintMu sync.Mutex\n',
                  'var logWriterMu sync.Mutex\nvar routeHintMu sync.Mutex\nvar routeSelectMu sync.Mutex\n')
          remember = '''func (o options) rememberRoute(candidate route, c component) {\n\tif o.route == nil {\n\t\treturn\n\t}\n\trouteHintMu.Lock()\n\tdefer routeHintMu.Unlock()\n\t*o.route = routeHint{set: true, prefix: candidate.prefix, name: candidate.name,\n\t\tverifiedAt: time.Now(), sampleSize: c.Size}\n}\n\n'''
          remember_plus = remember + '''func (o options) rememberProbedRoute(candidate route, c component) {\n\tif o.route == nil {\n\t\treturn\n\t}\n\trouteHintMu.Lock()\n\tdefer routeHintMu.Unlock()\n\t*o.route = routeHint{set: true, prefix: candidate.prefix, name: candidate.name,\n\t\tverifiedAt: time.Now(), sampleSize: min(c.Size, int64(routeProbeBytes))}\n}\n\n'''
          replace(remember, remember_plus)
          old = '''\tvar candidates []route\n\tif cached, ok := o.cachedRoute(c, direct); ok {\n\t\tcandidates = []route{cached}\n\t\to.printf("[route] %s: reusing recently verified route", cached.name)\n\t} else {\n\t\tcandidates = o.routes(c, direct)\n\t}\n'''
          new = '''\tvar candidates []route\n\tif cached, ok := o.cachedRoute(c, direct); ok {\n\t\tcandidates = []route{cached}\n\t\to.printf("[route] %s: reusing recently selected route", cached.name)\n\t} else {\n\t\t// Only one component performs route probing at a time. Once a route has\n\t\t// passed the bounded HTTPS/ZIP probe, concurrent components may start\n\t\t// their own full hash-verified downloads through that prefix instead of\n\t\t// duplicating every probe. A failed transfer invalidates the hint and the\n\t\t// existing fallback path ranks alternatives for that component.\n\t\trouteSelectMu.Lock()\n\t\tif cached, ok := o.cachedRoute(c, direct); ok {\n\t\t\tcandidates = []route{cached}\n\t\t\to.printf("[route] %s: sharing concurrently selected route", cached.name)\n\t\t} else {\n\t\t\tcandidates = o.routes(c, direct)\n\t\t\tif len(candidates) > 0 {\n\t\t\t\to.rememberProbedRoute(candidates[0], c)\n\t\t\t}\n\t\t}\n\t\trouteSelectMu.Unlock()\n\t}\n'''
          replace(old, new)
          p.write_text(s)
          PY
          gofmt -w installer/components/main.go installer/components/parallel_test.go
      - name: Validate race safety, route reuse, packaging, and Android build
        run: |
          set -euo pipefail
          go vet ./installer/components
          go test -race -count=3 ./installer/components
          python3 scripts/test-components.py
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/magicnet-components" ./installer/components
      - name: Commit only validated production and regression files
        run: |
          set -euo pipefail
          git rm .github/workflows/pr314-parallel-components.yml .github/workflows/pr314-parallel-singleflight.yml go.mod
          git add installer/components/main.go installer/components/parallel_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'perf(installer): download independent components in parallel [parallel-ready]'
          git push origin HEAD:fix/github-mirror-throughput-20260917
