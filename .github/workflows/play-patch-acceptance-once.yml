name: Play Patch Acceptance Dispatch
on:
  push:
    branches: [audit/play-patch-acceptance]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch current exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = LIghtJUNction/MagicNet
          test "$GITHUB_REF_NAME" = audit/play-patch-acceptance
          actual="$(gh api repos/LIghtJUNction/MagicNet/git/ref/heads/fix/play-feedback-memory-tailscale --jq .object.sha)"
          test "$actual" = ae250e4d2d8987914209121d1f813405329e2718
          gh workflow run android-kernelsu-acceptance.yml --repo "$GITHUB_REPOSITORY" \
            --ref fix/play-feedback-memory-tailscale -f proxy_region=US -f rounds=1 \
            -F run_speed=false -F fresh_avd=true
