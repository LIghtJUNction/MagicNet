name: Tailscale CI diagnostics
on:
  push:
    branches: [fix/tailscale-lifecycle-20260922]
    paths: [.github/workflows/tailscale-ci-diagnostics.yml, .github/tailscale-ci-fix.patch]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/tailscale-lifecycle-20260922
      - name: Apply reviewed patch
        if: ${{ hashFiles('.github/tailscale-ci-fix.patch') != '' }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' f65bfd845010496692335b2499a3e70076224d671d1aff34933b7103153f3af1 .github/tailscale-ci-fix.patch | sha256sum --check --strict
          git apply --check .github/tailscale-ci-fix.patch
          git apply .github/tailscale-ci-fix.patch
          python3 scripts/test-fake-magisk-curl.py
          python3 scripts/test-android-device-simulation.py
          python3 scripts/test-android-simulation-workflow.py
          bash -n scripts/fake-magisk-smoke.sh
          rm .github/tailscale-ci-fix.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts docs .github
          git commit -m 'fix(ci): align direct-fetch fixtures and all Android ABI payloads'
          git push origin HEAD:fix/tailscale-lifecycle-20260922
