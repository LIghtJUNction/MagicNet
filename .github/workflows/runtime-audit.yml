name: Runtime audit
on:
  push:
    branches: [fix/release-runtime-rules-20260916]
    paths: [.github/workflows/runtime-audit.yml]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch patch object without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir audit
          gh api repos/LIghtJUNction/MagicNet/git/blobs/456a13ea1454a997e935dc6b5fc6171e7d289e30 --jq .content | base64 -d > audit/runtime.patch.gz
          sha256sum audit/runtime.patch.gz > audit/transport.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patch-integrity
          path: audit/
          retention-days: 1
          if-no-files-found: error
