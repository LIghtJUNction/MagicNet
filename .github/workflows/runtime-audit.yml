name: Runtime audit
on:
  push:
    branches: [fix/release-runtime-rules-20260916]
    paths: [.github/workflows/runtime-audit.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install browser and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          cd webui
          npm ci
          npx playwright install --with-deps chromium
      - name: Render actual application in mobile browser
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          npx playwright test e2e/overview-refinement.spec.mjs --project=phone-390 --reporter=list
      - name: Obtain release-verified offline rules compiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/compiler
          cd audit/compiler
          gh release download v1.11.4 --repo SagerNet/sing-box --pattern 'sing-box-1.11.4-linux-amd64.tar.gz' --pattern '*checksums*'
          sha256sum -c --ignore-missing *checksums*
          tar xzf sing-box-1.11.4-linux-amd64.tar.gz
          cp sing-box-1.11.4-linux-amd64/sing-box ../sing-box
          ../sing-box version > ../compiler-version.txt
          rm -rf ../compiler
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: baseline-visual-audit
          path: |
            webui/test-results/
            audit/
          retention-days: 3
          if-no-files-found: error
