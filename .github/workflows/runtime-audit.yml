name: Runtime audit
on:
  push:
    branches: [fix/release-runtime-rules-20260916]
    paths: [.github/workflows/runtime-audit.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Export tracked sources only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git archive --format=tar.gz HEAD > audit/source.tar.gz
          git rev-parse HEAD > audit/commit.txt
          git ls-tree -rl HEAD > audit/tree.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-source-audit
          path: audit/
          retention-days: 3
          if-no-files-found: error
