name: Runtime audit
on:
  push:
    branches: [fix/release-runtime-rules-20260916]
    paths: [.github/workflows/runtime-audit.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Export tracked source and review inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/submodules
          git archive --format=tar.gz HEAD > audit/source.tar.gz
          git rev-parse HEAD > audit/commit.txt
          git ls-tree -rl HEAD > audit/tree.txt
          git submodule status --recursive > audit/submodules.txt
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path.cwd()
          for line in (root / 'audit/submodules.txt').read_text().splitlines():
              path = line.split()[1]
              name = path.replace('/', '__').lstrip('.')
              with (root / 'audit/submodules' / (name + '.tar.gz')).open('wb') as out:
                  subprocess.run(['git', '-C', path, 'archive', '--format=tar.gz', '--prefix=' + path + '/', 'HEAD'], stdout=out, check=True)
          PY
          for number in 295 296; do
            gh api "repos/LIghtJUNction/MagicNet/pulls/$number" > "audit/pr-$number.json"
            gh api "repos/LIghtJUNction/MagicNet/pulls/$number" -H 'Accept: application/vnd.github.diff' > "audit/pr-$number.diff"
          done
          gh api repos/LIghtJUNction/MagicNet/releases/latest > audit/release.json
      - name: Prepare reproducible WebUI dependencies and baseline
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          npm ci
          npm run build
          tar -czf ../audit/webui-dependencies.tar.gz node_modules
          tar -czf ../audit/webui-baseline.tar.gz dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-source-audit
          path: audit/
          retention-days: 3
          if-no-files-found: error
