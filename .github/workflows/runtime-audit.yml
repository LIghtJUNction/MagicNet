name: Runtime audit
on:
  push:
    branches: [fix/release-runtime-rules-20260916]
    paths: [.github/workflows/runtime-audit.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply integrity-checked patch to current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          gh api repos/LIghtJUNction/MagicNet/git/blobs/456a13ea1454a997e935dc6b5fc6171e7d289e30 --jq .content > "$RUNNER_TEMP/patch.b64"
          python3 - <<'PY'
          import os, pathlib, base64, gzip, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          data=''.join((root/'patch.b64').read_text().split())
          # Correct four transport transcription bytes before checking the original digest.
          for a,b,value in [(14071,14072,'7'),(10089,10089,'f'),(8299,8300,'j'),(4378,4379,'')]:
              data=data[:a]+value+data[b:]
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='9f1f24d08fbbe24ee35ea43e966fc8cd65baf11284612ca302f5e19aaa523719'
          (root/'source.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/source.patch"
          git apply "$RUNNER_TEMP/source.patch"
          sed -i 's/\.mn-control h1/\.mn-control-status h2/' webui/e2e/overview-refinement.spec.mjs
          git diff --check
          mkdir -p audit
          git diff > audit/verified.diff
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.7'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Test actual installer and packaging behavior
        shell: bash
        run: |
          set -euo pipefail
          GO111MODULE=off go test -race ./installer/components 2>&1 | tee audit/go-test.log
          GO111MODULE=off go vet ./installer/components
          python3 scripts/test-components.py -v 2>&1 | tee audit/components.log
          python3 scripts/lint-source.py
      - name: Test and build WebUI
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          npm ci
          npm test 2>&1 | tee ../audit/webui-tests.log
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npx playwright test e2e/overview-refinement.spec.mjs --reporter=list 2>&1 | tee ../audit/browser.log
      - name: Publish only verified source changes to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,json
          patch=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'source.patch'
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()]
          assert len(paths)==15 and all(p.startswith(('installer/','scripts/','webui/')) for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          pathlib.Path('audit/source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
          git diff --cached --check
          git commit -m 'fix: recover stalled downloads and synchronize WebUI runtime snapshots'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/release-runtime-rules-20260916
          git rev-parse HEAD > audit/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: runtime-validation
          path: |
            audit/
            webui/test-results/
          if-no-files-found: error
          retention-days: 7
