name: Maintenance Virtual Device Kernel
on:
  push:
    branches: ['maintenance/20260928-integration']
    paths: ['.github/workflows/maintenance-kernel-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install build orchestration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y repo python3-yaml
          git config --global user.name 'MagicNet CI'
          git config --global user.email 'ci@localhost'
          df -h .
      - name: Rebuild pinned integration with the AVD target
        env:
          BUILD_ID: '11987101'
          TARGET_ID: a15-api35-6.6
          TARGET_ARCH: x86_64
          TARGET_ANDROID_VERSION: android15
          KSU_REF: v3.2.0
          DIST_NAME: magicnet-virtual-device-dist
          KSU_HAS_INDIRECT_SAFE_CHECK: 'false'
          KSU_X86_SYSCALL_HARDENING_PATCHED: 'false'
          KSU_X86_SYSCALL_HARDENING_DEFAULT_OFF: 'false'
          KSU_X86_SYSCALL_CHECK_BYPASSED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magicnet-kernel-review"
          cd "$RUNNER_TEMP/magicnet-kernel-review"
          curl --fail --location --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/leemikepop/avd-kernelsu-x86_64/main/.github/workflows/_build-gki-core.yml \
            -o upstream.yml
          python3 - <<'PY'
          import hashlib, os, re, shutil, subprocess
          from pathlib import Path
          import yaml
          data = Path('upstream.yml').read_bytes()
          # Pin reviewed source bytes, not the mutable branch or an unreviewed action.
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob != '5176f71f7c9ca7461b04df6aae141103ea99d43d':
              raise SystemExit('Upstream build recipe changed; review required')
          recipe = yaml.safe_load(data)
          names = ['Sync Kernel Source', 'Fix Less Than 6.6.50 Builds', 'Integrate KernelSU',
                   'Apply x86_64 Syscall Hardening Patches', 'Build GKI Kernel']
          expression = '$' + '{{'
          substitutions = {
              expression + ' inputs.ksu_variant }}': 'KernelSU',
              expression + ' inputs.ksu_ref }}': 'v3.2.0',
              expression + ' steps.metadata.outputs.kernel_version }}': '6.6',
              expression + ' steps.metadata.outputs.sublevel }}': '30',
          }
          selected = {s['name']: s for s in recipe['jobs']['build']['steps'] if s.get('name') in names}
          if set(selected) != set(names):
              raise SystemExit('Unexpected upstream recipe shape')
          for name in names:
              script = selected[name]['run']
              for key, value in substitutions.items():
                  script = script.replace(key, value)
              if expression in script:
                  raise SystemExit('Unresolved upstream expression')
              if name == 'Build GKI Kernel':
                  script = script.replace('//common:kernel_x86_64_dist',
                                          '//common-modules/virtual-device:virtual_device_x86_64_dist')
              print('::group::' + name, flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True, timeout=5400)
              print('::endgroup::', flush=True)
              for line in Path(os.environ['GITHUB_ENV']).read_text().splitlines():
                  key, sep, value = line.partition('=')
                  if sep and re.fullmatch(r'KSU_[A-Z0-9_]+', key):
                      os.environ[key] = value
              if name == 'Sync Kernel Source':
                  import xml.etree.ElementTree as ET
                  manifest = Path('kernel/.repo/manifests/manifest_11987101.xml')
                  root = ET.fromstring(manifest.read_bytes())
                  if root.find('include') is not None or not root.findall('project'):
                      raise SystemExit('Kernel manifest is not a complete pinned snapshot')
                  for project in root.findall('project'):
                      if not re.fullmatch('[0-9a-f]{40}', project.get('revision', '')):
                          raise SystemExit('Unpinned kernel dependency')
                  common = subprocess.check_output(['git', '-C', 'kernel/common', 'rev-parse', 'HEAD'], text=True).strip()
                  if common != 'dd9c02ccfe27152c269eec860e74f845b94647e9':
                      raise SystemExit('Unexpected API35 kernel source')
              if name == 'Integrate KernelSU':
                  head = subprocess.check_output(['git', '-C', 'kernel/KernelSU', 'rev-parse', 'HEAD'], text=True).strip()
                  if head != '5f9cada650f1171807c0d702b6cfbf510a2ec175':
                      raise SystemExit('KernelSU v3.2.0 moved')
                  if os.environ.get('KSU_X86_SYSCALL_CHECK_BYPASSED') != 'false':
                      raise SystemExit('KernelSU capability check must not be bypassed')
          out = Path('evidence'); out.mkdir()
          dist = Path('kernel/magicnet-virtual-device-dist')
          for source in [Path('upstream.yml'), Path('kernel/.repo/manifests/manifest_11987101.xml')]:
              shutil.copy2(source, out/source.name)
          for name in ('bzImage', 'Module.symvers', 'vmlinux.symvers', 'modules.builtin', 'modules.builtin.modinfo', 'modules.order'):
              source = dist/name
              if source.is_file(): shutil.copy2(source, out/name)
          if not (out/'bzImage').is_file(): raise SystemExit('Virtual-device kernel missing')
          import json
          evidence = {'schema': 1, 'scope': 'unaccepted kernel candidate; no Android runtime claim',
                      'build_target': '//common-modules/virtual-device:virtual_device_x86_64_dist',
                      'build_id': '11987101', 'ksu_commit': '5f9cada650f1171807c0d702b6cfbf510a2ec175',
                      'upstream_recipe_blob': blob, 'syscall_check_bypassed': False,
                      'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir())}}
          (out/'manifest.json').write_text(json.dumps(evidence, indent=2)+'\n')
          PY
      - name: Retain candidate and exact provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: virtual-device-kernel-candidate
          path: ${{ runner.temp }}/magicnet-kernel-review/evidence/
          if-no-files-found: warn
          retention-days: 7
