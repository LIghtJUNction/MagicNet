name: Temporary subscription fetch trace

on:
  push:
    branches:
      - refactor/dynamic-singbox-controller

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dynamic-singbox-controller
          fetch-depth: 0
      - name: Trace failing subscription policy test
        id: trace
        shell: bash
        run: |
          set +e
          bash -x scripts/test-subscription-fetch-policy.sh
          rc=$?
          echo "trace_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/zz-debug-sub-fetch-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/zz-debug-sub-fetch-temp.yml
          git commit -m "chore: remove temporary subscription trace workflow"
          git push origin HEAD:refactor/dynamic-singbox-controller
      - name: Preserve failure status
        if: steps.trace.outputs.trace_rc != '0'
        run: exit 1
