name: Finalize corrected v1.5.13 release

on:
  push:
    branches: [maintenance/release-v1.5.13-20260922]
    paths: [.github/workflows/finalize-v1.5.13.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: finalize-magicnet-v1.5.13
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'LIghtJUNction/MagicNet'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_MAIN: 566a46dd9832ec38eb0bc5b1fd2fc5978dd5323d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 566a46dd9832ec38eb0bc5b1fd2fc5978dd5323d
          persist-credentials: false

      - name: Validate immutable source metadata before dispatch
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/v1.5.13" --jq 'map(select(.ref == "refs/tags/v1.5.13")) | length')" = 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git diff --exit-code HEAD -- kam.toml src/MagicNet/module.prop update.json
          python3 - <<'PY'
          import json
          import runpy
          import tomllib
          from pathlib import Path
          assert runpy.run_path('scripts/prepare-release.py')['read_metadata']() == ('v1.5.13', 1789322931004)
          config = tomllib.loads(Path('kam.toml').read_text())
          update = json.loads(Path('update.json').read_text())
          assert config['mmrl']['repo']['changelog'] == update['changelog']
          assert config['mmrl']['repo']['changelog_file'] == 'docs/releases/v1.5.13.md'
          assert Path(config['mmrl']['repo']['changelog_file']).is_file()
          assert Path('.github/release-request').read_text().strip() == 'v1.5.13'
          print('Version, updater and KAM export metadata are aligned.')
          PY

      - name: Cancel only the superseded build and duplicate build-only run
        run: |
          set -euo pipefail
          cancel_if_active() {
            local id="$1" status
            status="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)"
            [ "$status" = completed ] && return 0
            if ! gh run cancel "$id" --repo "$GH_REPO"; then
              test "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)" = completed
            fi
          }
          old=35695822134
          gh api "repos/$GH_REPO/actions/runs/$old" > "$RUNNER_TEMP/old-build.json"
          jq -e '.head_sha == "17b0a5758f270996623269066c4902e707e7bfde" and .head_branch == "main" and .event == "push" and .path == ".github/workflows/exec.yml"' "$RUNNER_TEMP/old-build.json"
          cancel_if_active "$old"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$EXPECTED_MAIN&event=push&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/exec.yml" and .event == "push" and .head_branch == "main" and .status != "completed") | .id' \
            > "$RUNNER_TEMP/build-only-runs.txt"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            test "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .head_sha)" = "$EXPECTED_MAIN"
            cancel_if_active "$id"
          done < "$RUNNER_TEMP/build-only-runs.txt"

      - name: Dispatch the existing full release workflow
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$EXPECTED_MAIN"
          existing="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$EXPECTED_MAIN&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/exec.yml")] | length')"
          test "$existing" = 0
          gh workflow run exec.yml --repo "$GH_REPO" --ref main \
            -f bump=none -f release=true -f prerelease=false -f force_tests=true
          printf 'Dispatched v1.5.13 from %s with all release tests and signature checks enabled.\n' "$EXPECTED_MAIN" >> "$GITHUB_STEP_SUMMARY"
