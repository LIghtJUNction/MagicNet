name: Rules Release Integration
on:
  push:
    branches: [main]
    paths:
      - rules
      - rules-release.json
      - src/MagicNet/.config/sing-box
      - src/MagicNet/.config/magicnet/singbox-config-repo.conf
      - src/MagicNet/customize.sh
      - crates/magicnet-cli/src/config_editor.rs
      - webui/src/components/pages/ConfigPage.vue
      - hooks/pre-build/5450.update_sing_box_rules.sh
      - scripts/optimize-sing-box-routing.py
      - scripts/test-routing-template.py
      - scripts/test-bundled-rules.py
      - scripts/test-rule-hash-retry.sh
      - .github/workflows/rules-release.yml
  pull_request:
    paths:
      - rules
      - rules-release.json
      - src/MagicNet/.config/sing-box
      - src/MagicNet/.config/magicnet/singbox-config-repo.conf
      - src/MagicNet/customize.sh
      - crates/magicnet-cli/src/config_editor.rs
      - webui/src/components/pages/ConfigPage.vue
      - hooks/pre-build/5450.update_sing_box_rules.sh
      - scripts/optimize-sing-box-routing.py
      - scripts/test-routing-template.py
      - scripts/test-bundled-rules.py
      - scripts/test-rule-hash-retry.sh
      - .github/workflows/rules-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rules-release-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Initialize source-only rules and pinned configuration
        run: |
          set -euo pipefail
          git submodule update --init -- rules src/MagicNet/.config/sing-box
          git -C rules rev-list --objects --all | awk '
            $2 ~ /^(dist|sources|sources_binary)(\/|$)/ { bad=1; print }
            END { exit bad }
          '
          git -C rules count-objects -vH
      - name: Regression tests
        run: |
          set -euo pipefail
          python3 scripts/test-routing-template.py -v
          python3 -m unittest discover -s src/MagicNet/.config/sing-box/tests -v
          python3 scripts/test-bundled-rules.py -v
          bash scripts/test-rule-hash-retry.sh
      - name: Download the pinned Release and verify every configured binary rule
        env:
          GH_TOKEN: ${{ github.token }}
          KAM_PROJECT_ROOT: ${{ github.workspace }}
          KAM_HOOKS_ROOT: ${{ github.workspace }}/hooks
          KAM_MODULE_ROOT: ${{ runner.temp }}/rules-release-module
        run: |
          set -euo pipefail
          mkdir -p "$KAM_MODULE_ROOT/.config/sing-box"
          cp src/MagicNet/.config/sing-box/config.json "$KAM_MODULE_ROOT/.config/sing-box/config.json"
          bash hooks/pre-build/5450.update_sing_box_rules.sh
          expected=$(jq '[.route.rule_set[] | select(.type == "local" and (.path | endswith(".srs"))) | .path] | unique | length' "$KAM_MODULE_ROOT/.config/sing-box/config.json")
          test "$expected" -gt 4
          test "$(find "$KAM_MODULE_ROOT/.config/sing-box/rules" -name '*.srs' | wc -l)" -eq "$expected"
          test "$(find "$KAM_MODULE_ROOT/.local/state/sing-box-rules" -name '*.hash' | wc -l)" -eq "$expected"
          git diff --exit-code
          test -z "$(git status --porcelain)"
