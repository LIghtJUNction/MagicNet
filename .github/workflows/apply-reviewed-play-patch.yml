name: Trace Isolated DNS Regression
on:
  push:
    branches: [audit/play-tools-20260916]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1593c79e4e0f14d706bcdaf9652790c29167405b
          persist-credentials: false
      - name: Trace only the isolated synthetic fixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-dns-kernel.py')
          s=p.read_text().replace('set -eu\n', 'set -eux\n', 1)
          s=s.replace('return subprocess.run(args, check=True, text=True, capture_output=True, timeout=15, **kwargs)', '''result = subprocess.run(args, check=False, text=True, capture_output=True, timeout=15, **kwargs)
              if result.returncode:
                  print(result.stdout[-20000:], file=sys.stderr)
                  print(result.stderr[-20000:], file=sys.stderr)
                  result.check_returncode()
              return result''')
          p.write_text(s)
          PY
          python3 scripts/test-dns-kernel.py --require
