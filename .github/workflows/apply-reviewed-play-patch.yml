name: Verify Fresh DNS Chain Repair
on:
  push:
    branches: [audit/play-tools-20260916]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1593c79e4e0f14d706bcdaf9652790c29167405b
          persist-credentials: false
      - name: Apply exact reviewed correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('src/MagicNet/lib/magicnet/network.sh')
          s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='ad09bf77fa43fe2d5e9b8c434c1a9f0e9b184f44feb623ff99ef2f926b1d10e1'
          lines=s.splitlines(True)
          lines[342:342]=['    magicnet_dns_capture_remove_output_jumps "$_install_cmd" || return 1\n']
          lines[338:339]=['    # nft xtables returns rc=2 for -C/-D referencing an absent target chain.\n    # Create the unhooked empty chain first on fresh installs; existing chains\n    # remain untouched until their jumps have been successfully detached.\n']
          s=''.join(lines)
          assert hashlib.sha256(s.encode()).hexdigest()=='081c3a7d4eb67fb8815dd0ff45e3ce53ec76be692cef759fc2b1bc666f6b2a4b'
          p.write_text(s)
          p=Path('scripts/test-dns-output-order.py');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='4803c8a2d96749f1b086b124a1ccf8dd823e9f8db673e6e4fa66985d71c1e590'
          lines=s.splitlines(True)
          lines[88:88]=['        # Real nft xtables validates a jump target even for a missing rule.\n        # An absent custom target is rc=2, not the ordinary no-match rc=1.\n        if action in ("-C", "-D") and "-j" in rule:\n            target = rule[rule.index("-j") + 1]\n            if target == CHAIN and target not in chains:\n                return 2\n']
          s=''.join(lines)
          assert hashlib.sha256(s.encode()).hexdigest()=='82f1e136c28a7aac961f86d63585a4e5e4db9cc6822ad6acf0f26608517fae7c'
          p.write_text(s)
          PY
      - name: Require real isolated DNS and stateful lifecycle checks
        run: |
          set -euo pipefail
          python3 scripts/test-dns-kernel.py --require
          python3 scripts/test-dns-output-order.py
          bash scripts/test-startup-network-safety.sh
          bash scripts/test-kernel-route-lifecycle.sh
      - name: Export only verified blobs without updating branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          blobs=[]
          for name in ('src/MagicNet/lib/magicnet/network.sh','scripts/test-dns-output-order.py'):
              payload=json.dumps({'encoding':'utf-8','content':Path(name).read_text()})
              value=json.loads(subprocess.check_output(['gh','api','--method','POST',
                  'repos/LIghtJUNction/MagicNet/git/blobs','--input','-'],input=payload,text=True))
              blobs.append({'path':name,'mode':'100644','type':'blob','sha':value['sha']})
          path=Path(os.environ['RUNNER_TEMP'])/'verified-network-blobs.json'
          path.write_text(json.dumps(blobs,indent=2)+'\n')
          print(path.read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-network-blobs
          path: ${{ runner.temp }}/verified-network-blobs.json
          if-no-files-found: error
          retention-days: 1
