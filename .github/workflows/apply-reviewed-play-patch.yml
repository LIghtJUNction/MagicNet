name: Verify Guard Journal Preservation
on:
  push:
    branches: [audit/play-tools-20260916]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply reviewed family ownership and fast-path assertions
        run: |
          set -euo pipefail
          cp .github/patches/guard-journal.json "$RUNNER_TEMP/guard-journal.json"
          git checkout --detach a1f9588dfd5bcaf0c62dcc170363888daad8038e
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          updates=json.loads((Path(os.environ['RUNNER_TEMP'])/'guard-journal.json').read_text())
          assert len(updates)==3
          for u in updates:
              p=Path(u['path']);old=p.read_bytes()
              assert hashlib.sha256(old).hexdigest()==u['old']
              lines=old.decode().splitlines(True)
              for start,end,text in reversed(u['changes']): lines[start:end]=[text]
              data=''.join(lines).encode();assert hashlib.sha256(data).hexdigest()==u['new'],u['path'];p.write_bytes(data)
          PY
      - name: Verify missing-tool ownership and scoped family cleanup
        run: |
          set -euo pipefail
          python3 scripts/test-dns-capture-fast-path.py
          bash scripts/test-startup-network-safety.sh
          bash scripts/test-kernel-route-lifecycle.sh
          python3 scripts/test-dns-kernel.py --require
      - name: Export tested blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          updates=json.loads((Path(os.environ['RUNNER_TEMP'])/'guard-journal.json').read_text());blobs=[]
          for u in updates:
              name=u['path'];value=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/LIghtJUNction/MagicNet/git/blobs','--input','-'],input=json.dumps({'encoding':'utf-8','content':Path(name).read_text()}),text=True))
              blobs.append({'path':name,'mode':'100644','type':'blob','sha':value['sha']})
          p=Path(os.environ['RUNNER_TEMP'])/'verified-guard-blobs.json';p.write_text(json.dumps(blobs,indent=2)+'\n');print(p.read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-guard-blobs
          path: ${{ runner.temp }}/verified-guard-blobs.json
          if-no-files-found: error
          retention-days: 1
