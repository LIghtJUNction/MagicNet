name: Build MagicNet

on:
  workflow_dispatch:
    inputs:
      magic-mihomo:
        description: Build with mihomo core
        required: false
        type: boolean
        default: true
      magic-singbox:
        description: Build with sing-box core
        required: false
        type: boolean
        default: true
      release:
        description: Create GitHub release and upload artifacts
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: magicnet-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAGIC_MIHOMO: ${{ inputs.magic-mihomo == false && '0' || '1' }}
      MAGIC_SINGBOX: ${{ inputs.magic-singbox == false && '0' || '1' }}
      KAM_PRIVATE_KEY_AVAILABLE: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_SIGN_ENABLED: ${{ inputs.release == true && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_SIGN_REQUIRED: ${{ inputs.release == true && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      MAGICNET_SIGN_ENABLED: ${{ inputs.release == true && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      MAGICNET_SIGN_REQUIRED: ${{ inputs.release == true && secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      KAM_CHANGELOG_ENABLED: '0'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Cargo and Rustup
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          enable-cache: 'true'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          private-key: ${{ secrets.KAM_PRIVATE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          bun --version
          gh --version

      - name: Build module
        shell: bash
        run: |
          set -euo pipefail
          chmod +x hooks/**/*.sh src/MagicNet/*.sh src/MagicNet/system/bin/* || true
          rm -rf dist
          kam build

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/MagicNet.zip
          unzip -Z1 dist/MagicNet.zip | grep -Fx 'module.prop'
          unzip -Z1 dist/MagicNet.zip | grep -Fx 'customize.sh'
          unzip -Z1 dist/MagicNet.zip | grep -Fx 'META-INF/com/google/android/update-binary'
          unzip -l dist/MagicNet.zip | grep -F 'lib/kamfw/README.md'
          unzip -l dist/MagicNet.zip | grep -F 'lib/magicnet.sh'
          unzip -l dist/MagicNet.zip | grep -F 'boot-completed.sh'
          unzip -l dist/MagicNet.zip | grep -F 'action.sh'
          unzip -Z1 dist/MagicNet.zip | grep -Fx 'webroot/index.html'
          unzip -Z1 dist/MagicNet.zip | grep -E '^webroot/assets/.+\.js$'
          unzip -Z1 dist/MagicNet.zip | grep -E '^webroot/assets/.+\.css$'
          unzip -Z1 dist/MagicNet.zip | grep -Fx '.config/sing-box/zashboard/index.html'
          ! unzip -Z1 dist/MagicNet.zip | grep -E '(^|/)\.git($|/)|(^|/)\.github($|/)|(^|/)\.gitignore$'
          ! unzip -l dist/MagicNet.zip | grep -F 'lib/kamfw/src/'

      - name: Create GitHub release
        if: ${{ inputs.release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml)"
          version_code="$(sed -n 's/^versionCode[[:space:]]*=[[:space:]]*\([0-9]\+\)/\1/p' kam.toml)"
          module_id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml)"
          test -n "$version"
          test -n "$version_code"
          test -n "$module_id"
          test -f "dist/${module_id}.zip"
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found in dist"
            exit 1
          fi
          if [ "${KAM_SIGN_REQUIRED:-0}" = "1" ]; then
            if [ ! -f "dist/${module_id}.zip.sig" ]; then
              echo "::error::Release signing is required, but dist/${module_id}.zip.sig was not produced"
              find dist -maxdepth 1 -type f -print
              exit 1
            fi
          else
            echo "::warning::KAM_PRIVATE_KEY is not configured; creating an unsigned release asset"
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $version already exists in $GITHUB_REPOSITORY"
            exit 1
          fi
          notes="$(mktemp)"
          {
            printf '%s %s\n\n' "$module_id" "$version"
            printf 'Module: %s\n' "$module_id"
            printf 'Version: %s\n' "$version"
            printf 'VersionCode: %s\n\n' "$version_code"
            printf 'Built with Kam.\n'
          } > "$notes"
          release_flags=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          printf 'Release assets:\n'
          printf '  %s\n' "${assets[@]}"
          gh release create "$version" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${module_id}-${version_code}-${version}" \
            --notes-file "$notes" \
            "${release_flags[@]}"

      - name: Upload build artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: MagicNet-module-artifact
          path: dist/*
          if-no-files-found: error
