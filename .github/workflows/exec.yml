name: Build Kam Module

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Prepare a version PR (merge it before publishing)
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      release:
        description: Publish after the version PR merges, or publish current version with bump=none
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: kam-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && inputs.bump != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: magicnet-version-pr
      cancel-in-progress: false
    steps:
      - name: Checkout release base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare version metadata
        id: version
        env:
          BUMP_KIND: ${{ inputs.bump }}
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          # Keep the original main checkout as the PR base. A detached checkout
          # makes the PR action rebase with "theirs" onto a newer remote main.
          git checkout -B main "$GITHUB_SHA"
          python3 scripts/prepare-release.py --bump "$BUMP_KIND"
          git add -- kam.toml src/MagicNet/module.prop update.json .github/release-request
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"

      - name: Create version pull request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: automation/release-${{ steps.version.outputs.version }}
          add-paths: |
            kam.toml
            src/MagicNet/module.prop
            update.json
            .github/release-request
          commit-message: "chore(release): prepare ${{ steps.version.outputs.version }}"
          title: "chore(release): prepare ${{ steps.version.outputs.version }}"
          body: |
            Prepares ${{ steps.version.outputs.version }} with synchronized module metadata.

            Publish after merge: `${{ inputs.release }}`. Prerelease: `${{ inputs.prerelease }}`.
            Review and merge this PR into main. Approve any pending workflow runs on the PR page.
            This automation branch is regenerated when the same version is requested again; avoid editing it directly.

      - name: Report version PR
        if: ${{ always() && steps.version.outcome == 'success' }}
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_TREE: ${{ steps.version.outputs.tree }}
        run: python3 scripts/prepare-release.py --report-pr

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.bump == 'none' || inputs.bump == '' }}
    runs-on: ubuntu-latest
    env:
      KAM_PRIVATE_KEY_AVAILABLE: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      MAGICNET_SIGN_ENABLED: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      MAGICNET_SIGN_REQUIRED: ${{ inputs.release == true && '1' || '0' }}
      KAM_CHANGELOG_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - name: Validate release request
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/prepare-release.py

      - name: Prepare signing verification key
        if: ${{ env.MAGICNET_SIGN_ENABLED == '1' }}
        env:
          SIGNING_KEY_PEM: ${{ secrets.KAM_PRIVATE_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY_PEM" | openssl pkey -pubout \
            -out "$RUNNER_TEMP/magicnet-signing-public.pem"

      - name: Setup Go for forked sing-box
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Test forked sing-box eBPF support
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d "$PWD/.sing-box-ebpf-tests.XXXXXX")"
          cleanup() {
            rm -rf "$test_root"
          }
          trap cleanup EXIT
          (
            cd sing-box
            CGO_ENABLED=0 GOTOOLCHAIN=local GOWORK=off \
              go test -count=1 -mod=readonly -tags with_ebpf \
              ./common/ebpf ./protocol/ebpf ./include ./option
            package_index=0
            for package in ./common/ebpf ./protocol/ebpf ./include ./option; do
              package_index=$((package_index + 1))
              CGO_ENABLED=0 GOOS=android GOARCH=arm64 GOTOOLCHAIN=local GOWORK=off \
                go test -c -mod=readonly -tags with_ebpf \
                -o "$test_root/package-${package_index}.test" "$package"
            done
          )

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@1d6ad8a9f58446a4519fda12a52f0c71fb667d8b # v3
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          cache-targets: cargo,kam
          install-commitizen: "false"
          private-key: ${{ secrets.KAM_PRIVATE_KEY }}

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y binutils file jq ripgrep unzip zip

      - name: Build host sing-box from fork
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/sing-box-host"
          mkdir -p "$install_dir"
          scripts/build-sing-box.sh linux amd64 "$install_dir/sing-box" >/dev/null
          sudo install -m 0755 "$install_dir/sing-box" /usr/local/bin/sing-box
          expected_revision="$(git -C sing-box rev-parse HEAD)"
          version_output="$(sing-box version)"
          grep -F "LIghtJUNction.${expected_revision:0:12}" <<<"$version_output"
          printf '%s\n' "$version_output"

      - name: Install Android Rust targets
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          rm -rf \
            "${sysroot}/lib/rustlib/aarch64-linux-android" \
            "${sysroot}/lib/rustlib/x86_64-linux-android"
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install Android cargo build tool
        run: cargo install cargo-ndk --locked

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          gh --version
          cargo ndk --version

      - name: Build module
        shell: bash
        run: |
          set -euo pipefail
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          rm -rf dist
          kam build

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          module_id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml | head -n1)"
          test -n "$module_id"
          test -f "dist/${module_id}.zip"
          if [ "${MAGICNET_SIGN_ENABLED}" = "1" ]; then
            scripts/verify-artifact-signature.sh "dist/${module_id}.zip" \
              "$RUNNER_TEMP/magicnet-signing-public.pem"
          fi
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'module.prop'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/magicnet-cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/magicnet-mcp-server'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/sing-box'
          if unzip -Z1 "dist/${module_id}.zip" | grep -Eq '(^|/)\.git($|/)'; then
            echo "::error::Module archive contains Git metadata"
            exit 1
          fi
          scripts/package-smoke.sh "dist/${module_id}.zip"
          scripts/package-install-smoke.sh "dist/${module_id}.zip"
          scripts/fake-magisk-smoke.sh "dist/${module_id}.zip"

      - name: Create GitHub release
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        shell: bash
        env:
          PRERELEASE_REQUESTED: ${{ env.RELEASE_PRERELEASE }}
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- kam.toml src/MagicNet/module.prop update.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
                --title "MagicNet-${RELEASE_VERSION_CODE}-${RELEASE_VERSION}" --generate-notes)
          if [ "$PRERELEASE_REQUESTED" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/MagicNet.zip dist/MagicNet.zip.sig "${args[@]}"

      - name: Upload build artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kam-module-artifact
          path: dist/*
          if-no-files-found: error
