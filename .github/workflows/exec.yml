name: Build Kam Module

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected commit for a bot-dispatched version build (empty for manual builds)
        required: false
        type: string
        default: ""
      force_tests:
        description: Ignore previous test results and run every check
        required: false
        type: boolean
        default: false
      bump:
        description: Prepare a version bump on a review branch and open a PR
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      release:
        description: Publish after the version bump, or publish current version with bump=none
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: kam-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_TEST_FORCE: ${{ inputs.force_tests == true && '1' || '0' }}

jobs:
  version-bump:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && inputs.bump != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      pull-requests: write
    concurrency:
      group: magicnet-version-bump
      cancel-in-progress: false
    steps:
      - name: Checkout main for version bump
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare version metadata
        id: version
        env:
          BUMP_KIND: ${{ inputs.bump }}
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          git checkout -B main "$GITHUB_SHA"
          python3 scripts/prepare-release.py --bump "$BUMP_KIND"
          git add -- kam.toml src/MagicNet/module.prop update.json .github/release-request

      - name: Commit version bump on a review branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/version-${VERSION#v}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare ${VERSION}"
          git push --set-upstream origin "HEAD:$branch"
          printf 'Prepared %s on review branch %s at %s\n' "$VERSION" "$branch" "$(git rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Open version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          branch="release/version-${VERSION#v}-${GITHUB_RUN_ID}"
          body_file="$RUNNER_TEMP/version-pr-body"
          {
            printf 'This PR was prepared by the release workflow from the reviewed main commit.\n\n'
            printf '%s\n' "Version: ${VERSION}"
            if [ "$RELEASE_INPUT" = true ]; then
              printf '%s\n' 'Merging this PR requests a release through the normal main push checks.'
              if [ "$PRERELEASE_INPUT" = true ]; then
                printf '%s\n' 'The requested release is a prerelease.'
              fi
            else
              printf '%s\n' 'This is a version-only bump; it does not request a release.'
            fi
          } > "$body_file"
          gh pr create --base main --head "$branch" \
            --title "chore(release): prepare ${VERSION}" \
            --body-file "$body_file"

  # A bot push does not start push workflows. Run the SAME acceptance workflow
  # as a dependency of dispatched releases, at this run's immutable github.sha.
  # No separate dispatch, new credential, or relaxed push-evidence filter.
  release-android:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release == true && (inputs.bump == 'none' || inputs.bump == '') && (inputs.expected_sha == '' || inputs.expected_sha == github.sha) }}
    permissions:
      contents: read
    uses: ./.github/workflows/android-kernelsu-acceptance.yml

  build:
    needs: release-android
    if: ${{ !cancelled() && (needs.release-android.result == 'success' || needs.release-android.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.bump == 'none' || inputs.bump == '') }}
    runs-on: ubuntu-24.04
    env:
      KAM_CHANGELOG_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      CARGO_NDK_VERSION: "4.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Verify dispatched commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main moved after version preparation; refusing to build a different commit"
            exit 1
          fi

      - name: Validate release request
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/prepare-release.py

      # Version preparation must inspect the untouched checkout. Restore
      # generated results only after any bump has been committed and validated.
      - name: Restore per-check test results
        uses: ./.github/actions/test-cache
        with:
          mode: restore

      - name: Verify pinned build submodules
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-submodule-revisions.sh
          git submodule status --recursive > "$RUNNER_TEMP/build-submodules.txt"

      - name: Setup Go for forked sing-box
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@2a0e9193a7e84dc7da78e99af586f8a4bb823bcb
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          # Do not restore ~/.rustup over the freshly installed Rust toolchain.
          cache-targets: kam
          install-commitizen: "false"

      - name: Fingerprint build toolchains
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ] && [ -d "${ANDROID_HOME:-}/ndk" ]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          ndk="${ndk:-/opt/android-ndk}"
          rust_hash="$(rustc -vV | sha256sum | cut -d' ' -f1)"
          ndk_hash="$(sha256sum "$ndk/source.properties" | cut -d' ' -f1)"
          printf 'rust=%s\nndk=%s\n' "$rust_hash" "$ndk_hash" >> "$GITHUB_OUTPUT"
          printf 'singbox=%s\n' "$(git -C sing-box rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('sing-box/go.mod', 'sing-box/go.sum') }}-${{ steps.toolchain.outputs.singbox }}-${{ hashFiles('scripts/build-sing-box.sh', 'sing-box.version') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('sing-box/go.mod', 'sing-box/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Cache Rust dependencies and Android build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'hooks/pre-build/3000.BUILD_CRATES.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v1-${{ hashFiles('webui/bun.lock', 'webui/bun.lockb', 'webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-v1-

      - name: Cache cargo-ndk executable
        id: cargo-ndk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/magicnet/cargo-ndk
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ steps.toolchain.outputs.rust }}

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install Android cargo build tool
        if: ${{ steps.cargo-ndk.outputs.cache-hit != 'true' }}
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --root "$HOME/.cache/magicnet/cargo-ndk"

      - name: Add Android cargo build tool to PATH
        run: echo "$HOME/.cache/magicnet/cargo-ndk/bin" >> "$GITHUB_PATH"

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y binutils busybox-static file jq ripgrep unzip zip python3-yaml shellcheck

      - name: Test forked sing-box eBPF support
        shell: bash
        run: python3 scripts/ci-test-cache.py singbox singbox-ebpf -- bash scripts/test-singbox-ebpf.sh

      - name: Build host sing-box from fork
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/sing-box-host"
          mkdir -p "$install_dir"
          scripts/build-sing-box.sh linux amd64 "$install_dir/sing-box" >/dev/null
          sudo install -m 0755 "$install_dir/sing-box" /usr/local/bin/sing-box
          expected_revision="$(git -C sing-box rev-parse HEAD)"
          version_output="$(sing-box version)"
          grep -F "LIghtJUNction.${expected_revision:0:12}" <<<"$version_output"
          printf '%s\n' "$version_output"
          python3 scripts/test-android-tun-proof.py --check-core "$(command -v sing-box)"
          python3 scripts/test-dns-loopback-listeners.py --core "$(command -v sing-box)"

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          gh --version
          cargo ndk --version

      - name: Build module
        shell: bash
        run: |
          set -euo pipefail
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          rm -rf dist
          kam build
          # KAM's generic exporter points zipUrl at the module archive. MagicNet
          # distributes the incremental installer as its canonical update entry.
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("update.json")
          data = json.loads(path.read_text())
          import os

          data["zipUrl"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/magicnet_installer.zip"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git submodule status --recursive > "$RUNNER_TEMP/built-submodules.txt"
          diff -u "$RUNNER_TEMP/build-submodules.txt" "$RUNNER_TEMP/built-submodules.txt"
          cp "$RUNNER_TEMP/build-submodules.txt" dist/build-submodules.txt

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          module_id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml | head -n1)"
          test -n "$module_id"
          test -f "dist/${module_id}.zip"
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'module.prop'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/magicnet-cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/sing-box'
          if unzip -Z1 "dist/${module_id}.zip" | grep -Eq '(^|/)\.git($|/)'; then
            echo "::error::Module archive contains Git metadata"
            exit 1
          fi
          scripts/package-smoke.sh "dist/${module_id}.zip"
          scripts/package-install-smoke.sh "dist/${module_id}.zip"
          scripts/fake-magisk-smoke.sh "dist/${module_id}.zip"

      - name: Package core, components and offline full module
        shell: bash
        run: |
          set -euo pipefail
          GO111MODULE=off CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w -buildid=' \
              -o "$RUNNER_TEMP/magicnet-components" ./installer/components
          bash scripts/quality-gate.sh components
          python3 scripts/package-components.py dist/MagicNet.zip \
            --helper "$RUNNER_TEMP/magicnet-components" --output dist \
            --repository "$GITHUB_REPOSITORY"
          scripts/package-smoke.sh dist/MagicNet-full.zip
          cat dist/package-sizes.json >> "$GITHUB_STEP_SUMMARY"

      - name: Verify incremental MagicNet installer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-downloader-installer.py dist/magicnet_installer.zip \
            --core dist/MagicNet-core.zip

      - name: Generate release checksums
        run: bash scripts/checksum-release-assets.sh dist

      # A parallel standalone workflow is not a release dependency. Run the
      # SAME shared checks against THIS built checkout, including manual bumps
      # whose [skip ci] commit cannot have a separate quality workflow run.
      - name: Cache release browser binaries
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webui/package-lock.json') }}

      - name: Prepare release quality dependencies
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        run: |
          rustup component add clippy rustfmt
          cd webui
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Compile release acceptance test APK
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        run: |
          scripts/build-android-network-probe.sh --prepare-sdk "$RUNNER_TEMP/magicnet-network-probe.apk"

      - name: Release quality gate
        id: release_quality
        env:
          CI_TEST_FORCE: "1"
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bash scripts/quality-gate.sh all
          git submodule status --recursive > "$RUNNER_TEMP/quality-submodules.txt"
          diff -u "$RUNNER_TEMP/build-submodules.txt" "$RUNNER_TEMP/quality-submodules.txt"
          python3 scripts/prepare-release.py --verify-build

      - name: Require Android acceptance of the release commit
        id: android_acceptance
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        timeout-minutes: 90
        env:
          ANDROID_RESULT: ${{ needs.release-android.result }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # GitHub supplies this dependency result, not a caller input. The
            # local reusable workflow checks out this release's github.sha.
            test "$GITHUB_REF" = refs/heads/main
            test "$ANDROID_RESULT" = success
          else
            python3 scripts/require-android-acceptance.py
          fi

      - name: Create GitHub release
        if: ${{ env.RELEASE_REQUESTED == '1' && steps.release_quality.outcome == 'success' && steps.android_acceptance.outcome == 'success' }}
        shell: bash
        env:
          PRERELEASE_REQUESTED: ${{ env.RELEASE_PRERELEASE }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py --verify-build
          (cd dist && sha256sum -c SHA256SUMS)
          notes_file="$RUNNER_TEMP/magicnet-release-notes.md"
          printf '%s\n\n' "安装器下载：https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/magicnet_installer.zip" > "$notes_file"
          if [ -f "docs/releases/${RELEASE_VERSION}.md" ]; then
            cat "docs/releases/${RELEASE_VERSION}.md" >> "$notes_file"
          fi
          args=(--repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT_SHA"
                --title "MagicNet-${RELEASE_VERSION_CODE}-${RELEASE_VERSION}" \
                --generate-notes --notes-file "$notes_file" --draft)
          if [ "$PRERELEASE_REQUESTED" = "true" ]; then
            args+=(--prerelease)
          fi
          # A failed upload leaves a draft, never a public half-populated release.
          gh release create "$RELEASE_VERSION" dist/* "${args[@]}"
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Save successful per-check results
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/test-cache
        with:
          mode: save

      - name: Upload build artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kam-module-artifact
          path: dist/*
          if-no-files-found: error
