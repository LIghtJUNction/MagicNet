name: Build Kam Module

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Commit a version bump directly to main before building
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      release:
        description: Publish the built version in this run
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark GitHub release as a pre-release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: kam-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KAM_PRIVATE_KEY_AVAILABLE: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      MAGICNET_SIGN_ENABLED: ${{ secrets.KAM_PRIVATE_KEY != '' && '1' || '0' }}
      MAGICNET_SIGN_REQUIRED: ${{ inputs.release == true && '1' || '0' }}
      KAM_CHANGELOG_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      CARGO_NDK_VERSION: "4.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bump and commit version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && inputs.bump != '' }}
        env:
          BUMP_KIND: ${{ inputs.bump }}
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          # Protected main requires a token whose owner may bypass its PR rule.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py --bump "$BUMP_KIND"
          git add -- kam.toml src/MagicNet/module.prop update.json
          if [ -f .github/release-request ]; then
            git add -- .github/release-request
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): bump module version [skip ci]"
          gh auth setup-git
          # Never force-push or rebase a version onto unbuilt concurrent changes.
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Direct push rejected. Check RELEASE_TOKEN/main rules, or start a new run if main advanced. No PR was created."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          printf 'RELEASE_COMMIT_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'Version metadata committed to main: `%s`.\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release request
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/prepare-release.py

      - name: Update submodules to latest remote commits
        run: bash scripts/update-submodules.sh

      - name: Prepare signing verification key
        if: ${{ env.MAGICNET_SIGN_ENABLED == '1' }}
        env:
          SIGNING_KEY_PEM: ${{ secrets.KAM_PRIVATE_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY_PEM" | openssl pkey -pubout \
            -out "$RUNNER_TEMP/magicnet-signing-public.pem"

      - name: Setup Go for forked sing-box
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@1d6ad8a9f58446a4519fda12a52f0c71fb667d8b # v3
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          # Do not restore ~/.rustup over the freshly installed Rust toolchain.
          cache-targets: kam
          install-commitizen: "false"
          private-key: ${{ secrets.KAM_PRIVATE_KEY }}

      - name: Fingerprint build toolchains
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ] && [ -d "${ANDROID_HOME:-}/ndk" ]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          ndk="${ndk:-/opt/android-ndk}"
          rust_hash="$(rustc -vV | sha256sum | cut -d' ' -f1)"
          ndk_hash="$(sha256sum "$ndk/source.properties" | cut -d' ' -f1)"
          printf 'rust=%s\nndk=%s\n' "$rust_hash" "$ndk_hash" >> "$GITHUB_OUTPUT"
          printf 'singbox=%s\n' "$(git -C sing-box rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('sing-box/go.mod', 'sing-box/go.sum') }}-${{ steps.toolchain.outputs.singbox }}-${{ hashFiles('scripts/build-sing-box.sh', 'sing-box.version') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('sing-box/go.mod', 'sing-box/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Cache Rust dependencies and Android build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'hooks/pre-build/3000.BUILD_CRATES.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v1-${{ hashFiles('webui/bun.lock', 'webui/bun.lockb', 'webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-v1-

      - name: Cache cargo-ndk executable
        id: cargo-ndk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/magicnet/cargo-ndk
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ steps.toolchain.outputs.rust }}

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install Android cargo build tool
        if: ${{ steps.cargo-ndk.outputs.cache-hit != 'true' }}
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --root "$HOME/.cache/magicnet/cargo-ndk"

      - name: Add Android cargo build tool to PATH
        run: echo "$HOME/.cache/magicnet/cargo-ndk/bin" >> "$GITHUB_PATH"

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y binutils file jq ripgrep unzip zip

      - name: Test forked sing-box eBPF support
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d "$PWD/.sing-box-ebpf-tests.XXXXXX")"
          cleanup() {
            rm -rf "$test_root"
          }
          trap cleanup EXIT
          (
            cd sing-box
            CGO_ENABLED=0 GOTOOLCHAIN=local GOWORK=off \
              go test -count=1 -mod=readonly -tags with_ebpf \
              ./common/ebpf ./protocol/ebpf ./include ./option
            package_index=0
            for package in ./common/ebpf ./protocol/ebpf ./include ./option; do
              package_index=$((package_index + 1))
              CGO_ENABLED=0 GOOS=android GOARCH=arm64 GOTOOLCHAIN=local GOWORK=off \
                go test -c -mod=readonly -tags with_ebpf \
                -o "$test_root/package-${package_index}.test" "$package"
            done
          )

      - name: Build host sing-box from fork
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/sing-box-host"
          mkdir -p "$install_dir"
          scripts/build-sing-box.sh linux amd64 "$install_dir/sing-box" >/dev/null
          sudo install -m 0755 "$install_dir/sing-box" /usr/local/bin/sing-box
          expected_revision="$(git -C sing-box rev-parse HEAD)"
          version_output="$(sing-box version)"
          grep -F "LIghtJUNction.${expected_revision:0:12}" <<<"$version_output"
          printf '%s\n' "$version_output"

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          gh --version
          cargo ndk --version

      - name: Build module
        shell: bash
        run: |
          set -euo pipefail
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          rm -rf dist
          kam build
          cp submodule-revisions.txt dist/submodule-revisions.txt

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          module_id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml | head -n1)"
          test -n "$module_id"
          test -f "dist/${module_id}.zip"
          if [ "${MAGICNET_SIGN_ENABLED}" = "1" ]; then
            scripts/verify-artifact-signature.sh "dist/${module_id}.zip" \
              "$RUNNER_TEMP/magicnet-signing-public.pem"
          fi
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'module.prop'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/magicnet-cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/magicnet-mcp-server'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/sing-box'
          if unzip -Z1 "dist/${module_id}.zip" | grep -Eq '(^|/)\.git($|/)'; then
            echo "::error::Module archive contains Git metadata"
            exit 1
          fi
          scripts/package-smoke.sh "dist/${module_id}.zip"
          scripts/package-install-smoke.sh "dist/${module_id}.zip"
          scripts/fake-magisk-smoke.sh "dist/${module_id}.zip"

      - name: Create GitHub release
        if: ${{ env.RELEASE_REQUESTED == '1' }}
        shell: bash
        env:
          PRERELEASE_REQUESTED: ${{ env.RELEASE_PRERELEASE }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py --verify-build
          args=(--repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT_SHA"
                --title "MagicNet-${RELEASE_VERSION_CODE}-${RELEASE_VERSION}" --generate-notes)
          if [ "$PRERELEASE_REQUESTED" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/MagicNet.zip dist/MagicNet.zip.sig dist/submodule-revisions.txt "${args[@]}"

      - name: Upload build artifact
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kam-module-artifact
          path: dist/*
          if-no-files-found: error
