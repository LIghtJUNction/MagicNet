name: Retry Android Acceptance
on:
  push:
    branches: [audit/network-acceptance-retry-20260916]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch reviewed test head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = LIghtJUNction/MagicNet
          test "$GITHUB_REF_NAME" = audit/network-acceptance-retry-20260916
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/network-acceptance-20260916" --jq .object.sha)"
          test "$actual" = 7f73c8714d9c4fe827f0a64ab9b70ccf920692be
          gh workflow run android-kernelsu-acceptance.yml --repo "$GITHUB_REPOSITORY" \
            --ref fix/network-acceptance-20260916 -f proxy_region=US -f rounds=1 \
            -F run_speed=false -F fresh_avd=true
