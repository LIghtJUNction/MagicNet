name: Release preparation audit
on:
  push:
    branches: [audit/release-preflight-20260917]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BASE: bf95c400f8e1341e76f5abf6776bbfc00afc4554
      REPAIR: 10a7f46024368091338dcf26768fb41d936f5c39
      EXPECTED_TREE: 3be3ac6f5c49431e5c3a569fec18f1b295cd15a9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Integrate the exact reviewed sources without publishing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preflight"
          cp .ci/resolve-v156.py "$RUNNER_TEMP/resolve-v156.py"
          cp .ci/release-v1.5.6.md "$RUNNER_TEMP/release-v1.5.6.md"
          git checkout --detach "$BASE"
          git config user.name 'MagicNet release preparation'
          git config user.email 'noreply@example.invalid'
          result=0
          git merge --no-commit --no-ff "$REPAIR" || result=$?
          test "$result" = 1
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(files) == {'scripts/fake-magisk-kernel.py','scripts/fake-magisk-smoke.sh','scripts/test-fake-magisk-kernel.py'}, files
          PY
          python3 "$RUNNER_TEMP/resolve-v156.py"
          cp "$RUNNER_TEMP/release-v1.5.6.md" docs/release-v1.5.6.md
          git submodule update --init src/MagicNet/lib/kamfw src/MagicNet/.config/sing-box
      - name: Install test tools and verify the exact candidate tree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq ripgrep shellcheck shfmt busybox
          shfmt -w -i 4 scripts/fake-magisk-smoke.sh
          git add scripts/fake-magisk-kernel.py scripts/fake-magisk-smoke.sh scripts/test-fake-magisk-kernel.py docs/release-v1.5.6.md
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Build exact integrated host CLI
        run: cargo build --locked -p magicnet-cli
      - name: Verify integration regressions
        run: |
          set -o pipefail
          {
            shellcheck scripts/fake-magisk-smoke.sh scripts/test-host.sh
            python3 scripts/test-fake-magisk-kernel.py
            python3 scripts/test-supervisor-zombie.py
            python3 scripts/test-route-ownership.py --all-shells
            python3 scripts/test-start-stop-rollback.py --all-shells
            python3 scripts/test-xtables-registration.py
            python3 scripts/test-dns-output-order.py
            bash scripts/test-supervisor-pid-safety.sh
            bash scripts/test-supervisor-start-policy.sh
          } 2>&1 | tee "$RUNNER_TEMP/preflight/regressions.log"
      - name: Export verified tree objects, not branch or release mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def api(path, data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          files=git('diff','--cached','--name-only').splitlines()
          allowed={'docs/release-v1.5.6.md','scripts/fake-magisk-kernel.py','scripts/fake-magisk-smoke.sh','scripts/test-fake-magisk-kernel.py','scripts/test-host.sh','scripts/test-route-ownership.py','scripts/test-supervisor-zombie.py','src/MagicNet/lib/magicnet/lifecycle.sh','src/MagicNet/lib/magicnet/network.sh','src/MagicNet/lib/magicnet/supervisors.sh'}
          assert set(files)==allowed,files
          tree=[];hashes={}
          for path in sorted(files):
              data=Path(path).read_bytes()
              mode=git('ls-files','-s','--',path).split()[0]
              tree.append({'path':path,'type':'blob','mode':mode,'content':data.decode()})
              hashes[path]=hashlib.sha256(data).hexdigest()
          base_tree=api('/git/commits/'+os.environ['BASE'])['tree']['sha']
          result=api('/git/trees',{'base_tree':base_tree,'tree':tree})
          assert result['sha']==git('write-tree')==os.environ['EXPECTED_TREE']
          receipt={'base':os.environ['BASE'],'repair':os.environ['REPAIR'],'tree':result['sha'],'files':hashes,'published':False}
          (Path(os.environ['RUNNER_TEMP'])/'preflight/tree.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload integration receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1.5.6-candidate-tree
          path: ${{ runner.temp }}/preflight/tree.json
          retention-days: 2
          if-no-files-found: error
      - name: Full fake Magisk lifecycle with both ownership assertions
        run: |
          set -o pipefail
          bash scripts/fake-magisk-smoke.sh 2>&1 | tee "$RUNNER_TEMP/preflight/lifecycle.log"
      - name: Upload all preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1.5.6-integration-evidence
          path: ${{ runner.temp }}/preflight
          retention-days: 2
          if-no-files-found: error
