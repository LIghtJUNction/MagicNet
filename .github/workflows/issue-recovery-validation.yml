name: Issue recovery validation
on:
  push:
    branches: [fix/google-path-config-recovery]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-recovery-source
          path: source-snapshot.tar.gz
          retention-days: 1
