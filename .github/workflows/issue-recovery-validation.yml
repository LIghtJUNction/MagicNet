name: Apply issue recovery patch
on:
  push:
    branches: [fix/google-path-config-recovery]
    paths: [.github/issue-recovery.patch.b64, .github/workflows/issue-recovery-validation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/google-path-config-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9ec53a34c7322c57c36e606487d9aad0af915968 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = pathlib.Path('.github/issue-recovery.patch.b64').read_bytes()
          # Repair the single transport transcription at this exact position;
          # the decoded patch must still match the locally reviewed SHA-256.
          encoded = encoded.replace(b'YvfTt7T/eevr63a', b'YvfTt7+evr63a')
          patch = gzip.decompress(base64.b64decode(encoded))
          expected = 'c2c911fc91450012de0a61fbb8bab60a5fdf02cd3bf728f1b363c22602fc7809'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch; no source changes applied')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/issue-recovery.patch.b64 .github/workflows/issue-recovery-validation.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect config activation and service selector policy' -m 'Refs #253, #254. Add fault regressions and real-core selector validation; prepare v1.5.1 with the existing release quality gate.'
      - name: Push the isolated fix branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/google-path-config-recovery
